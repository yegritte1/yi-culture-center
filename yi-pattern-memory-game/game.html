<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彝族纹样翻翻乐 | Yi Pattern Memory Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: radial-gradient(ellipse at top, #2d1810, #121212);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 50%, rgba(181, 17, 17, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(245, 213, 71, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(212, 175, 55, 0.06) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(5deg); }
            66% { transform: translate(-20px, 20px) rotate(-5deg); }
        }

        .container {
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            font-size: 56px;
            font-weight: bold;
            background: linear-gradient(135deg, #F5D547 0%, #D4AF37 50%, #B51111 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 3px;
            filter: drop-shadow(0 4px 12px rgba(245, 213, 71, 0.3));
        }

        .subtitle {
            font-size: 16px;
            color: #D4AF37;
            letter-spacing: 4px;
            opacity: 0.8;
        }

        /* 统计面板 */
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 35px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .stat-box {
            background: linear-gradient(135deg, rgba(181, 17, 17, 0.15), rgba(139, 0, 0, 0.15));
            backdrop-filter: blur(10px);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 15px 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-3px);
            border-color: rgba(212, 175, 55, 0.6);
            box-shadow: 0 8px 25px rgba(181, 17, 17, 0.3);
        }

        .stat-label {
            font-size: 13px;
            color: #D4AF37;
            margin-bottom: 6px;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #F5D547;
            font-variant-numeric: tabular-nums;
        }

        /* 游戏区域 */
        .game-area {
            background: rgba(18, 18, 18, 0.4);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(181, 17, 17, 0.3);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(245, 213, 71, 0.1);
        }

        /* 游戏网格 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        /* 卡片容器 - 关键：保持网格位置 */
        .card-wrapper {
            aspect-ratio: 1;
            perspective: 1200px;
        }

        /* 卡片 */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg);
            pointer-events: none;
        }

        .card.matched .card-front {
            border-color: #F5D547;
            box-shadow:
                0 0 20px rgba(245, 213, 71, 0.6),
                0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* 卡片面 */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 卡片背面 */
        .card-back {
            background: linear-gradient(135deg, #B51111 0%, #8B0000 100%);
            border: 3px solid #D4AF37;
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.3),
                inset 0 2px 5px rgba(245, 213, 71, 0.2);
        }

        .card-back-content {
            font-size: 70px;
            color: rgba(245, 213, 71, 0.25);
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            user-select: none;
        }

        /* 卡片正面 */
        .card-front {
            background: #fff;
            border: 3px solid #D4AF37;
            transform: rotateY(180deg);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 按钮 */
        .controls {
            text-align: center;
        }

        .btn {
            background: linear-gradient(135deg, #B51111, #8B0000);
            color: #F5D547;
            border: 2px solid #D4AF37;
            padding: 16px 45px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow:
                0 6px 20px rgba(181, 17, 17, 0.4),
                inset 0 1px 0 rgba(245, 213, 71, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(245, 213, 71, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 25px rgba(181, 17, 17, 0.5),
                inset 0 1px 0 rgba(245, 213, 71, 0.3);
            border-color: #F5D547;
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        /* 胜利弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
            animation: modalFade 0.3s ease-out;
        }

        @keyframes modalFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a1a, #2d1810);
            border: 3px solid #D4AF37;
            border-radius: 30px;
            padding: 50px 60px;
            text-align: center;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 100px rgba(181, 17, 17, 0.3);
            animation: modalSlide 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 500px;
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-title {
            font-size: 48px;
            background: linear-gradient(135deg, #F5D547, #D4AF37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
        }

        .modal-stats {
            font-size: 22px;
            color: #D4AF37;
            margin: 20px 0;
            line-height: 1.8;
        }

        .modal-message {
            font-size: 16px;
            color: rgba(245, 213, 71, 0.8);
            margin-bottom: 35px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .title {
                font-size: 36px;
            }

            .game-area {
                padding: 20px;
            }

            .game-grid {
                gap: 12px;
            }

            .stats {
                gap: 15px;
            }

            .stat-box {
                padding: 12px 20px;
            }

            .stat-value {
                font-size: 24px;
            }

            .card-back-content {
                font-size: 50px;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 12px;
            }

            .game-grid {
                gap: 8px;
            }

            .card-back-content {
                font-size: 35px;
            }

            .modal-content {
                padding: 35px 30px;
            }

            .modal-title {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">彝族纹样</h1>
            <p class="subtitle">MEMORY GAME</p>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">步数</div>
                <div class="stat-value" id="moves">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">时间</div>
                <div class="stat-value" id="time">0:00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">配对</div>
                <div class="stat-value" id="pairs">0/8</div>
            </div>
        </div>

        <div class="game-area">
            <div class="game-grid" id="grid"></div>
        </div>

        <div class="controls">
            <button class="btn" onclick="restart()">
                <span>重新开始</span>
            </button>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 class="modal-title">🎉 完成!</h2>
            <div class="modal-stats">
                <p>用时: <span id="finalTime"></span></p>
                <p>步数: <span id="finalMoves"></span></p>
            </div>
            <p class="modal-message">你的记忆力真棒!</p>
            <button class="btn" onclick="restart()">
                <span>再玩一次</span>
            </button>
        </div>
    </div>

    <script>
        const images = [
            'images/sun.jpg',
            'images/flame.jpg',
            'images/tiger.jpg',
            'images/ox-horn.jpg',
            'images/azalea.jpg',
            'images/fern.jpg',
            'images/window.jpg',
            'images/fire-steel.jpg'
        ];

        let cards = [];
        let flipped = [];
        let matched = 0;
        let moves = 0;
        let timer = null;
        let seconds = 0;
        let canFlip = true;

        function init() {
            // 创建卡片对
            const pairs = [...images, ...images];
            cards = pairs.sort(() => Math.random() - 0.5).map((img, i) => ({
                id: i,
                image: img,
                flipped: false,
                matched: false
            }));

            // 渲染
            render();

            // 重置
            matched = 0;
            moves = 0;
            seconds = 0;
            flipped = [];
            canFlip = true;
            updateStats();

            if (timer) clearInterval(timer);
            timer = null;
        }

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            cards.forEach((card, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-wrapper';

                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.dataset.id = i;
                cardEl.onclick = () => flip(i);

                cardEl.innerHTML = `
                    <div class="card-face card-back">
                        <div class="card-back-content">彝</div>
                    </div>
                    <div class="card-face card-front">
                        <img src="${card.image}" alt="纹样">
                    </div>
                `;

                wrapper.appendChild(cardEl);
                grid.appendChild(wrapper);
            });
        }

        function flip(id) {
            if (!canFlip || cards[id].flipped || cards[id].matched || flipped.length >= 2) {
                return;
            }

            // 开始计时
            if (!timer) {
                timer = setInterval(() => {
                    seconds++;
                    updateStats();
                }, 1000);
            }

            // 翻牌
            cards[id].flipped = true;
            flipped.push(id);
            document.querySelector(`[data-id="${id}"]`).classList.add('flipped');

            // 检查匹配
            if (flipped.length === 2) {
                canFlip = false;
                moves++;
                updateStats();

                const [a, b] = flipped;
                if (cards[a].image === cards[b].image) {
                    // 匹配成功
                    setTimeout(() => {
                        cards[a].matched = true;
                        cards[b].matched = true;
                        document.querySelector(`[data-id="${a}"]`).classList.add('matched');
                        document.querySelector(`[data-id="${b}"]`).classList.add('matched');
                        matched++;
                        updateStats();
                        flipped = [];
                        canFlip = true;

                        // 检查胜利
                        if (matched === 8) {
                            clearInterval(timer);
                            setTimeout(showWin, 500);
                        }
                    }, 600);
                } else {
                    // 不匹配
                    setTimeout(() => {
                        cards[a].flipped = false;
                        cards[b].flipped = false;
                        document.querySelector(`[data-id="${a}"]`).classList.remove('flipped');
                        document.querySelector(`[data-id="${b}"]`).classList.remove('flipped');
                        flipped = [];
                        canFlip = true;
                    }, 1000);
                }
            }
        }

        function updateStats() {
            document.getElementById('moves').textContent = moves;
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            document.getElementById('time').textContent = `${m}:${s.toString().padStart(2, '0')}`;
            document.getElementById('pairs').textContent = `${matched}/8`;
        }

        function showWin() {
            const timeText = document.getElementById('time').textContent;
            document.getElementById('finalTime').textContent = timeText;
            document.getElementById('finalMoves').textContent = moves;
            document.getElementById('modal').classList.add('show');
        }

        function restart() {
            document.getElementById('modal').classList.remove('show');
            init();
        }

        // 启动游戏
        init();
    </script>
</body>
</html>
