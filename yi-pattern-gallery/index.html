<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彝族纹样数字画廊 | Yi Ethnic Pattern Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --yi-red: #B51111;
            --yi-yellow: #F5D547;
            --yi-black: #121212;
            --yi-gold: #D4AF37;
            --yi-dark-red: #8B0000;
        }

        body {
            font-family: 'Noto Sans TC', 'Microsoft YaHei', sans-serif;
            background-color: var(--yi-black);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .yi-pattern-bg {
            background-image:
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(181, 17, 17, 0.05) 10px, rgba(181, 17, 17, 0.05) 20px),
                repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(245, 213, 71, 0.03) 10px, rgba(245, 213, 71, 0.03) 20px);
            min-height: 100vh;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.08;
        }

        .bg-circle-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--yi-red), transparent);
            top: 10%;
            left: 10%;
            animation: float1 20s ease-in-out infinite;
        }

        .bg-circle-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--yi-yellow), transparent);
            bottom: 20%;
            right: 10%;
            animation: float2 25s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, -50px) scale(1.15); }
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: linear-gradient(to bottom, rgba(18, 18, 18, 0.95), transparent);
            backdrop-filter: blur(10px);
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--yi-yellow), var(--yi-red), var(--yi-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .lang-switch {
            display: flex;
            gap: 0.5rem;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: rgba(255, 255, 255, 0.7);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .lang-btn:hover,
        .lang-btn.active {
            background: var(--yi-yellow);
            color: var(--yi-black);
            border-color: var(--yi-yellow);
        }

        .back-btn {
            background: rgba(181, 17, 17, 0.3);
            border: 1px solid var(--yi-yellow);
            color: var(--yi-yellow);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: var(--yi-yellow);
            color: var(--yi-black);
        }

        /* Hero 区域 */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8rem 2rem 4rem;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero-title {
            font-family: 'Noto Serif TC', serif;
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--yi-yellow) 0%, var(--yi-red) 50%, var(--yi-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            white-space: nowrap;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 4px;
            margin-bottom: 1.5rem;
        }

        .hero-intro {
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.8;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 搜索框 */
        .search-box {
            max-width: 500px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--yi-yellow);
            background: rgba(255, 255, 255, 0.15);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
        }

        /* 颜色筛选 */
        .color-filter {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }

        .color-btn:hover,
        .color-btn.active {
            transform: scale(1.2);
            border-color: white;
        }

        /* 分类展示 */
        .category-section {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .category-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .category-title span {
            background: linear-gradient(135deg, var(--yi-yellow), var(--yi-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .category-line {
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--yi-red), var(--yi-yellow), transparent);
        }

        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .pattern-card {
            background: linear-gradient(135deg, rgba(181, 17, 17, 0.1), rgba(139, 0, 0, 0.05));
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
        }

        .pattern-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(212, 175, 55, 0.6);
            box-shadow: 0 20px 40px rgba(181, 17, 17, 0.3);
        }

        .card-image {
            width: 100%;
            height: 200px;
            position: relative;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .pattern-card:hover .card-image img {
            transform: scale(1.1);
        }

        .card-content {
            padding: 1.5rem;
        }

        .card-category {
            font-size: 0.75rem;
            color: var(--yi-yellow);
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            opacity: 0.8;
        }

        .card-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: white;
        }

        .card-desc {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 详情弹窗 */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a1a, #2d1810);
            border: 2px solid var(--yi-gold);
            border-radius: 24px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(181, 17, 17, 0.5);
            border: 1px solid var(--yi-yellow);
            color: var(--yi-yellow);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }

        .modal-close:hover {
            background: var(--yi-yellow);
            color: var(--yi-black);
        }

        .modal-body {
            padding: 2rem;
        }

        .modal-image {
            width: 100%;
            height: 300px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .modal-category {
            color: var(--yi-yellow);
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .modal-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--yi-yellow), var(--yi-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-aliases {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .info-section {
            margin-bottom: 1.5rem;
        }

        .info-title {
            font-weight: 600;
            color: var(--yi-gold);
            margin-bottom: 0.5rem;
        }

        .info-text {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
        }

        /* 页脚 */
        .footer {
            padding: 3rem 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            margin-top: 4rem;
            position: relative;
            z-index: 1;
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
            }

            .nav-right {
                gap: 0.5rem;
            }

            .lang-btn {
                padding: 0.2rem 0.4rem;
                font-size: 0.7rem;
            }

            .hero {
                padding: 6rem 1rem 3rem;
            }

            .hero-title {
                font-size: clamp(2rem, 8vw, 3rem);
                white-space: normal;
            }

            .category-section {
                padding: 1rem;
            }

            .pattern-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .modal.show {
                padding: 1rem;
            }
        }

        /* 无结果提示 */
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .no-results h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="yi-pattern-bg">
        <!-- 背景装饰 -->
        <div class="bg-decoration">
            <div class="bg-circle bg-circle-1"></div>
            <div class="bg-circle bg-circle-2"></div>
        </div>

        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="nav-content">
                <div class="logo" id="navTitle">彝族纹样数字画廊</div>
                <div class="nav-right">
                    <div class="lang-switch">
                        <button class="lang-btn active" data-lang="zh">中文</button>
                        <button class="lang-btn" data-lang="en">EN</button>
                        <button class="lang-btn" data-lang="jp">日本語</button>

                    <a href="../index.html" class="back-btn" id="backBtn">← 返回</a>
                </div>
            </div>
        </nav>

        <!-- Hero 区域 -->
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title" id="heroTitle">彝族纹样数字画廊</h1>
                <p class="hero-subtitle" id="heroSubtitle">探索千年传承的民族艺术之美</p>
                <p class="hero-intro" id="heroIntro">
                    彝族纹样是彝族文化的瑰宝，每一个图案都承载着深厚的文化内涵和民族精神。从天地气象到飞禽走兽，从花草树木到日常器物，这些纹样记录了彝族人民与自然和谐共生的智慧。
                </p>

                <!-- 搜索框 -->
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索纹样名称或文化内涵...">
                </div>

                <!-- 颜色筛选 -->
                <div class="color-filter" id="colorFilter">
                    <button class="color-btn active" data-color="" style="background: linear-gradient(135deg, #B51111, #F5D547, #121212);" title="全部"></button>
                    <button class="color-btn" data-color="#B51111" style="background: #B51111;" title="红色"></button>
                    <button class="color-btn" data-color="#F5D547" style="background: #F5D547;" title="黄色"></button>
                    <button class="color-btn" data-color="#D4AF37" style="background: #D4AF37;" title="金色"></button>
                    <button class="color-btn" data-color="#121212" style="background: #121212; border: 1px solid #333;" title="黑色"></button>
                    <button class="color-btn" data-color="#8B7355" style="background: #8B7355;" title="棕色"></button>
                    <button class="color-btn" data-color="#50C878" style="background: #50C878;" title="绿色"></button>
                    <button class="color-btn" data-color="#4A90E2" style="background: #4A90E2;" title="蓝色"></button>
                </div>
            </div>
        </section>

        <!-- 纹样画廊 -->
        <section class="gallery" id="gallery">
            <div id="patternContainer"></div>
        </section>

        <!-- 详情弹窗 -->
        <div class="modal" id="modal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal()">×</button>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="footer">
            <p class="footer-text" id="footerText">
                Made with ❤️ for Yi Culture Heritage | 传承彝族文化
            </p>
        </footer>
    </div>

              visuals: { zh: '规整的网格结构，以直线、直角、对称为核心。', en: 'Regular grid with straight lines and right angles.', jp: '整然としたグリッド構造。' },

        ];

        // 当前状态
        let currentLang = 'zh';
        let currentCategory = 'all';
        let currentColor = '';
        let searchQuery = '';

        // 翻译函数
        function t(key) {
            return translations[currentLang][key] || key;
        }

        // 获取纹样名称
        function getPatternName(pattern) {
            return pattern.name[currentLang] || pattern.name.zh;
        }

        // 获取分类名称
        function getCategoryName(category) {
            return translations[currentLang].categories[category] || category;
        }

        // 更新界面文本
        function updateUI() {
            document.getElementById('navTitle').textContent = translations[currentLang].nav.home;
            document.getElementById('heroTitle').textContent = translations[currentLang].home.title;
            document.getElementById('heroSubtitle').textContent = translations[currentLang].home.subtitle;
            document.getElementById('heroIntro').textContent = translations[currentLang].home.intro;
            document.getElementById('searchInput').placeholder = translations[currentLang].home.searchPlaceholder;
            document.getElementById('backBtn').textContent = translations[currentLang].nav.back;
            document.getElementById('footerText').textContent = 'Made with ❤️ for Yi Culture Heritage | ' + translations[currentLang].footer.copyright;

            // 更新语言按钮
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });

            renderPatterns();
        }

        // 过滤纹样
        function getFilteredPatterns() {
            return patternsData.filter(p => {
                // 分类过滤
                if (currentCategory !== 'all' && p.category !== currentCategory) return false;

                // 颜色过滤
                if (currentColor && !p.colors.includes(currentColor)) return false;

                // 搜索过滤
                if (searchQuery) {
                    const query = searchQuery.toLowerCase();
                    const name = getPatternName(p).toLowerCase();
                    const meaning = (p.meaning[currentLang] || p.meaning.zh).toLowerCase();
                    if (!name.includes(query) && !meaning.includes(query)) return false;
                }

                return true;
            });
        }

        // 渲染纹样卡片
        function renderPatterns() {
            const container = document.getElementById('patternContainer');
            const filtered = getFilteredPatterns();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <h3>${translations[currentLang].noResults}</h3>
                    </div>
                `;
                return;
            }

            // 按分类分组
            const categories = ['celestial', 'animal', 'plant', 'artifact'];
            let html = '';

            categories.forEach(cat => {
                const catPatterns = filtered.filter(p => p.category === cat);
                if (catPatterns.length === 0) return;

                html += `
                    <div class="category-section">
                        <h2 class="category-title">
                            <span>${getCategoryName(cat)}</span>
                            <div class="category-line"></div>
                        </h2>
                        <div class="pattern-grid">
                            ${catPatterns.map(p => `
                                <div class="pattern-card" onclick="openModal('${p.id}')">
                                    <div class="card-image">
                                        <img src="${p.image}" alt="${getPatternName(p)}" loading="lazy">
                                    </div>
                                    <div class="card-content">
                                        <div class="card-category">${getCategoryName(p.category)}</div>
                                        <h3 class="card-title">${getPatternName(p)}</h3>
                                        <p class="card-desc">${p.meaning[currentLang] || p.meaning.zh}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 打开详情弹窗
        function openModal(id) {
            const pattern = patternsData.find(p => p.id === id);
            if (!pattern) return;

            const modalBody = document.getElementById('modalBody');
            const d = translations[currentLang].detail;

            modalBody.innerHTML = `
                <div class="modal-image">
                    <img src="${pattern.image}" alt="${getPatternName(pattern)}">
                </div>
                <div class="modal-category">${getCategoryName(pattern.category)}</div>
                <h2 class="modal-title">${getPatternName(pattern)}</h2>
                <p class="modal-aliases">${d.aliases}: ${pattern.aliases[currentLang] || pattern.aliases.zh}</p>

                <div class="info-section">
                    <div class="info-title">${d.origin}</div>
                    <div class="info-text">${pattern.origin[currentLang] || pattern.origin.zh}</div>
                </div>

                <div class="info-section">
                    <div class="info-title">${d.visuals}</div>
                    <div class="info-text">${pattern.visuals[currentLang] || pattern.visuals.zh}</div>
                </div>

                <div class="info-section">
                    <div class="info-title">${d.meaning}</div>
                    <div class="info-text">${pattern.meaning[currentLang] || pattern.meaning.zh}</div>
                </div>

                <div class="info-section">
                    <div class="info-title">${d.usage}</div>
                    <div class="info-text">${pattern.usage[currentLang] || pattern.usage.zh}</div>
                </div>
            `;

            document.getElementById('modal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            document.body.style.overflow = '';
        }

        // 事件监听
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentLang = btn.dataset.lang;
                updateUI();
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderPatterns();
        });

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = btn.dataset.color;
                renderPatterns();
            });
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // 初始化
        updateUI();
    </script>
</body>
</html>
