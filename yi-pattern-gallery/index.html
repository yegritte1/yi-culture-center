<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彝族纹样数字画廊 | Yi Ethnic Pattern Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --yi-red: #B51111;
            --yi-yellow: #F5D547;
            --yi-black: #121212;
            --yi-gold: #D4AF37;
            --yi-dark-red: #8B0000;
        }

        body {
            font-family: 'Noto Sans TC', 'Microsoft YaHei', sans-serif;
            background-color: var(--yi-black);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .yi-pattern-bg {
            background-image:
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(181, 17, 17, 0.05) 10px, rgba(181, 17, 17, 0.05) 20px),
                repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(245, 213, 71, 0.03) 10px, rgba(245, 213, 71, 0.03) 20px);
            min-height: 100vh;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.08;
        }

        .bg-circle-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--yi-red), transparent);
            top: 10%;
            left: 10%;
            animation: float1 20s ease-in-out infinite;
        }

        .bg-circle-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--yi-yellow), transparent);
            bottom: 20%;
            right: 10%;
            animation: float2 25s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, -50px) scale(1.15); }
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: linear-gradient(to bottom, rgba(18, 18, 18, 0.95), transparent);
            backdrop-filter: blur(10px);
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--yi-yellow), var(--yi-red), var(--yi-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .lang-switch {
            display: flex;
            gap: 0.5rem;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: rgba(255, 255, 255, 0.7);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .lang-btn:hover,
        .lang-btn.active {
            background: var(--yi-yellow);
            color: var(--yi-black);
            border-color: var(--yi-yellow);
        }

        .back-btn {
            background: rgba(181, 17, 17, 0.3);
            border: 1px solid var(--yi-yellow);
            color: var(--yi-yellow);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: var(--yi-yellow);
            color: var(--yi-black);
        }

        /* Hero 区域 */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8rem 2rem 4rem;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero-title {
            font-family: 'Noto Serif TC', serif;
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--yi-yellow) 0%, var(--yi-red) 50%, var(--yi-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            white-space: nowrap;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 4px;
            margin-bottom: 1.5rem;
        }

        .hero-intro {
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.8;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 搜索框 */
        .search-box {
            max-width: 500px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--yi-yellow);
            background: rgba(255, 255, 255, 0.15);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
        }

        /* 颜色筛选 */
        .color-filter {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }

        .color-btn:hover,
        .color-btn.active {
            transform: scale(1.2);
            border-color: white;
        }

        /* 分类展示 */
        .category-section {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .category-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .category-title span {
            background: linear-gradient(135deg, var(--yi-yellow), var(--yi-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .category-line {
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--yi-red), var(--yi-yellow), transparent);
        }

        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .pattern-card {
            background: linear-gradient(135deg, rgba(181, 17, 17, 0.1), rgba(139, 0, 0, 0.05));
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
        }

        .pattern-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(212, 175, 55, 0.6);
            box-shadow: 0 20px 40px rgba(181, 17, 17, 0.3);
        }

        .card-image {
            width: 100%;
            height: 200px;
            position: relative;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .pattern-card:hover .card-image img {
            transform: scale(1.1);
        }

        .card-content {
            padding: 1.5rem;
        }

        .card-category {
            font-size: 0.75rem;
            color: var(--yi-yellow);
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            opacity: 0.8;
        }

        .card-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: white;
        }

        .card-desc {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 翻译手册 */
        .translation-guide-section {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto 3rem;
        }

        .translation-guide-panel {
            background: linear-gradient(135deg, rgba(181, 17, 17, 0.12), rgba(212, 175, 55, 0.08));
            border: 2px solid rgba(212, 175, 55, 0.25);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .translation-guide-intro {
            color: rgba(255, 255, 255, 0.68);
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }

        .translation-guide-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .translation-guide-grid img {
            width: 100%;
            border-radius: 14px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
            background: rgba(255, 255, 255, 0.04);
        }

        /* 详情弹窗 */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a1a, #2d1810);
            border: 2px solid var(--yi-gold);
            border-radius: 24px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(181, 17, 17, 0.5);
            border: 1px solid var(--yi-yellow);
            color: var(--yi-yellow);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }

        .modal-close:hover {
            background: var(--yi-yellow);
            color: var(--yi-black);
        }

        .modal-body {
            padding: 2rem;
        }

        .modal-image {
            width: 100%;
            height: 300px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .modal-category {
            color: var(--yi-yellow);
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .modal-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--yi-yellow), var(--yi-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-aliases {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .info-section {
            margin-bottom: 1.5rem;
        }

        .info-title {
            font-weight: 600;
            color: var(--yi-gold);
            margin-bottom: 0.5rem;
        }

        .info-text {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
        }

        /* 页脚 */
        .footer {
            padding: 3rem 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            margin-top: 4rem;
            position: relative;
            z-index: 1;
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
            }

            .nav-right {
                gap: 0.5rem;
            }

            .lang-btn {
                padding: 0.2rem 0.4rem;
                font-size: 0.7rem;
            }

            .hero {
                padding: 6rem 1rem 3rem;
            }

            .hero-title {
                font-size: clamp(2rem, 8vw, 3rem);
                white-space: normal;
            }

            .category-section {
                padding: 1rem;
            }

            .pattern-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .modal.show {
                padding: 1rem;
            }
        }

        /* 无结果提示 */
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .no-results h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

            'sun-moon': {
                zh: { origin: `日月纹以太阳和月亮为主要原型，是彝绣中表现天象、时间流转与自然秩序的代表性纹样。彝族先民在山地生活中观察日升月落、昼夜交替与四季循环，并将这些经验转化为富有节奏的刺绣图形。`, visuals: `纹样常以圆形、半圆、弯月、放射线、圆点、锯齿边和同心圆组合而成，太阳与月亮可左右并列、上下呼应，也可与星纹、火焰纹、波浪纹共同排列。红、黄、橙突出太阳的光热感，蓝、白、绿和深色则营造月夜与天空的宁静氛围。`, meaning: `日月纹象征光明、时间、生命、平衡与循环不息。太阳代表温暖、活力与希望，月亮代表宁静、守护与陪伴，二者相伴体现不同力量的互补共生。`, usage: `日月纹常见于衣襟、胸背、肩部、袖口、裙摆、围腰、帽饰和挎包等位置，可作为中心纹样，也可作为自然意象组合的一部分。当代设计中，它适用于服装、首饰、家居、文创、品牌视觉和数字动画，继续传递光明、平衡与生命延续的寓意。` },
                en: { origin: `The Sun-and-Moon motif takes the sun and moon as its main visual prototypes and is a representative Yi embroidery pattern for celestial phenomena, the passage of time, and natural order. Living in mountainous regions, Yi communities observed sunrise and sunset, lunar phases, day-and-night alternation, and seasonal cycles, turning these experiences into rhythmic embroidered forms.`, visuals: `It is commonly built from circles, semicircles, crescents, radiating lines, dots, serrated edges, and concentric rings. The sun and moon may appear side by side, vertically aligned, or combined with star, flame, and wave motifs; warm reds, yellows, and oranges suggest solar heat, while blues, whites, greens, and dark tones evoke a quiet moonlit sky.`, meaning: `The motif symbolizes light, time, life, balance, and endless renewal. The sun stands for warmth, vitality, and hope, while the moon suggests calmness, protection, and companionship; together they express complementary forces living in harmony.`, usage: `It often appears on front panels, chests, backs, shoulders, cuffs, hems, aprons, headdresses, and shoulder bags, either as a central image or as part of a larger natural composition. In contemporary design, it can be applied to clothing, jewelry, homeware, cultural products, brand identity, and digital animation while preserving its meanings of light, balance, and continuity of life.` },
                jp: { origin: `日月文様は太陽と月を主要な原型とし、天体現象、時間の流れ、自然の秩序を表すイ族刺繍の代表的な文様です。山地で暮らしてきたイ族の人々は、日の出と日の入り、月の満ち欠け、昼夜の交替、四季の循環を観察し、それをリズミカルな刺繍表現へと変えました。`, visuals: `円、半円、三日月形を中心に、放射状の線、点、鋸歯状の縁、弧線、同心円などを組み合わせて構成されます。太陽と月は左右に並ぶほか上下に呼応し、星文様、火炎文様、波文様と組み合わされることもあり、赤・黄・橙は太陽の熱を、青・白・緑・濃色は月夜の静けさを表します。`, meaning: `日月文様は光、時間、生命、均衡、絶え間ない循環を象徴します。太陽は温かさ、活力、希望を表し、月は静けさ、守護、寄り添いを表すため、両者の共存は異なる力の補完と調和を示します。`, usage: `前身頃、胸、背中、肩、袖口、裾、前掛け、頭飾り、肩掛け袋などに用いられ、中心文様にも自然モチーフの組み合わせにもなります。現代では衣服、装身具、生活用品、文化商品、ブランドビジュアル、デジタルアニメーションに応用され、光、均衡、生命の継続という意味を伝え続けます。` },
                fr: { name: `Motif du Soleil et de la Lune`, aliases: `Motif solaire et lunaire`, origin: `Le motif du Soleil et de la Lune prend les deux astres comme formes principales et compte parmi les motifs représentatifs de la broderie yi liés au ciel, au temps et à l’ordre naturel. Les communautés yi des régions montagneuses ont observé le lever et le coucher du soleil, les phases lunaires, l’alternance du jour et de la nuit et le cycle des saisons, puis les ont transformés en formes brodées rythmées.`, visuals: `Il se compose souvent de cercles, demi-cercles, croissants, rayons, points, bords dentelés et anneaux concentriques. Le soleil et la lune peuvent être placés côte à côte, en écho vertical ou associés à des étoiles, flammes et vagues ; les rouges, jaunes et orangés évoquent la chaleur solaire, tandis que les bleus, blancs, verts et tons sombres suggèrent le calme du ciel nocturne.`, meaning: `Ce motif symbolise la lumière, le temps, la vie, l’équilibre et le renouvellement continu. Le soleil représente la chaleur, l’énergie et l’espoir, tandis que la lune évoque le calme, la protection et l’accompagnement ; ensemble, ils expriment la complémentarité harmonieuse de forces différentes.`, usage: `On le retrouve sur les devants, la poitrine, le dos, les épaules, les poignets, les ourlets, les tabliers, les coiffes et les sacs, comme motif central ou élément d’une composition naturelle. Aujourd’hui, il peut être adapté aux vêtements, bijoux, objets domestiques, produits culturels, identités visuelles et animations numériques, en conservant ses valeurs de lumière, d’équilibre et de continuité de la vie.` },
                de: { name: `Sonne-und-Mond-Motiv`, aliases: `Sonnen- und Mondmuster`, origin: `Das Sonne-und-Mond-Motiv nutzt Sonne und Mond als wichtigste Bildformen und gehört zu den repräsentativen Yi-Stickmustern für Himmelserscheinungen, Zeitverlauf und natürliche Ordnung. Die Yi-Gemeinschaften in Bergregionen beobachteten Sonnenaufgang und Sonnenuntergang, Mondphasen, den Wechsel von Tag und Nacht sowie den Kreislauf der Jahreszeiten und übertrugen diese Erfahrungen in rhythmische Stickformen.`, visuals: `Das Motiv besteht häufig aus Kreisen, Halbkreisen, Mondsicheln, Strahlen, Punkten, gezackten Rändern und konzentrischen Ringen. Sonne und Mond können nebeneinander, übereinander oder zusammen mit Stern-, Flammen- und Wellenmotiven erscheinen; Rot, Gelb und Orange betonen Sonnenwärme, während Blau, Weiß, Grün und dunkle Töne die Ruhe des Nachthimmels hervorrufen.`, meaning: `Es symbolisiert Licht, Zeit, Leben, Gleichgewicht und fortwährende Erneuerung. Die Sonne steht für Wärme, Lebenskraft und Hoffnung, der Mond für Ruhe, Schutz und Begleitung; gemeinsam zeigen sie das harmonische Zusammenspiel unterschiedlicher, einander ergänzender Kräfte.`, usage: `Das Motiv findet sich auf Vorderteilen, Brust, Rücken, Schultern, Ärmelabschlüssen, Säumen, Schürzen, Kopfbedeckungen und Taschen, sowohl als zentrales Bild als auch als Teil größerer Naturkompositionen. In zeitgenössischem Design eignet es sich für Kleidung, Schmuck, Wohnprodukte, Kulturwaren, visuelle Identitäten und digitale Animationen und bewahrt dabei seine Bedeutungen von Licht, Gleichgewicht und Lebensfortdauer.` },
                es: { name: `Motivo del Sol y la Luna`, aliases: `Motivo solar y lunar`, origin: `El motivo del Sol y la Luna toma ambos astros como sus principales formas visuales y es uno de los diseños representativos del bordado yi relacionados con el cielo, el paso del tiempo y el orden natural. Las comunidades yi de zonas montañosas observaron la salida y la puesta del sol, las fases lunares, la alternancia del día y la noche y el ciclo de las estaciones, transformando esas experiencias en formas bordadas rítmicas.`, visuals: `Suele componerse de círculos, semicírculos, medias lunas, rayos, puntos, bordes dentados y anillos concéntricos. El sol y la luna pueden aparecer juntos, en correspondencia vertical o combinados con estrellas, llamas y olas; los rojos, amarillos y naranjas expresan el calor solar, mientras que azules, blancos, verdes y tonos oscuros evocan la calma del cielo nocturno.`, meaning: `El motivo simboliza luz, tiempo, vida, equilibrio y renovación constante. El sol representa calor, vitalidad y esperanza, mientras que la luna sugiere calma, protección y compañía; juntos expresan la armonía entre fuerzas distintas pero complementarias.`, usage: `Aparece en delanteros, pecho, espalda, hombros, puños, dobladillos, delantales, tocados y bolsos, ya sea como motivo central o como parte de una composición natural más amplia. En el diseño contemporáneo puede aplicarse a ropa, joyería, objetos domésticos, productos culturales, identidad visual y animación digital, manteniendo sus significados de luz, equilibrio y continuidad de la vida.` }
            },
            flame: {
                zh: { origin: `火焰纹源于彝族深厚的火崇拜传统，火在彝族生活中与取暖、熟食、照明、祭祀和族群记忆紧密相连。彝族常被称为“火的民族”，火把节等习俗也使火成为文明、生命与共同体凝聚力的重要象征。`, visuals: `纹样多以向上跃动的火苗、尖角、弧线和层叠形态构成，线条具有升腾感和节奏感。色彩常采用红、黄、橙以及黑色衬底，既突出火焰的热烈，也形成彝绣中鲜明强烈的视觉对比。`, meaning: `火焰纹象征光明、温暖、希望、生命力和驱邪避灾的力量。火光照亮黑夜，也寓意家族火塘不灭、族群生命延续和人们对兴旺生活的祝愿。`, usage: `火焰纹广泛用于日常服饰、节庆盛装、火把节相关服饰、围腰、披毡和装饰边饰。现代设计中，它适合用于舞台服装、文创产品、节庆视觉和动态影像，能够强化热烈、勇敢和向上的气质。` },
                en: { origin: `The Flame motif grows from the Yi people’s long tradition of fire worship, where fire is tied to warmth, cooked food, light, ritual, and collective memory. Customs such as the Torch Festival make fire a vital symbol of civilization, life, and communal cohesion.`, visuals: `It is usually formed by upward-leaping flames, sharp points, curved lines, and layered shapes, creating a strong sense of rising movement. Red, yellow, and orange are often set against black grounds, producing the intense contrast characteristic of Yi embroidery.`, meaning: `The motif symbolizes light, warmth, hope, vitality, and the power to dispel misfortune. Fire illuminating the night also suggests an undying family hearth, the continuation of the community, and wishes for a flourishing life.`, usage: `It is widely used on daily clothing, festival attire, Torch Festival garments, aprons, capes, and decorative borders. In modern design, it suits stage costumes, cultural products, festival visuals, and motion graphics, emphasizing passion, courage, and upward energy.` },
                jp: { origin: `火炎文様は、イ族に深く根づく火への信仰に由来し、火は暖を取ること、調理、照明、祭祀、共同体の記憶と密接に結びついています。イ族はしばしば「火の民族」と呼ばれ、火把節などの習俗によって、火は文明、生命、共同体の結束を象徴するものとなりました。`, visuals: `上へ跳ね上がる炎、尖った形、弧線、重なり合う形態で構成され、全体に上昇するリズムがあります。赤、黄、橙を黒地に配することが多く、炎の熱気とイ族刺繍らしい強い対比を生み出します。`, meaning: `火炎文様は光、温かさ、希望、生命力、災いを払う力を象徴します。闇を照らす火は、家の火塘が絶えないこと、共同体の生命が続くこと、暮らしが栄えることへの願いも表しています。`, usage: `日常衣装、祭礼衣装、火把節の装い、前掛け、披毡、縁飾りなどに広く用いられます。現代では舞台衣装、文化商品、祭りのビジュアル、モーショングラフィックスに応用でき、熱烈さ、勇気、上昇する力を強調します。` },
                fr: { name: `Motif de flamme`, aliases: `Motif du feu`, origin: `Le motif de flamme vient de la profonde tradition yi de vénération du feu, lié à la chaleur, à la cuisson, à la lumière, aux rites et à la mémoire collective. Des coutumes comme la Fête des Torches font du feu un symbole essentiel de civilisation, de vie et de cohésion communautaire.`, visuals: `Il se compose généralement de flammes montantes, de pointes, de courbes et de formes superposées, créant une impression d’élan ascendant. Le rouge, le jaune et l’orange sont souvent posés sur un fond noir, ce qui renforce la chaleur du feu et le contraste puissant de la broderie yi.`, meaning: `Il symbolise la lumière, la chaleur, l’espoir, la vitalité et la force capable d’éloigner le malheur. La flamme qui éclaire la nuit évoque aussi le foyer familial inextinguible, la continuité du groupe et le souhait d’une vie prospère.`, usage: `Le motif est largement utilisé sur les vêtements quotidiens, les habits de fête, les tenues de la Fête des Torches, les tabliers, les capes et les bordures décoratives. Dans la création actuelle, il convient aux costumes de scène, produits culturels, visuels festifs et animations, où il exprime ardeur, courage et énergie ascendante.` },
                de: { name: `Flammenmuster`, aliases: `Feuermuster`, origin: `Das Flammenmuster entspringt der tief verwurzelten Feuerverehrung der Yi, in der Feuer mit Wärme, gekochter Nahrung, Licht, Ritualen und gemeinsamer Erinnerung verbunden ist. Bräuche wie das Fackelfest machen Feuer zu einem wichtigen Symbol für Zivilisation, Leben und Zusammenhalt.`, visuals: `Es besteht meist aus aufwärts züngelnden Flammen, Spitzen, gebogenen Linien und geschichteten Formen, die eine deutliche Aufwärtsbewegung erzeugen. Rot, Gelb und Orange werden häufig vor schwarzem Grund eingesetzt und schaffen den kräftigen Kontrast, der für Yi-Stickerei typisch ist.`, meaning: `Das Muster steht für Licht, Wärme, Hoffnung, Lebenskraft und die Fähigkeit, Unheil abzuwehren. Das Feuer, das die Nacht erhellt, verweist zugleich auf den nie erlöschenden Familienherd, die Fortdauer der Gemeinschaft und den Wunsch nach einem gedeihenden Leben.`, usage: `Es wird häufig auf Alltagskleidung, Festtrachten, Kleidung zum Fackelfest, Schürzen, Umhängen und dekorativen Bordüren verwendet. Im modernen Design eignet es sich für Bühnenkostüme, Kulturprodukte, Festvisuals und Animationen und vermittelt Leidenschaft, Mut und aufsteigende Energie.` },
                es: { name: `Motivo de llama`, aliases: `Motivo de fuego`, origin: `El motivo de llama procede de la profunda tradición yi de veneración del fuego, relacionado con el calor, la comida cocinada, la luz, los rituales y la memoria colectiva. Costumbres como la Fiesta de las Antorchas convierten el fuego en un símbolo esencial de civilización, vida y cohesión comunitaria.`, visuals: `Suele formarse con llamas ascendentes, puntas, líneas curvas y formas superpuestas que producen una sensación de elevación rítmica. El rojo, el amarillo y el naranja se combinan a menudo con fondos negros, creando el contraste intenso propio del bordado yi.`, meaning: `Simboliza luz, calor, esperanza, vitalidad y la fuerza para alejar la desgracia. La llama que ilumina la noche también evoca el hogar familiar que no se apaga, la continuidad del grupo y el deseo de una vida próspera.`, usage: `Se usa ampliamente en ropa cotidiana, atuendos festivos, prendas de la Fiesta de las Antorchas, delantales, capas y bordes decorativos. En el diseño actual funciona en vestuario escénico, productos culturales, gráficas festivas y animación, reforzando una sensación de pasión, valentía y energía ascendente.` }
            },
            sun: {
                zh: { origin: `太阳纹源于彝族对太阳的长期崇敬，太阳被视为带来光明、热量和生命生长的重要力量。山地生活中，日照关系到农事节律、季节更替和生活安定，因此太阳意象逐渐被提炼为具有图腾意味的纹样。`, visuals: `纹样通常以圆形为中心，外部配以放射状光芒、三角齿、短线、圆点或多角结构，常见八角、十角或十二角形式。红、黄、橙等暖色强化光热感，黑色或深色底纹则使太阳形象更加醒目庄重。`, meaning: `太阳纹象征驱散黑暗、温暖万物、带来希望与生机。它也寄托着人们对丰收、平安、健康成长和美好生活的向往，体现彝族顺应自然、敬畏天地的观念。`, usage: `太阳纹常绣于衣领、胸前、背部、帽饰和披肩等显著位置，用来突出身份、祝福和节庆气氛。现代应用中，它适合用于标识、首饰、服饰图案、公共艺术和节庆视觉，具有强烈的识别度和积极寓意。` },
                en: { origin: `The Sun motif originates from the Yi people’s long-standing reverence for the sun, which is seen as a force bringing light, heat, and the growth of life. In mountain life, sunlight is closely linked to farming rhythms, seasonal change, and daily stability, so the solar image was gradually refined into a totemic pattern.`, visuals: `It usually centers on a circle surrounded by radiating rays, triangular teeth, short lines, dots, or polygonal structures, often appearing as an eight-, ten-, or twelve-pointed sun. Warm reds, yellows, and oranges intensify the sense of light and heat, while black or dark grounds make the solar form more striking and solemn.`, meaning: `The motif symbolizes dispelling darkness, warming all things, and bringing hope and vitality. It also carries wishes for harvest, peace, healthy growth, and a better life, reflecting the Yi respect for nature and the cosmos.`, usage: `It is often embroidered on collars, chests, backs, headdresses, and shoulder pieces where it can emphasize identity, blessing, and festive atmosphere. In modern design, it suits logos, jewelry, garment patterns, public art, and festival visuals, offering strong recognition and positive symbolism.` },
                jp: { origin: `太陽文様は、光、熱、生命の成長をもたらす力として太陽を敬ってきたイ族の信仰に由来します。山地の暮らしでは日照が農耕のリズム、季節の移り変わり、生活の安定に関わるため、太陽のイメージは次第にトーテム的な文様へと洗練されました。`, visuals: `円形を中心に、放射状の光線、三角形の歯状装飾、短線、点、多角形構造を組み合わせ、八角、十角、十二角の太陽として表されることが多いです。赤、黄、橙などの暖色は光と熱を強め、黒や濃色の地は太陽の形をより鮮明で荘重に見せます。`, meaning: `太陽文様は闇を払い、万物を温め、希望と生命力をもたらすことを象徴します。また豊作、平安、健やかな成長、よりよい暮らしへの願いを託し、自然と天地を敬うイ族の考え方を表しています。`, usage: `襟、胸、背中、頭飾り、肩掛けなど目立つ位置に刺繍され、身分、祝福、祭りの雰囲気を強めます。現代ではロゴ、装身具、服飾図案、公共アート、祭礼ビジュアルに適し、強い識別性と前向きな意味を持ちます。` },
                fr: { name: `Motif du soleil`, aliases: `Motif totem du soleil`, origin: `Le motif du soleil vient du respect ancien des Yi pour le soleil, perçu comme une force qui apporte lumière, chaleur et croissance de la vie. Dans les montagnes, l’ensoleillement est lié aux rythmes agricoles, aux saisons et à la stabilité quotidienne, si bien que l’image solaire s’est transformée en motif à valeur totémique.`, visuals: `Il prend généralement un cercle comme centre, entouré de rayons, de dents triangulaires, de courtes lignes, de points ou de structures polygonales, souvent sous forme de soleil à huit, dix ou douze pointes. Les rouges, jaunes et orangés renforcent l’impression de lumière et de chaleur, tandis que les fonds noirs ou sombres rendent la forme solaire plus nette et solennelle.`, meaning: `Il symbolise la dissipation des ténèbres, la chaleur donnée à toutes choses, l’espoir et la vitalité. Il porte aussi des vœux de récolte, de paix, de croissance saine et de vie meilleure, reflétant le respect yi pour la nature et l’univers.`, usage: `On le brode souvent sur les cols, la poitrine, le dos, les coiffes et les pièces d’épaule afin de souligner l’identité, la bénédiction et l’atmosphère festive. Dans le design moderne, il convient aux logos, bijoux, motifs vestimentaires, arts publics et visuels de fête grâce à sa forte lisibilité et à son sens positif.` },
                de: { name: `Sonnenmuster`, aliases: `Sonnentotem-Muster`, origin: `Das Sonnenmuster geht auf die lange Verehrung der Sonne durch die Yi zurück, die als Quelle von Licht, Wärme und Lebenswachstum gilt. Im Gebirgsleben ist Sonnenlicht eng mit landwirtschaftlichen Rhythmen, Jahreszeiten und stabiler Lebensführung verbunden, weshalb das Sonnenbild zu einem totemhaften Muster verdichtet wurde.`, visuals: `Meist bildet ein Kreis das Zentrum, umgeben von Strahlen, dreieckigen Zacken, kurzen Linien, Punkten oder polygonalen Formen, häufig als acht-, zehn- oder zwölfzackige Sonne. Warme Rot-, Gelb- und Orangetöne verstärken Licht und Wärme, während schwarze oder dunkle Gründe die Sonnenform besonders klar und würdevoll erscheinen lassen.`, meaning: `Das Muster symbolisiert das Vertreiben der Dunkelheit, das Wärmen aller Dinge sowie Hoffnung und Lebenskraft. Es trägt auch Wünsche nach Ernte, Frieden, gesundem Wachstum und einem guten Leben und spiegelt den Respekt der Yi vor Natur und Kosmos wider.`, usage: `Es wird oft an Kragen, Brust, Rücken, Kopfbedeckungen und Schulterteilen gestickt, wo es Identität, Segen und festliche Stimmung hervorhebt. In modernem Design eignet es sich für Logos, Schmuck, Kleidermuster, öffentliche Kunst und Festvisuals und besitzt eine starke Wiedererkennbarkeit und positive Bedeutung.` },
                es: { name: `Motivo del sol`, aliases: `Motivo totémico del sol`, origin: `El motivo del sol nace de la antigua veneración yi por el astro, considerado una fuerza que aporta luz, calor y crecimiento de la vida. En la vida de montaña, la luz solar se relaciona con los ritmos agrícolas, los cambios estacionales y la estabilidad cotidiana, por lo que la imagen solar se convirtió en un motivo de carácter totémico.`, visuals: `Normalmente se organiza alrededor de un círculo con rayos, dientes triangulares, líneas cortas, puntos o estructuras poligonales, a menudo como un sol de ocho, diez o doce puntas. Los rojos, amarillos y naranjas acentúan la luz y el calor, mientras que los fondos negros u oscuros hacen que la forma solar resulte más visible y solemne.`, meaning: `Simboliza disipar la oscuridad, calentar todas las cosas y traer esperanza y vitalidad. También expresa deseos de cosecha, paz, crecimiento sano y una vida mejor, reflejando el respeto yi por la naturaleza y el cosmos.`, usage: `Suele bordarse en cuellos, pecho, espalda, tocados y piezas de hombro para destacar identidad, bendición y ambiente festivo. En el diseño moderno funciona en logotipos, joyería, estampados de ropa, arte público y gráficas festivas, con gran reconocimiento visual y sentido positivo.` }
            },
            wave: {
                zh: { origin: `波浪纹源于彝族先民对水源、河流、雨水和山地溪流的观察与敬重。水关系到饮用、农耕、繁衍和迁徙生活，因此水的流动形态被转化为象征生命根基的纹样。`, visuals: `纹样通常由连续起伏的弧线、折线、水滴形、涡旋或重复曲线构成，形成流动、延展和循环的节奏。蓝、青、白与黑色常用于表现水的清澈、深邃和动感，也可与鱼、蟹、星月或几何边饰组合。`, meaning: `波浪纹象征生命之源、滋养万物、雨水充沛和五谷丰登。它也寓意顺势而行、绵延不断和族群生生不息，体现彝族对自然水脉与生活安宁的珍视。`, usage: `波浪纹常用于袖口、裙摆、衣襟边缘、围腰、背包和家居织品等具有延展感或动态感的位置。现代设计中，它适合用于纺织图案、包装、公共导视、文创产品和动态视觉，能够表现流动、清新与生命力。` },
                en: { origin: `The Wave motif comes from Yi ancestors’ observation and reverence for springs, rivers, rainwater, and mountain streams. Because water is essential to drinking, farming, reproduction, and migration, its flowing form became a pattern symbolizing the foundation of life.`, visuals: `It is usually composed of continuous arcs, zigzags, droplets, spirals, or repeated curves, creating a rhythm of flow, extension, and return. Blue, cyan, white, and black often express the clarity, depth, and movement of water, and the motif may be combined with fish, crabs, sun-and-moon forms, or geometric borders.`, meaning: `The motif symbolizes the source of life, nourishment of all things, abundant rain, and plentiful harvests. It also suggests moving with natural forces, unbroken continuity, and the enduring vitality of the community.`, usage: `It often appears on cuffs, hems, garment edges, aprons, bags, and home textiles, especially in areas that move or extend visually. In contemporary design, it suits textile patterns, packaging, wayfinding, cultural products, and motion visuals, conveying flow, freshness, and vitality.` },
                jp: { origin: `波文様は、イ族の先人が水源、川、雨、山地の渓流を観察し、敬ってきたことに由来します。水は飲用、農耕、繁殖、移動生活に関わるため、その流れる形は生命の根源を象徴する文様となりました。`, visuals: `連続する弧線、折れ線、水滴形、渦巻き、反復する曲線で構成され、流動、広がり、循環のリズムを生み出します。青、藍、白、黒は水の清らかさ、深さ、動きを表し、魚、蟹、日月文様、幾何学的な縁文様と組み合わされることもあります。`, meaning: `波文様は生命の源、万物を潤す力、豊かな雨、五穀豊穣を象徴します。また自然の流れに従うこと、途切れない継続、共同体の生命力が長く続くことを意味します。`, usage: `袖口、裾、衣服の縁、前掛け、袋物、生活用の織物など、動きや広がりを感じさせる部分によく用いられます。現代ではテキスタイル、包装、公共サイン、文化商品、動的ビジュアルに適し、流れ、清新さ、生命力を表現します。` },
                fr: { name: `Motif de vague`, aliases: `Motif d’onde d’eau`, origin: `Le motif de vague provient de l’observation et du respect des ancêtres yi pour les sources, les rivières, la pluie et les ruisseaux de montagne. L’eau étant essentielle à la boisson, à l’agriculture, à la reproduction et aux déplacements, sa forme fluide est devenue un symbole du fondement de la vie.`, visuals: `Il se compose souvent d’arcs continus, de lignes brisées, de gouttes, de spirales ou de courbes répétées, créant un rythme de flux, d’extension et de retour. Le bleu, le cyan, le blanc et le noir évoquent la clarté, la profondeur et le mouvement de l’eau, et le motif peut s’associer à des poissons, crabes, astres ou bordures géométriques.`, meaning: `Il symbolise la source de la vie, la nourriture de toutes choses, l’abondance de la pluie et les récoltes prospères. Il évoque aussi l’accord avec les forces naturelles, la continuité ininterrompue et la vitalité durable de la communauté.`, usage: `On le retrouve sur les poignets, les ourlets, les bords de vêtements, les tabliers, les sacs et les textiles domestiques, surtout dans les zones qui suggèrent le mouvement ou l’extension. Dans le design contemporain, il convient aux motifs textiles, emballages, signalétiques, produits culturels et visuels animés, en exprimant fluidité, fraîcheur et vitalité.` },
                de: { name: `Wellenmuster`, aliases: `Wasserwellenmuster`, origin: `Das Wellenmuster geht auf die Beobachtung und Wertschätzung von Quellen, Flüssen, Regen und Gebirgsbächen durch die Yi-Vorfahren zurück. Da Wasser für Trinken, Landwirtschaft, Fortpflanzung und Wanderleben grundlegend ist, wurde seine fließende Form zu einem Symbol für die Basis des Lebens.`, visuals: `Es besteht meist aus fortlaufenden Bögen, Zickzacklinien, Tropfenformen, Spiralen oder wiederholten Kurven und erzeugt einen Rhythmus von Fließen, Ausdehnung und Wiederkehr. Blau, Türkis, Weiß und Schwarz zeigen Klarheit, Tiefe und Bewegung des Wassers; das Motiv kann mit Fischen, Krabben, Sonne-und-Mond-Formen oder geometrischen Bordüren kombiniert werden.`, meaning: `Das Muster symbolisiert die Quelle des Lebens, die Nahrung aller Dinge, reichlichen Regen und gute Ernten. Es verweist auch auf das Mitgehen mit natürlichen Kräften, ununterbrochene Kontinuität und die dauerhafte Lebenskraft der Gemeinschaft.`, usage: `Es erscheint häufig an Ärmelabschlüssen, Säumen, Kleiderrändern, Schürzen, Taschen und Heimtextilien, besonders an Stellen, die Bewegung oder Ausdehnung zeigen. Im zeitgenössischen Design eignet es sich für Textilmuster, Verpackungen, Leitsysteme, Kulturprodukte und bewegte Visuals und vermittelt Fluss, Frische und Vitalität.` },
                es: { name: `Motivo de olas`, aliases: `Motivo de ondas de agua`, origin: `El motivo de olas procede de la observación y el respeto de los antepasados yi por manantiales, ríos, lluvia y arroyos de montaña. Como el agua es esencial para beber, cultivar, reproducirse y desplazarse, su forma fluida se convirtió en un símbolo de la base de la vida.`, visuals: `Suele componerse de arcos continuos, líneas quebradas, gotas, espirales o curvas repetidas que crean un ritmo de flujo, extensión y retorno. El azul, el cian, el blanco y el negro expresan la claridad, profundidad y movimiento del agua, y el motivo puede combinarse con peces, cangrejos, formas de sol y luna o cenefas geométricas.`, meaning: `Simboliza la fuente de la vida, la nutrición de todas las cosas, la lluvia abundante y las buenas cosechas. También sugiere avanzar siguiendo las fuerzas naturales, continuidad sin interrupción y vitalidad duradera de la comunidad.`, usage: `Aparece a menudo en puños, dobladillos, bordes de prendas, delantales, bolsos y textiles del hogar, especialmente en zonas que transmiten movimiento o extensión. En el diseño contemporáneo se adapta a patrones textiles, empaques, señalética, productos culturales y visuales animados, transmitiendo fluidez, frescura y vitalidad.` }
            }
        };

        Object.assign(patternTranslations, expandedPatternTranslations);

        Object.assign(patternTranslations, {
            'ram-horn': {
                zh: { origin: `羊是彝族传统畜牧生活中的重要财富，也与山地迁徙、祭祀献牲和家庭生计紧密相关。羊角纹由对羊角形态的观察和图腾化提炼而来，体现了彝族先民对牲畜繁盛与自然馈赠的珍视。`, visuals: `图案多以弯曲的羊角为母题，常呈对称螺旋、回旋弧线或相向卷曲的结构。线条柔中带劲，既保留角的生长感，也形成连续、稳定的装饰节奏。`, meaning: `羊角纹象征畜牧兴旺、家业丰足和衣食安宁，是对富足生活的朴素祝愿。弯曲回旋的形态也寓意生命循环、生生不息，以及人与牲畜相互依存的关系。`, usage: `羊角纹常见于日常服饰、披毡、挎包和儿童衣物等生活用品中，用以表达护佑与丰收的愿望。在节庆盛装中，它也可与火焰纹、云纹等组合，强化吉祥和繁荣的寓意。` },
                en: { origin: `Sheep have long been valuable livestock in Yi pastoral life, closely tied to mountain migration, ritual offerings, and household livelihood. The ram-horn motif comes from observing the horn’s curved form and transforming it into a totemic symbol of abundance and gratitude toward nature.`, visuals: `The design usually takes the curling horn as its core image, appearing as paired spirals, arched curves, or inward-facing scrolls. Its lines are supple yet strong, preserving the sense of organic growth while creating a steady decorative rhythm.`, meaning: `The ram-horn pattern symbolizes thriving herds, family prosperity, and freedom from want. Its returning curves also suggest the cycle of life, continuity, and the interdependence between people, animals, and the mountain environment.`, usage: `It is often embroidered on everyday garments, felt cloaks, shoulder bags, and children’s clothing as a sign of blessing and protection. In festive attire, it may be combined with flame or cloud motifs to intensify wishes for luck and abundance.` },
                jp: { origin: `羊はイ族の伝統的な牧畜生活において重要な財産であり、山地での移動、祭祀の供物、家計の営みと深く結びついてきました。羊角紋は羊の角の形を観察し、それを図案化・トーテム化した文様で、家畜の繁栄と自然の恵みへの感謝を表しています。`, visuals: `文様は曲がった羊角を基本モチーフとし、左右対称の渦巻き、弧線、向かい合う巻き形として表されることが多いです。線は柔らかさと力強さを併せ持ち、角の成長感を残しながら安定した装飾リズムを生み出します。`, meaning: `羊角紋は家畜の繁殖、家の豊かさ、衣食の安定を象徴する吉祥文様です。回り込む形には生命の循環や継続、そして人と家畜が山地の自然の中で支え合う関係も込められています。`, usage: `日常着、フェルトの外套、肩掛け袋、子どもの衣服などに刺繍され、守護と豊作への願いを表します。祭礼用の盛装では火焔紋や雲紋と組み合わされ、吉祥と繁栄の意味をさらに強めます。` },
                fr: { name: `Motif de corne de bélier`, aliases: `Motif totem du mouton`, origin: `Le mouton occupe une place importante dans la vie pastorale traditionnelle des Yi, liée aux déplacements en montagne, aux offrandes rituelles et à l’économie familiale. Le motif de corne de bélier naît de l’observation de cette forme courbe, ensuite stylisée en symbole totémique d’abondance et de reconnaissance envers la nature.`, visuals: `Le dessin prend généralement la corne enroulée comme motif central, sous forme de spirales symétriques, d’arcs ou de volutes qui se font face. Les lignes sont à la fois souples et vigoureuses, conservant l’idée de croissance organique tout en créant un rythme décoratif stable.`, meaning: `Ce motif symbolise la prospérité du bétail, l’aisance du foyer et une vie à l’abri du manque. Ses courbes qui reviennent sur elles-mêmes évoquent aussi le cycle de la vie, la continuité et l’interdépendance entre les humains, les animaux et l’environnement montagnard.`, usage: `On le retrouve souvent brodé sur les vêtements quotidiens, les manteaux de feutre, les sacs portés à l’épaule et les habits d’enfants, comme signe de protection et de bénédiction. Dans les tenues de fête, il peut être associé aux flammes ou aux nuages pour renforcer les souhaits de chance et d’abondance.` },
                de: { name: `Widderhornmuster`, aliases: `Schaf-Totemmuster`, origin: `Schafe waren im traditionellen Hirtenleben der Yi ein wichtiger Besitz und eng mit Wanderungen im Bergland, rituellen Opfergaben und dem Lebensunterhalt der Familien verbunden. Das Widderhornmuster geht auf die Beobachtung der gebogenen Hornform zurück und wurde zu einem totemartigen Zeichen für Fülle und Dankbarkeit gegenüber der Natur verdichtet.`, visuals: `Das Motiv zeigt meist geschwungene Hörner in symmetrischen Spiralen, Bögen oder einander zugewandten Voluten. Die Linien wirken weich und zugleich kraftvoll, bewahren den Eindruck organischen Wachstums und erzeugen einen ruhigen dekorativen Rhythmus.`, meaning: `Das Widderhorn steht für wachsende Herden, Wohlstand des Hauses und ein Leben ohne Mangel. Seine zurückkehrenden Kurven verweisen außerdem auf den Kreislauf des Lebens, auf Beständigkeit und auf die gegenseitige Abhängigkeit von Mensch, Tier und Bergnatur.`, usage: `Es wird häufig auf Alltagskleidung, Filzumhängen, Schultertaschen und Kinderkleidung gestickt, um Schutz und Segen auszudrücken. In Festgewändern erscheint es oft zusammen mit Flammen- oder Wolkenmotiven und verstärkt so die Wünsche nach Glück und Überfluss.` },
                es: { name: `Motivo de cuerno de carnero`, aliases: `Motivo totémico de oveja`, origin: `La oveja ha sido un bien esencial en la vida pastoril tradicional del pueblo Yi, relacionada con la movilidad de montaña, las ofrendas rituales y el sustento familiar. El motivo de cuerno de carnero procede de observar la forma curva del cuerno y transformarla en un símbolo totémico de abundancia y gratitud hacia la naturaleza.`, visuals: `El diseño suele tomar el cuerno curvado como motivo principal, presentado en espirales simétricas, arcos o volutas enfrentadas. Sus líneas son suaves pero firmes, conservan la sensación de crecimiento orgánico y crean un ritmo ornamental estable.`, meaning: `El motivo simboliza rebaños prósperos, bienestar familiar y una vida sin carencias. Sus curvas que regresan sobre sí mismas también sugieren el ciclo de la vida, la continuidad y la relación de dependencia mutua entre las personas, los animales y el entorno montañoso.`, usage: `Aparece con frecuencia bordado en prendas cotidianas, mantos de fieltro, bolsas de hombro y ropa infantil como signo de protección y bendición. En trajes festivos puede combinarse con llamas o nubes para reforzar los deseos de buena fortuna y abundancia.` }
            },
            tiger: {
                zh: { origin: `虎在彝族神话和族源叙事中具有极高地位，常被视为开天辟地的始祖或守护族群的神性动物。虎纹由这种虎图腾观念发展而来，承载着彝族对祖先、力量和天地秩序的敬畏。`, visuals: `图案可表现为虎身、虎头、虎爪，也可抽象为粗重有力的虎斑线条。构图多强调强烈对比和外张气势，黑、红、橙等色彩使纹样具有威严而醒目的视觉力量。`, meaning: `虎纹象征勇猛、威严、护佑和驱邪，是族群生命力与精神权威的象征。它不仅表达对强大自然力量的崇敬，也寓意人在险峻环境中保持胆识和尊严。`, usage: `虎纹多用于男性服饰、节庆盛装、祭祀用品和具有守护意义的装饰部位。在一些传统语境中，它也可出现在儿童衣物或护身物上，用以祈求健康成长和避除灾厄。` },
                en: { origin: `The tiger holds a high position in Yi mythology and origin narratives, often regarded as a primordial ancestor or a sacred guardian of the community. The tiger motif grew from this totemic belief and carries Yi reverence for ancestry, strength, and cosmic order.`, visuals: `The design may depict a tiger’s body, head, or claws, or it may abstract the animal into bold, forceful stripe patterns. Strong contrast and an outward sense of movement are emphasized, while black, red, and orange tones give the motif a solemn and striking power.`, meaning: `The tiger pattern symbolizes courage, authority, protection, and the power to ward off evil. It expresses respect for formidable natural forces and also suggests the dignity and bravery needed to live in a rugged mountain environment.`, usage: `It is often used on men’s garments, festive attire, ritual objects, and decorative areas associated with protection. In some traditional contexts, it may also appear on children’s clothing or amuletic items to pray for healthy growth and safety from misfortune.` },
                jp: { origin: `虎はイ族の神話や族源伝承において非常に高い地位を持ち、天地を開いた始祖、または集団を守る神聖な動物と見なされることがあります。虎紋はこの虎トーテムの観念から発展し、祖先、力、天地の秩序への畏敬を担っています。`, visuals: `文様は虎の胴体、頭、爪を表す場合もあれば、太く力強い縞模様として抽象化される場合もあります。構図は強い対比と外へ広がる勢いを重視し、黒・赤・橙の色彩が威厳ある鮮烈な印象を与えます。`, meaning: `虎紋は勇猛さ、威厳、守護、邪気を払う力を象徴します。強大な自然の力への敬意を表すと同時に、険しい山地で生きる人々の胆力と尊厳も意味しています。`, usage: `男性の衣服、祭礼の盛装、祭祀用品、守護性を持つ装飾部分によく用いられます。伝統的な文脈では、子どもの衣服や護符的な品にも現れ、健やかな成長と災厄除けを祈ります。` },
                fr: { name: `Motif du tigre`, aliases: `Totem du tigre Yi`, origin: `Le tigre occupe une place éminente dans les mythes Yi et les récits d’origine, où il peut être considéré comme un ancêtre primordial ou un gardien sacré du groupe. Le motif du tigre s’est développé à partir de cette croyance totémique et porte le respect des Yi pour les ancêtres, la force et l’ordre du monde.`, visuals: `Le motif peut représenter le corps, la tête ou les griffes du tigre, ou bien être abstrait en bandes épaisses et puissantes. La composition privilégie les contrastes marqués et une énergie expansive, tandis que le noir, le rouge et l’orange lui donnent une présence majestueuse et saisissante.`, meaning: `Il symbolise le courage, l’autorité, la protection et la capacité d’écarter les forces néfastes. Il exprime le respect envers les puissances redoutables de la nature, ainsi que la bravoure et la dignité nécessaires pour vivre dans un environnement montagnard difficile.`, usage: `On le trouve souvent sur les vêtements masculins, les tenues de fête, les objets rituels et les parties décoratives à fonction protectrice. Dans certains contextes traditionnels, il apparaît aussi sur les habits d’enfants ou des objets protecteurs pour souhaiter santé, croissance et sécurité.` },
                de: { name: `Tigermuster`, aliases: `Yi-Tigertotem`, origin: `Der Tiger nimmt in Mythen und Herkunftserzählungen der Yi eine herausragende Stellung ein und gilt häufig als urzeitlicher Ahne oder heiliger Beschützer der Gemeinschaft. Das Tigermuster entstand aus dieser Totemvorstellung und trägt Ehrfurcht vor Ahnen, Kraft und kosmischer Ordnung in sich.`, visuals: `Das Motiv kann Körper, Kopf oder Krallen des Tigers zeigen oder zu kräftigen, schweren Streifen abstrahiert werden. Die Komposition betont starke Kontraste und eine nach außen drängende Energie, während Schwarz, Rot und Orange dem Muster eine würdevolle und auffällige Wirkung verleihen.`, meaning: `Das Tigermuster steht für Mut, Autorität, Schutz und die Fähigkeit, Unheil abzuwehren. Es drückt Verehrung für mächtige Naturkräfte aus und verweist zugleich auf den Mut und die Würde, die das Leben in einer rauen Bergwelt verlangt.`, usage: `Es erscheint häufig auf Männerkleidung, Festgewändern, Ritualgegenständen und schützenden Schmuckzonen. In manchen traditionellen Zusammenhängen findet es sich auch auf Kinderkleidung oder amulettartigen Objekten, um Gesundheit und Sicherheit zu erbitten.` },
                es: { name: `Motivo de tigre`, aliases: `Tótem del tigre Yi`, origin: `El tigre ocupa un lugar muy alto en los mitos y relatos de origen del pueblo Yi, donde puede ser visto como antepasado primordial o animal sagrado protector de la comunidad. El motivo del tigre se desarrolló a partir de esta creencia totémica y porta reverencia hacia los ancestros, la fuerza y el orden del mundo.`, visuals: `El diseño puede representar el cuerpo, la cabeza o las garras del tigre, o abstraerse en franjas gruesas y enérgicas. La composición enfatiza contrastes intensos y una fuerza expansiva, mientras que los tonos negro, rojo y naranja le dan una presencia solemne y llamativa.`, meaning: `El motivo simboliza valentía, autoridad, protección y capacidad para ahuyentar el mal. Expresa respeto por las fuerzas poderosas de la naturaleza y también la dignidad y el coraje necesarios para vivir en un entorno montañoso severo.`, usage: `Se usa con frecuencia en prendas masculinas, trajes festivos, objetos rituales y zonas decorativas asociadas con la protección. En algunos contextos tradicionales también aparece en ropa infantil o en objetos protectores para pedir crecimiento sano y seguridad ante la desgracia.` }
            },
            'ox-horn': {
                zh: { origin: `牛在彝族农耕、驮运和山地生产中承担重要角色，是家庭劳力与财富的象征。牛角纹源于对牛角力量感的提炼，反映了彝族对勤劳、土地和农业秩序的尊重。`, visuals: `纹样多以一对弯曲外展的牛角为基本结构，常形成左右对称、开张稳健的弧形。线条较羊角纹更厚重有力，强调支撑、冲劲和山地农耕的坚实气质。`, meaning: `牛角纹象征力量、勤勉、丰收和风调雨顺，是农耕生活中重要的吉祥符号。两角相对或外展的形态，也寓意家庭根基稳固、生产兴旺和抵御灾害的能力。`, usage: `它常用于与农耕、祭祀和成年礼相关的服饰及器物装饰，也适合出现在衣领、胸襟、腰带等醒目位置。与谷穗纹、水波纹等组合时，常共同表达五谷丰登和生活安定。` },
                en: { origin: `Oxen played an important role in Yi farming, transport, and mountain production, representing both labor and household wealth. The ox-horn motif is a stylized extraction of the horn’s strength and reflects Yi respect for diligence, land, and agricultural order.`, visuals: `The pattern often uses a pair of outward-curving horns as its basic structure, forming a balanced and expansive symmetrical arc. Compared with the ram-horn motif, its lines are heavier and stronger, emphasizing support, momentum, and the solid character of mountain farming.`, meaning: `The ox-horn pattern symbolizes strength, hard work, harvest, and favorable weather for crops. The paired horns, whether facing each other or opening outward, also suggest a stable household foundation, productive prosperity, and the power to resist hardship.`, usage: `It is commonly used on garments and objects related to farming, ritual practice, and rites of adulthood, especially on collars, chest panels, and belts. When paired with grain or wave motifs, it expresses hopes for abundant harvests and a secure life.` },
                jp: { origin: `牛はイ族の農耕、運搬、山地での生産活動において重要な役割を担い、家の労働力と財産を象徴してきました。牛角紋は牛角の力強さを抽出して図案化したもので、勤勉、土地、農耕秩序への敬意を表しています。`, visuals: `文様は外へ広がる一対の牛角を基本構造とし、左右対称で安定感のある弧形をつくることが多いです。羊角紋に比べて線は太く重厚で、支える力、勢い、山地農耕の堅実な気質を強調します。`, meaning: `牛角紋は力、勤勉、豊作、順調な天候を象徴する農耕生活の吉祥文様です。向かい合う、または外へ開く二本の角は、家の基盤の安定、生産の繁栄、困難に耐える力も意味します。`, usage: `農耕、祭祀、成年儀礼に関わる衣服や器物の装飾に用いられ、襟、胸元、帯など目立つ部分にも適しています。穀物紋や水波紋と組み合わせることで、五穀豊穣と生活の安定を表します。` },
                fr: { name: `Motif de corne de bœuf`, aliases: `Motif totem du bœuf`, origin: `Le bœuf a joué un rôle essentiel dans l’agriculture, le transport et la production en montagne chez les Yi, représentant à la fois la force de travail et la richesse du foyer. Le motif de corne de bœuf stylise la puissance de la corne et reflète le respect accordé au labeur, à la terre et à l’ordre agricole.`, visuals: `Le dessin repose souvent sur une paire de cornes courbées vers l’extérieur, formant un arc symétrique ample et stable. Par rapport au motif de corne de bélier, ses lignes sont plus épaisses et plus puissantes, soulignant l’appui, l’élan et la solidité du monde agricole montagnard.`, meaning: `Il symbolise la force, le travail assidu, les récoltes et un climat favorable aux cultures. Les deux cornes, qu’elles se fassent face ou s’ouvrent vers l’extérieur, évoquent aussi la stabilité du foyer, la prospérité de la production et la capacité de résister aux difficultés.`, usage: `On l’emploie fréquemment sur les vêtements et objets liés à l’agriculture, aux rites et aux cérémonies de passage à l’âge adulte, notamment sur les cols, les devants et les ceintures. Associé aux épis ou aux vagues, il exprime l’espoir de récoltes abondantes et d’une vie stable.` },
                de: { name: `Ochsenhornmuster`, aliases: `Ochsentotem-Muster`, origin: `Rinder spielten bei den Yi in Ackerbau, Transport und Bergwirtschaft eine zentrale Rolle und standen zugleich für Arbeitskraft und familiären Besitz. Das Ochsenhornmuster stilisiert die Kraft des Horns und spiegelt den Respekt vor Fleiß, Land und agrarischer Ordnung wider.`, visuals: `Das Muster basiert häufig auf einem Paar nach außen gebogener Hörner, die einen weiten, symmetrischen und stabilen Bogen bilden. Im Vergleich zum Widderhorn wirken die Linien schwerer und kräftiger und betonen Stützkraft, Vorwärtsdrang und die solide Haltung der Berglandwirtschaft.`, meaning: `Das Ochsenhorn symbolisiert Stärke, Fleiß, Ernteglück und günstiges Wetter für den Ackerbau. Die beiden Hörner, einander zugewandt oder nach außen geöffnet, verweisen zudem auf ein festes Familienfundament, produktiven Wohlstand und die Fähigkeit, Not zu widerstehen.`, usage: `Es wird häufig auf Kleidung und Gegenständen verwendet, die mit Landwirtschaft, Ritualen und Initiationsfeiern verbunden sind, besonders an Kragen, Brustpartien und Gürteln. Zusammen mit Ähren- oder Wellenmotiven steht es für reiche Ernten und ein gesichertes Leben.` },
                es: { name: `Motivo de cuerno de buey`, aliases: `Motivo totémico de buey`, origin: `El buey desempeñó un papel importante en la agricultura, el transporte y la producción de montaña del pueblo Yi, como símbolo de fuerza de trabajo y riqueza familiar. El motivo de cuerno de buey estiliza la potencia del cuerno y refleja respeto por la laboriosidad, la tierra y el orden agrícola.`, visuals: `El diseño suele basarse en un par de cuernos curvados hacia afuera, formando un arco simétrico, abierto y estable. En comparación con el cuerno de carnero, sus líneas son más pesadas y vigorosas, y subrayan apoyo, impulso y la firmeza de la agricultura de montaña.`, meaning: `El motivo simboliza fuerza, diligencia, cosecha y clima favorable para los cultivos. Los dos cuernos, enfrentados o abiertos hacia fuera, también sugieren una base familiar sólida, prosperidad productiva y capacidad para resistir las dificultades.`, usage: `Se utiliza con frecuencia en prendas y objetos vinculados con la agricultura, los rituales y las ceremonias de adultez, especialmente en cuellos, pecheras y cinturones. Combinado con motivos de espigas o de olas, expresa deseos de cosechas abundantes y vida estable.` }
            },
            'ox-eye': {
                zh: { origin: `牛眼纹是牛图腾观念的延伸，源自彝族对牛的忠诚、耐劳和守护特质的理解。牛眼被赋予观察、警醒和护家的象征意义，体现了农牧生活中人与牛之间的深厚情感。`, visuals: `纹样通常呈圆形或椭圆形，中部点出瞳孔，外圈可用同心圆、短线或菱形边框加强层次。整体造型简洁醒目，像一只凝视的眼睛，具有强烈的识别性和护符感。`, meaning: `牛眼纹寓意看护家宅、洞察危险和驱避不祥，是一种具有守护意味的吉祥符号。它也象征忠诚、稳重和勤恳，提醒人们珍视诚实劳动与家庭安宁。`, usage: `牛眼纹常绣于儿童服饰、帽饰、背带和贴身小物上，用以表达长辈对孩子平安成长的祝福。也可用于门帘、包袋或服装边饰，与牛角纹搭配形成更完整的牛图腾体系。` },
                en: { origin: `The ox-eye motif extends the ox totem and comes from Yi understandings of the ox as loyal, enduring, and protective. The eye is endowed with meanings of watchfulness, alertness, and household guardianship, reflecting the close bond between people and cattle in farming and herding life.`, visuals: `The motif is usually round or oval, with a pupil marked at the center and outer rings formed by concentric circles, short strokes, or diamond frames. Its shape is simple and striking, like a steady gaze, giving it a clear identity and an amuletic quality.`, meaning: `The ox-eye pattern signifies guarding the home, perceiving danger, and keeping misfortune away. It also symbolizes loyalty, steadiness, and diligence, reminding people to value honest labor and domestic peace.`, usage: `It is often embroidered on children’s clothes, hats, baby carriers, and small personal items to convey elders’ wishes for safe growth. It may also appear on door curtains, bags, or garment borders, and when paired with ox-horn motifs it forms a fuller ox-totem expression.` },
                jp: { origin: `牛眼紋は牛トーテム観念の延長であり、牛の忠実さ、忍耐強さ、守護性に対するイ族の理解から生まれました。牛の目には見守り、警戒、家を守る意味が与えられ、農牧生活における人と牛の深い絆を示しています。`, visuals: `文様は円形または楕円形で、中央に瞳を置き、外側を同心円、短い線、菱形の枠で重ねることがあります。全体は簡潔で目を引き、じっと見つめる目のように、はっきりした識別性と護符的な印象を持ちます。`, meaning: `牛眼紋は家を見守り、危険を察知し、不吉を遠ざける守護的な吉祥文様です。また、忠誠、落ち着き、勤勉を象徴し、誠実な労働と家庭の安らぎを大切にする心を示します。`, usage: `子どもの衣服、帽子、背負い帯、身近な小物に刺繍され、年長者が子どもの無事な成長を願う意味を込めます。門幕、袋、衣服の縁飾りにも用いられ、牛角紋と組み合わせることで牛トーテムの表現がより完整になります。` },
                fr: { name: `Motif d’œil de bœuf`, aliases: `Symbole de l’œil de bœuf`, origin: `Le motif de l’œil de bœuf prolonge la symbolique totémique du bœuf et vient de l’idée que cet animal est loyal, endurant et protecteur. L’œil reçoit des significations de vigilance, d’alerte et de protection du foyer, témoignant du lien profond entre les humains et les bovins dans la vie agro-pastorale.`, visuals: `Le motif est généralement rond ou ovale, avec une pupille au centre et des anneaux extérieurs formés de cercles concentriques, de petits traits ou d’un cadre en losange. Sa forme simple et frappante rappelle un regard fixe, ce qui lui donne une forte lisibilité et une qualité d’amulette.`, meaning: `Il signifie la garde de la maison, la perception du danger et l’éloignement du malheur. Il symbolise aussi la loyauté, la stabilité et l’ardeur au travail, rappelant l’importance du labeur honnête et de la paix familiale.`, usage: `On le brode souvent sur les vêtements d’enfants, les bonnets, les porte-bébés et les petits objets personnels pour souhaiter une croissance sûre. Il peut aussi orner rideaux de porte, sacs ou bordures de vêtements, et forme avec la corne de bœuf un ensemble totémique plus complet.` },
                de: { name: `Ochsenaugenmuster`, aliases: `Ochsenaugen-Symbol`, origin: `Das Ochsenaugenmuster ist eine Erweiterung des Ochsentotems und beruht auf der Yi-Vorstellung vom Rind als treuem, ausdauerndem und schützendem Wesen. Dem Auge werden Wachsamkeit, Aufmerksamkeit und Hausschutz zugeschrieben, was die enge Beziehung zwischen Menschen und Rindern im Acker- und Hirtenleben zeigt.`, visuals: `Das Motiv ist meist rund oder oval, mit einer markierten Pupille in der Mitte und äußeren Ringen aus konzentrischen Kreisen, kurzen Strichen oder Rautenrahmen. Die Form ist schlicht und einprägsam, wie ein ruhiger Blick, und erhält dadurch eine klare Erkennbarkeit und amulettartige Wirkung.`, meaning: `Das Ochsenauge steht für den Schutz des Hauses, das Erkennen von Gefahr und das Fernhalten von Unheil. Es symbolisiert außerdem Treue, Beständigkeit und Fleiß und erinnert daran, ehrliche Arbeit und familiären Frieden zu schätzen.`, usage: `Es wird häufig auf Kinderkleidung, Mützen, Tragetüchern und kleinen persönlichen Gegenständen gestickt, um sicheres Aufwachsen zu wünschen. Auch auf Türvorhängen, Taschen oder Kleidungsrändern kann es erscheinen; zusammen mit Ochsenhornmotiven bildet es eine vollständigere Ochsentotem-Symbolik.` },
                es: { name: `Motivo de ojo de buey`, aliases: `Símbolo del ojo de buey`, origin: `El motivo de ojo de buey es una extensión del tótem del buey y nace de la comprensión Yi del animal como leal, resistente y protector. Al ojo se le atribuyen sentidos de vigilancia, alerta y custodia del hogar, reflejando el vínculo profundo entre las personas y el ganado en la vida agro-pastoril.`, visuals: `El motivo suele ser circular u ovalado, con una pupila marcada en el centro y anillos exteriores hechos de círculos concéntricos, líneas cortas o marcos romboidales. Su forma es sencilla y llamativa, como una mirada fija, con fuerte identidad visual y carácter de amuleto.`, meaning: `El ojo de buey significa protección del hogar, percepción del peligro y alejamiento de lo infortunado. También simboliza lealtad, estabilidad y diligencia, recordando el valor del trabajo honesto y la paz familiar.`, usage: `Se borda a menudo en ropa infantil, gorros, portabebés y pequeños objetos personales para expresar el deseo de un crecimiento seguro. También puede aparecer en cortinas de puerta, bolsas o bordes de prendas, y junto al cuerno de buey forma una expresión más completa del tótem bovino.` }
            },
            'crab-claw': {
                zh: { origin: `蟹足纹与水泽环境、河谷生活和水崇拜观念相关，体现了彝族对水源、湿地生物和自然循环的观察。蟹虽体形不大，却以多足、坚壳和再生般的生命力进入纹样系统，成为水域生机的象征。`, visuals: `纹样常以蟹足或蟹爪为核心，呈左右对称、分叉外展或连续排列的形态。尖钩状、折线状和节肢状线条让图案富有动感，也容易与波浪、水涡等纹样衔接。`, meaning: `蟹足纹象征水源充盈、族群繁衍和生命力绵延，表达对人丁兴旺与自然和谐的祝愿。蟹的横行姿态和坚硬外壳也被引申为适应环境、保护自身和稳步前行的智慧。`, usage: `蟹足纹常与波浪纹、水波纹组合，用于衣袖、裙摆、围腰、包袋等边缘或流动感较强的部位。在节庆和生活器物装饰中，它可作为水系纹样的一部分，传达丰沛、清洁与生生不息。` },
                en: { origin: `The crab-claw motif is connected with wetlands, river-valley life, and ideas of water reverence, reflecting Yi observation of water sources, aquatic creatures, and natural cycles. Though small, the crab enters the pattern system through its many legs, hard shell, and resilient vitality, becoming a symbol of life in watery places.`, visuals: `The motif often centers on crab legs or claws, arranged symmetrically, branching outward, or repeated in sequence. Hooked, angular, and jointed lines give the design movement and allow it to connect naturally with wave and whirlpool motifs.`, meaning: `The crab-claw pattern symbolizes abundant water, flourishing descendants, and continuous vitality, expressing wishes for population growth and harmony with nature. The crab’s sideways movement and hard shell also suggest adaptability, self-protection, and steady progress through changing conditions.`, usage: `It is often paired with wave or water-ripple motifs and used on sleeves, hems, aprons, bags, and other borders or flowing parts of garments. In festive and everyday objects, it functions as part of a water-symbolic system, conveying abundance, purity, and life that never ceases.` },
                jp: { origin: `蟹足紋は水辺の環境、河谷の暮らし、水への崇拝観念と関係し、水源、湿地の生物、自然循環に対するイ族の観察を反映しています。蟹は小さな生き物ですが、多くの足、硬い甲羅、粘り強い生命力によって文様体系に取り入れられ、水域の生気を象徴します。`, visuals: `文様は蟹の足や爪を中心に、左右対称、外へ分かれる形、または連続した配列で表されます。鉤状、折線状、節のある線が動きを生み、波紋や渦巻き文様とも自然に結びつきます。`, meaning: `蟹足紋は豊かな水源、子孫繁栄、絶えない生命力を象徴し、人々の繁栄と自然との調和への願いを表します。蟹の横歩きと硬い殻は、環境への適応、自身の保護、着実に進む知恵としても解釈されます。`, usage: `波浪紋や水波紋と組み合わせられ、袖、裾、前掛け、袋など、縁や動きのある部分によく用いられます。祭礼や日常器物の装飾では、水系文様の一部として、豊かさ、清らかさ、生生不息を伝えます。` },
                fr: { name: `Motif de pince de crabe`, aliases: `Symbole de pince de crabe`, origin: `Le motif de pince de crabe est lié aux milieux aquatiques, à la vie des vallées fluviales et aux formes de vénération de l’eau, reflétant l’observation Yi des sources, des êtres des zones humides et des cycles naturels. Malgré sa petite taille, le crabe entre dans le système décoratif par ses nombreuses pattes, sa carapace solide et sa vitalité tenace, devenant un symbole de vie aquatique.`, visuals: `Le motif prend souvent pour centre les pattes ou les pinces du crabe, disposées de manière symétrique, ramifiée vers l’extérieur ou répétée en série. Les lignes en crochet, brisées et articulées donnent du mouvement au dessin et s’accordent facilement avec les vagues et les tourbillons d’eau.`, meaning: `Il symbolise l’abondance des eaux, la prospérité de la descendance et une vitalité continue, exprimant des vœux de croissance du groupe et d’harmonie avec la nature. La marche latérale du crabe et sa carapace dure évoquent aussi l’adaptation, l’autoprotection et l’avancée prudente dans un monde changeant.`, usage: `On l’associe souvent aux motifs de vagues ou d’ondes et on le place sur les manches, les ourlets, les tabliers, les sacs et d’autres bordures ou parties mobiles du vêtement. Dans les objets festifs ou quotidiens, il appartient au répertoire symbolique de l’eau et transmet l’idée d’abondance, de pureté et de continuité de la vie.` },
                de: { name: `Krabbenscherenmuster`, aliases: `Krabbenscheren-Symbol`, origin: `Das Krabbenscherenmuster steht mit Feuchtgebieten, Flusstälern und Vorstellungen der Wasserverehrung in Verbindung und spiegelt die Beobachtung von Wasserquellen, Wasserlebewesen und Naturkreisläufen durch die Yi wider. Obwohl die Krabbe klein ist, gelangt sie durch ihre vielen Beine, den harten Panzer und ihre zähe Lebenskraft in das Mustersystem und wird zum Symbol der Lebendigkeit am Wasser.`, visuals: `Das Motiv konzentriert sich häufig auf Beine oder Scheren der Krabbe, symmetrisch angeordnet, nach außen verzweigt oder in Reihen wiederholt. Hakenförmige, gebrochene und gegliederte Linien verleihen dem Muster Bewegung und lassen es sich gut mit Wellen- oder Wirbelmotiven verbinden.`, meaning: `Das Krabbenscherenmuster symbolisiert reiches Wasser, zahlreiche Nachkommen und anhaltende Lebenskraft. Der Seitwärtsgang der Krabbe und ihr harter Panzer stehen zudem für Anpassungsfähigkeit, Selbstschutz und beharrliches Vorankommen unter wechselnden Bedingungen.`, usage: `Es wird oft mit Wellen- oder Wasserlinien kombiniert und an Ärmeln, Säumen, Schürzen, Taschen und anderen Rand- oder Bewegungszonen verwendet. Auf Fest- und Alltagsgegenständen bildet es Teil der Wassersymbolik und vermittelt Fülle, Reinheit und unaufhörliches Leben.` },
                es: { name: `Motivo de pinza de cangrejo`, aliases: `Símbolo de pinza de cangrejo`, origin: `El motivo de garra de cangrejo se relaciona con humedales, vida de valles fluviales y nociones de veneración del agua, reflejando la observación Yi de las fuentes, los seres acuáticos y los ciclos naturales. Aunque el cangrejo es pequeño, entra en el sistema ornamental por sus muchas patas, su caparazón duro y su vitalidad resistente, convirtiéndose en símbolo de vida en el agua.`, visuals: `El diseño suele centrarse en las patas o pinzas del cangrejo, dispuestas de forma simétrica, ramificadas hacia afuera o repetidas en secuencia. Las líneas en forma de gancho, quebradas y articuladas dan movimiento al motivo y lo conectan fácilmente con olas y remolinos de agua.`, meaning: `El motivo simboliza agua abundante, descendencia próspera y vitalidad continua, expresando deseos de crecimiento del grupo y armonía con la naturaleza. El desplazamiento lateral del cangrejo y su caparazón duro también sugieren adaptación, autoprotección y avance firme ante condiciones cambiantes.`, usage: `A menudo se combina con motivos de olas o ondas de agua y se usa en mangas, bajos, delantales, bolsas y otros bordes o zonas con sensación de movimiento. En objetos festivos y cotidianos funciona como parte del sistema simbólico del agua, transmitiendo abundancia, pureza y vida incesante.` }
            }
        });

        Object.assign(patternTranslations, {
            camellia: {
                zh: { origin: `山茶花是彝区山地常见的原生花木，能在寒冷季节开放并保持较长花期。它进入纹样体系，体现了彝族人民对山林物候的细致观察，也寄托了对逆寒而生之物的敬重。`, visuals: `纹样通常以饱满花冠为中心，表现层层叠叠的花瓣和舒展的叶片。构图多呈圆形或对称展开，色彩常用玫红、深红与绿色对比，显得热烈而稳重。`, meaning: `山茶花寒冬绽放，因此被视为坚韧、沉静与持久生命力的象征。它也常被赋予端庄、美好和不惧艰难的品格，呼应彝族在山地环境中顽强生活的精神。`, usage: `山茶花纹常见于女性服饰、头帕、围腰和衣襟装饰，用来增添柔美与吉祥气息。在当代文创与刺绣设计中，它也适合用于表达山地花卉之美和民族审美的温润气质。` },
                en: { origin: `The camellia is a native flowering tree often seen in the mountainous Yi regions, known for blooming through the cold season and lasting for a long time. Its presence in Yi patterns reflects careful observation of mountain ecology and respect for plants that thrive against winter.`, visuals: `The motif usually centers on a full blossom, with layered petals and spreading leaves. It is often arranged in a round or symmetrical composition, using rose red, deep red, and green to create a vivid yet composed visual effect.`, meaning: `Because the camellia blooms in winter, it symbolizes resilience, quiet strength, and enduring vitality. It also suggests grace, beauty, and the courage to face hardship, echoing the Yi people’s spirit of living firmly in the mountains.`, usage: `Camellia patterns are often used on women’s garments, headscarves, aprons, and front panels to bring elegance and auspiciousness. In contemporary embroidery and cultural design, they express both mountain floral beauty and the gentle refinement of Yi aesthetics.` },
                jp: { origin: `山茶花はイ族地域の山地に見られる在来の花木で、寒い季節にも咲き、花期が長いことで知られています。文様に取り入れられたことは、山林の季節変化への細やかな観察と、寒さに耐えて咲く植物への敬意を示しています。`, visuals: `文様はふっくらとした花冠を中心に、重なり合う花弁と伸びやかな葉を表します。円形または左右対称の構図が多く、紅色、深紅、緑の対比によって華やかさと落ち着きを兼ね備えます。`, meaning: `山茶花は冬に咲くため、粘り強さ、静かな力、長く続く生命力の象徴とされます。また、端正な美しさや困難を恐れない品格を表し、山地でたくましく暮らしてきたイ族の精神とも響き合います。`, usage: `山茶花文様は女性の衣服、頭巾、前掛け、襟元などに用いられ、柔らかな美しさと吉祥の意味を添えます。現代の刺繍や文化デザインでも、山の花の美とイ族美学の温かな気質を表す題材として使われます。` },
                fr: { name: `Motif de camélia`, aliases: `Motif de fleur de thé`, origin: `Le camélia est un arbre à fleurs indigène des régions montagneuses Yi, apprécié pour sa floraison en saison froide et sa longue durée. Son intégration dans les motifs témoigne d’une observation attentive de la nature montagnarde et d’un respect pour les plantes capables de fleurir malgré l’hiver.`, visuals: `Le motif place souvent une fleur pleine au centre, avec des pétales superposés et des feuilles ouvertes. La composition est généralement circulaire ou symétrique, associant rose, rouge profond et vert pour produire une impression à la fois vive et équilibrée.`, meaning: `Parce qu’il fleurit en hiver, le camélia symbolise la résistance, la force intérieure et une vitalité durable. Il évoque aussi la beauté digne et le courage face aux difficultés, en résonance avec l’esprit de vie des Yi dans les montagnes.`, usage: `Le motif de camélia apparaît souvent sur les vêtements féminins, les coiffes, les tabliers et les pans de veste, où il apporte élégance et auspice. Dans la création contemporaine et la broderie, il exprime la beauté florale des montagnes et la douceur raffinée de l’esthétique Yi.` },
                de: { name: `Kamelienmuster`, aliases: `Teeblütenmuster`, origin: `Die Kamelie ist ein in den Bergregionen der Yi heimischer Blütenbaum, der auch in der kalten Jahreszeit blüht und lange Blütezeiten besitzt. Als Muster zeigt sie die genaue Beobachtung der Bergnatur und die Wertschätzung für Pflanzen, die dem Winter standhalten.`, visuals: `Das Motiv stellt meist eine volle Blüte mit übereinanderliegenden Blütenblättern und ausgreifenden Blättern dar. Die Komposition ist häufig rund oder symmetrisch, wobei Rosa, Tiefrot und Grün einen lebendigen, zugleich ruhigen Eindruck schaffen.`, meaning: `Da die Kamelie im Winter blüht, steht sie für Widerstandskraft, stille Stärke und dauerhafte Lebenskraft. Zugleich vermittelt sie Würde, Schönheit und Mut vor Schwierigkeiten, was dem Lebensgeist der Yi in den Bergen entspricht.`, usage: `Kamelienmuster finden sich oft auf Frauenkleidung, Kopftüchern, Schürzen und Vorderteilen von Gewändern, wo sie Eleganz und Glücksbedeutung verleihen. In zeitgenössischer Stickerei und Kulturgestaltung eignen sie sich, um Bergblumen und die sanfte Feinheit der Yi-Ästhetik auszudrücken.` },
                es: { name: `Motivo de camelia`, aliases: `Motivo de flor de té`, origin: `La camelia es un árbol florido nativo de las zonas montañosas Yi, conocido por florecer en la estación fría y mantener una floración prolongada. Su presencia en los motivos refleja una observación cuidadosa del entorno de montaña y respeto por las plantas que prosperan frente al invierno.`, visuals: `El motivo suele centrarse en una flor plena, con pétalos superpuestos y hojas extendidas. La composición tiende a ser circular o simétrica, combinando rosa, rojo profundo y verde para lograr un efecto vivo pero sereno.`, meaning: `Como florece en invierno, la camelia simboliza resistencia, fuerza silenciosa y vitalidad duradera. También evoca dignidad, belleza y valentía ante las dificultades, en sintonía con el espíritu de vida del pueblo Yi en la montaña.`, usage: `El motivo de camelia se usa a menudo en prendas femeninas, pañuelos de cabeza, delantales y delanteros de ropa, aportando elegancia y buenos augurios. En el diseño cultural y el bordado contemporáneo, expresa la belleza floral de la montaña y la delicadeza cálida de la estética Yi.` }
            },
            'azalea-red': {
                zh: { origin: `马缨花多生长于彝区高山地带，早春开放，花色鲜红而热烈。它在火把节传说、山地记忆和民间审美中都占有重要位置，是彝族对春天、火焰与生命更新的诗意表达。`, visuals: `纹样多提炼马缨花成簇开放的形态，花冠饱满，枝叶相互映衬。红色常作为主色，与黑、黄、绿等色形成强烈对比，具有火焰般的视觉张力。`, meaning: `马缨花象征顽强的生命力、热情和生生不息的族群精神。它早春破寒而开，也寓意希望到来、青年之美和生活重新兴盛。`, usage: `马缨花纹常用于火把节盛装、婚嫁服饰和女性节庆装束，是最具喜庆感的植物纹样之一。在现代设计中，它适合用于强调热烈、祝福和彝族山地花卉意象的视觉主题。` },
                en: { origin: `The red azalea, or mayinghua, grows widely in high mountain areas of the Yi regions and blooms in early spring with brilliant red flowers. It holds an important place in Torch Festival memory, mountain life, and folk aesthetics, expressing spring, flame, and renewed vitality.`, visuals: `The motif often abstracts clusters of red azalea blossoms, with full corollas set against branches and leaves. Red is usually the dominant color, contrasted with black, yellow, or green to create a flame-like visual intensity.`, meaning: `The red azalea symbolizes tenacious vitality, passion, and the unbroken spirit of the community. Its early spring bloom after cold weather also suggests hope, youthful beauty, and the renewal of life.`, usage: `Red azalea patterns are often used on Torch Festival costumes, wedding garments, and women’s festive attire, making them among the most celebratory plant motifs. In modern design, they are well suited to themes of warmth, blessing, and the floral imagery of Yi mountain culture.` },
                jp: { origin: `馬纓花はイ族地域の高山に多く生育し、早春に鮮やかな赤い花を咲かせます。火把節の記憶、山地の暮らし、民間の美意識の中で重要な位置を占め、春、火、生命の再生を詩的に表します。`, visuals: `文様は馬纓花が房状に咲く姿を抽象化し、豊かな花冠と枝葉の組み合わせで構成されます。赤を主色に、黒、黄、緑などを対比させることで、炎のような強い視覚的印象を生み出します。`, meaning: `馬纓花は粘り強い生命力、情熱、絶えることのない共同体の精神を象徴します。寒さを破って早春に咲くことから、希望の到来、若々しい美しさ、暮らしの再興も意味します。`, usage: `馬纓花文様は火把節の晴れ着、婚礼衣装、女性の祭礼服によく用いられ、植物文様の中でも特に祝祭性が強いものです。現代デザインでは、熱気、祝福、イ族山地の花のイメージを強調する題材に適しています。` },
                fr: { name: `Motif d’azalée rouge`, aliases: `Motif d’azalée`, origin: `L’azalée rouge, ou mayinghua, pousse dans les hautes montagnes des régions Yi et fleurit au début du printemps d’un rouge éclatant. Elle occupe une place importante dans la mémoire de la fête des torches, la vie montagnarde et l’esthétique populaire, exprimant le printemps, la flamme et le renouveau de la vie.`, visuals: `Le motif stylise souvent des grappes de fleurs rouges, avec des corolles pleines accompagnées de branches et de feuilles. Le rouge domine généralement, contrasté avec le noir, le jaune ou le vert pour créer une intensité visuelle proche de la flamme.`, meaning: `L’azalée rouge symbolise la vitalité tenace, la passion et l’esprit communautaire qui se poursuit sans interruption. Sa floraison précoce après le froid évoque aussi l’arrivée de l’espoir, la beauté de la jeunesse et le renouveau de la vie.`, usage: `Ce motif est souvent utilisé sur les costumes de la fête des torches, les vêtements de mariage et les tenues féminines de fête, ce qui en fait l’un des motifs végétaux les plus joyeux. Dans le design contemporain, il convient aux thèmes de chaleur, de bénédiction et d’imaginaire floral des montagnes Yi.` },
                de: { name: `Rotes Azaleenmuster`, aliases: `Azaleenmuster`, origin: `Die rote Azalee, Mayinghua genannt, wächst in den Hochgebirgsregionen der Yi und blüht im frühen Frühling in leuchtendem Rot. Sie ist in Erinnerungen an das Fackelfest, im Bergleben und in der Volksästhetik bedeutsam und steht für Frühling, Flamme und erneuerte Lebenskraft.`, visuals: `Das Motiv abstrahiert häufig büschelweise blühende Azaleen mit vollen Blütenkronen, Zweigen und Blättern. Rot ist meist die Hauptfarbe und wird mit Schwarz, Gelb oder Grün kontrastiert, wodurch eine flammenartige visuelle Spannung entsteht.`, meaning: `Die rote Azalee symbolisiert zähe Lebenskraft, Leidenschaft und den ununterbrochenen Geist der Gemeinschaft. Da sie nach der Kälte im frühen Frühling blüht, verweist sie auch auf Hoffnung, jugendliche Schönheit und Erneuerung des Lebens.`, usage: `Rote Azaleenmuster erscheinen häufig auf Kleidung zum Fackelfest, Hochzeitsgewändern und festlicher Frauenkleidung und zählen zu den besonders feierlichen Pflanzenmotiven. In modernem Design eignen sie sich für Themen wie Wärme, Segen und die Blumenbilder der Yi-Bergkultur.` },
