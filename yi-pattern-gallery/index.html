            { id: 'stone-steps', name: { zh: '石阶纹', en: 'Stone Steps Pattern', jp: '石段紋' }, category: 'artifact', image: './patterns/stone-steps.png', colors: ['#8B7355', '#D4AF37', '#121212'], aliases: { zh: '阶梯纹', en: 'Stepped Stone Motif', jp: '階段石紋' }, origin: {}, visuals: {}, meaning: {}, usage: {} }
        ];

        patternsData.splice(0, patternsData.length, ...updatedPatternsData);

        Object.assign(patternTranslations, {
            rainbow: {
                zh: { name: `彩虹纹`, aliases: `虹桥纹`, origin: `彩虹纹源于彝族先民对雨后天空、山谷水汽和季节转换的观察。彩虹横跨天际，常被理解为连接天与地、雨水与阳光、灾后复苏与生活希望的自然象征。`, visuals: `纹样多以弧线、半圆带、层叠色带或桥形结构构成，强调由内向外展开的秩序。红、黄、绿、蓝等明亮色彩层层并置，使图案具有强烈的节庆感和天空意象。`, meaning: `彩虹纹象征雨过天晴、和合相生与吉祥转机。它把水的滋养和太阳的光热联结起来，寄托人们对丰收、平安以及人与自然重新达成平衡的愿望。`, usage: `彩虹纹适合用于衣襟、披肩、裙摆和儿童服饰，也常与云纹、波浪纹、太阳纹组合成完整的天象叙事。当代设计中可用于节庆视觉、文创包装和公共艺术，表达明朗、团结与希望。` },
                en: { name: `Rainbow Pattern`, aliases: `Rainbow Bridge Motif`, origin: `The rainbow motif comes from Yi observations of post-rain skies, valley mist, and seasonal transition. Spanning the sky, the rainbow is understood as a bridge between heaven and earth, rain and sunlight, recovery after hardship, and renewed hope.`, visuals: `It is often composed of arcs, semicircular bands, layered color strips, or bridge-like structures that unfold outward in order. Bright reds, yellows, greens, and blues are placed in layers, giving the design a festive feeling and a vivid celestial image.`, meaning: `The motif symbolizes clear skies after rain, harmonious coexistence, and auspicious change. By linking the nourishment of water with the warmth of the sun, it carries wishes for harvest, peace, and restored balance between people and nature.`, usage: `It suits front panels, shawls, hems, and children’s garments, and may be combined with cloud, wave, and sun motifs to form a complete sky narrative. In contemporary design, it works for festival visuals, cultural packaging, and public art that express brightness, unity, and hope.` },
                jp: { name: `虹紋`, aliases: `虹橋紋`, origin: `虹紋は、雨上がりの空、谷間の水気、季節の移り変わりを観察して生まれた文様です。空に架かる虹は、天と地、雨と陽光、困難の後の回復と希望を結ぶ橋として理解されます。`, visuals: `弧線、半円状の帯、重なり合う色帯、橋のような構造で構成され、内側から外側へ広がる秩序を強調します。赤、黄、緑、青などの明るい色が層をなして並び、祭礼的で天象的な印象を与えます。`, meaning: `虹紋は雨上がりの晴れやかさ、調和、吉祥な転機を象徴します。水の潤いと太陽の温かさを結びつけ、豊作、平安、人と自然の均衡回復への願いを託します。`, usage: `衣襟、肩掛け、裾、子どもの衣服に適し、雲紋、波紋、太陽紋と組み合わせて天象の物語をつくることもできます。現代では祭礼ビジュアル、文化包装、公共アートに用いられ、明るさ、結束、希望を表します。` },
                fr: { name: `Motif d’arc-en-ciel`, aliases: `Motif du pont arc-en-ciel`, origin: `Le motif d’arc-en-ciel vient de l’observation Yi du ciel après la pluie, des brumes de vallée et des passages saisonniers. Traversant le ciel, l’arc-en-ciel est compris comme un pont entre ciel et terre, pluie et soleil, épreuve passée et espoir retrouvé.`, visuals: `Il se compose souvent d’arcs, de bandes semi-circulaires, de rubans colorés superposés ou de formes de pont qui s’ouvrent avec ordre. Les rouges, jaunes, verts et bleus lumineux créent une image céleste vive et festive.`, meaning: `Il symbolise le ciel dégagé après la pluie, la coexistence harmonieuse et le retournement favorable. En reliant l’eau nourricière à la chaleur solaire, il porte des vœux de récolte, de paix et d’équilibre retrouvé entre humains et nature.`, usage: `Il convient aux devants de vêtements, châles, ourlets et habits d’enfants, et peut s’associer aux nuages, vagues et soleils pour raconter le ciel. Aujourd’hui, il fonctionne dans les visuels festifs, emballages culturels et arts publics exprimant clarté, unité et espoir.` },
                de: { name: `Regenbogenmuster`, aliases: `Regenbogenbrücken-Motiv`, origin: `Das Regenbogenmuster entsteht aus der Beobachtung von Himmel nach dem Regen, Talnebel und jahreszeitlichen Übergängen. Als Bogen über dem Himmel verbindet der Regenbogen Himmel und Erde, Regen und Sonnenlicht, überwundene Schwierigkeiten und neue Hoffnung.`, visuals: `Es besteht oft aus Bögen, halbkreisförmigen Bändern, geschichteten Farbstreifen oder brückenartigen Formen, die sich geordnet nach außen öffnen. Helle Rot-, Gelb-, Grün- und Blautöne erzeugen ein festliches, himmlisches Bild.`, meaning: `Das Motiv steht für Klarheit nach dem Regen, harmonisches Zusammenleben und glückliche Wendung. Es verbindet die nährende Kraft des Wassers mit der Wärme der Sonne und trägt Wünsche nach Ernte, Frieden und neuem Gleichgewicht zwischen Mensch und Natur.`, usage: `Es eignet sich für Vorderteile, Schultertücher, Säume und Kinderkleidung und kann mit Wolken-, Wellen- und Sonnenmotiven zu einer Himmelserzählung verbunden werden. In modernem Design passt es zu Festvisuals, Kulturverpackungen und öffentlicher Kunst mit Botschaften von Helligkeit, Einheit und Hoffnung.` },
                es: { name: `Motivo de arcoíris`, aliases: `Motivo de puente arcoíris`, origin: `El motivo de arcoíris procede de la observación Yi del cielo tras la lluvia, la bruma de los valles y los cambios de estación. Al cruzar el cielo, el arcoíris se entiende como puente entre cielo y tierra, lluvia y sol, dificultad superada y esperanza renovada.`, visuals: `Suele componerse de arcos, bandas semicirculares, franjas de color superpuestas o estructuras de puente que se despliegan con orden. Rojos, amarillos, verdes y azules brillantes crean una imagen celeste y festiva.`, meaning: `Simboliza claridad después de la lluvia, convivencia armoniosa y cambio favorable. Al unir la nutrición del agua con el calor del sol, expresa deseos de cosecha, paz y equilibrio restaurado entre las personas y la naturaleza.`, usage: `Funciona en delanteros, chales, dobladillos y ropa infantil, y puede combinarse con nubes, olas y soles para formar un relato del cielo. En el diseño contemporáneo sirve para gráficas festivas, empaques culturales y arte público que transmiten luminosidad, unidad y esperanza.` }
            },
            star: {
                zh: { name: `星纹`, aliases: `星辰纹`, origin: `星纹源于彝族先民对夜空、星宿和方位的长期观察。山地夜行、农时判断和祭仪时间都与星象有关，因此星辰被纳入纹样体系，成为秩序、方向和天意的象征。`, visuals: `星纹常以多角星、点阵、放射短线或十字形几何结构呈现，也可与日月、火焰、波浪组合。点与线的重复形成闪烁节奏，深色底上使用黄、白、金色更能表现夜空的明亮。`, meaning: `星纹象征指引、守望、时间秩序和祖灵庇护。星光虽微却恒久，寓意人在山地生活中依靠智慧辨认方向，也寄托对平安旅途和家族延续的祝福。`, usage: `星纹多用于帽饰、衣肩、胸背、儿童服饰和祭礼装饰，常作为天象组合的辅助纹样。现代设计中可用于夜空主题、导视符号、首饰和数字视觉，表达引路与守护。` },
                en: { name: `Star Pattern`, aliases: `Starlight Motif`, origin: `The star motif comes from long observation of the night sky, constellations, and direction by Yi ancestors. Night travel, farming time, and ritual calendars were linked to stars, so they entered the pattern system as symbols of order, orientation, and heavenly will.`, visuals: `It often appears as multi-point stars, dotted arrays, radiating short lines, or cross-shaped geometry, and may be paired with sun, moon, flame, and wave motifs. Repeated dots and lines create a flickering rhythm, while yellow, white, and gold on dark grounds evoke the brightness of the night sky.`, meaning: `The motif symbolizes guidance, watchfulness, temporal order, and ancestral protection. Although starlight is small, it is constant, suggesting the wisdom to find direction in mountain life and blessings for safe journeys and family continuity.`, usage: `It is used on headdresses, shoulders, chest and back panels, children’s clothing, and ritual decoration, often as a supporting element in celestial compositions. In modern design, it suits night-sky themes, wayfinding symbols, jewelry, and digital visuals expressing guidance and protection.` },
                jp: { name: `星紋`, aliases: `星辰紋`, origin: `星紋は、イ族の先人が夜空、星宿、方位を長く観察してきたことに由来します。山地での夜間移動、農時の判断、祭礼の時期は星象と関わり、星は秩序、方向、天意の象徴として文様に取り入れられました。`, visuals: `多角形の星、点の配列、放射状の短線、十字形の幾何構造として表され、日月、火炎、波紋と組み合わされることもあります。点と線の反復がきらめくリズムをつくり、濃色の地に黄、白、金を置くことで夜空の明るさを表します。`, meaning: `星紋は導き、見守り、時間秩序、祖霊の加護を象徴します。星の光は小さくとも恒久であり、山地生活で方向を見定める知恵と、安全な旅、家族の継続への祈りを表します。`, usage: `頭飾り、肩、胸背、子どもの衣服、祭礼装飾に用いられ、天象文様の補助要素となることも多いです。現代では夜空テーマ、案内記号、装身具、デジタルビジュアルに適し、導きと守護を表現します。` },
                fr: { name: `Motif d’étoile`, aliases: `Motif de lumière stellaire`, origin: `Le motif d’étoile vient de l’observation prolongée du ciel nocturne, des constellations et des directions par les ancêtres Yi. Les déplacements de nuit, le calendrier agricole et les rites étant liés aux astres, l’étoile est devenue symbole d’ordre, d’orientation et de volonté céleste.`, visuals: `Il apparaît sous forme d’étoiles à plusieurs pointes, de réseaux de points, de courts rayons ou de géométries en croix, souvent associé au soleil, à la lune, aux flammes ou aux vagues. La répétition des points et lignes crée un scintillement, tandis que le jaune, le blanc et l’or sur fond sombre évoquent la nuit étoilée.`, meaning: `Il symbolise le guidage, la veille, l’ordre du temps et la protection ancestrale. Petite mais constante, la lumière des étoiles rappelle la sagesse nécessaire pour s’orienter en montagne et porte des vœux de voyage sûr et de continuité familiale.`, usage: `On l’utilise sur les coiffes, épaules, panneaux de poitrine et de dos, vêtements d’enfants et décors rituels, souvent comme élément de composition céleste. Dans le design actuel, il convient aux thèmes nocturnes, signes d’orientation, bijoux et visuels numériques liés au guidage et à la protection.` },
                de: { name: `Sternmuster`, aliases: `Sternlicht-Motiv`, origin: `Das Sternmuster beruht auf der langen Beobachtung von Nachthimmel, Sternbildern und Richtungen durch die Yi-Vorfahren. Nachtwege, landwirtschaftliche Zeiten und Rituale standen mit den Sternen in Beziehung, daher wurden sie zu Symbolen für Ordnung, Orientierung und himmlischen Willen.`, visuals: `Es erscheint als mehrzackige Sterne, Punktfelder, kurze Strahlen oder kreuzartige Geometrie und kann mit Sonne, Mond, Flammen und Wellen kombiniert werden. Wiederholte Punkte und Linien erzeugen ein Flimmern; Gelb, Weiß und Gold auf dunklem Grund verweisen auf den hellen Nachthimmel.`, meaning: `Das Muster symbolisiert Führung, Wachsamkeit, zeitliche Ordnung und Ahnenschutz. Sternlicht ist klein, aber beständig, und steht für die Weisheit, in den Bergen Richtung zu finden, sowie für sichere Wege und familiäre Fortdauer.`, usage: `Es findet sich auf Kopfschmuck, Schultern, Brust- und Rückenpartien, Kinderkleidung und Ritualschmuck, oft als Begleiter himmlischer Motive. In modernem Design eignet es sich für Nachthimmelthemen, Leitsymbole, Schmuck und digitale Visuals, die Führung und Schutz ausdrücken.` },
                es: { name: `Motivo de estrellas`, aliases: `Motivo de luz estelar`, origin: `El motivo de estrellas procede de la larga observación Yi del cielo nocturno, las constelaciones y las direcciones. Los viajes nocturnos, los tiempos agrícolas y los calendarios rituales se vinculaban con los astros, por lo que la estrella entró en el sistema ornamental como símbolo de orden, orientación y voluntad celestial.`, visuals: `Aparece como estrellas de varias puntas, campos de puntos, rayos cortos o geometrías en cruz, y puede combinarse con sol, luna, llamas y olas. La repetición de puntos y líneas crea un ritmo de centelleo; amarillo, blanco y dorado sobre fondos oscuros evocan el brillo del cielo nocturno.`, meaning: `Simboliza guía, vigilancia, orden temporal y protección ancestral. La luz estelar es pequeña pero constante, sugiriendo la sabiduría para orientarse en la montaña y bendiciones para viajes seguros y continuidad familiar.`, usage: `Se usa en tocados, hombros, paneles de pecho y espalda, ropa infantil y decoración ritual, a menudo como elemento auxiliar en composiciones celestes. En diseño contemporáneo funciona en temas de cielo nocturno, señalética, joyería y visuales digitales que expresan guía y protección.` }
            },
            bird: {
                zh: { name: `鸟纹`, aliases: `飞鸟纹`, origin: `鸟纹源于彝族对山林飞鸟、迁徙季节和天空信息的观察。鸟能往来天地之间，被赋予传递消息、引路和连接人神世界的象征意义。`, visuals: `纹样常提炼鸟喙、羽翼、尾羽和飞翔姿态，以对称展开或连续排列形成轻盈节奏。弧线与尖角表现翅膀的张力，蓝、白、黄与黑色对比强化天空和羽毛的意象。`, meaning: `鸟纹象征自由、灵动、吉讯和灵魂升腾。它也寓意对远方亲人的思念、对道路平安的祝愿，以及人与自然万物相互沟通的观念。`, usage: `鸟纹适合用于肩部、胸背、帽饰、挎包和儿童服饰，常与星纹、云纹、花草纹组合。现代应用中可用于插画、品牌纹样和文创饰品，传达轻盈、守护和远行的祝福。` },
                en: { name: `Bird Pattern`, aliases: `Flying Bird Motif`, origin: `The bird motif comes from Yi observation of forest birds, seasonal migration, and signs in the sky. Birds move between earth and heaven, so they are given meanings of message-bearing, guidance, and connection between human and sacred worlds.`, visuals: `It often abstracts beaks, wings, tail feathers, and flying postures, arranged symmetrically or in repeated sequences for a light rhythm. Curves and sharp angles show the tension of wings, while blue, white, yellow, and black contrasts strengthen images of sky and feathers.`, meaning: `The motif symbolizes freedom, agility, good news, and the rising of the spirit. It also expresses longing for distant loved ones, wishes for safe travel, and a view of communication between people and the natural world.`, usage: `It suits shoulders, chest and back panels, headdresses, shoulder bags, and children’s garments, often combined with stars, clouds, and floral motifs. In modern use, it works for illustration, brand patterns, and cultural accessories that convey lightness, protection, and blessings for journeys.` },
                jp: { name: `鳥紋`, aliases: `飛鳥紋`, origin: `鳥紋は、山林の鳥、季節ごとの移動、空からの兆しを観察して生まれました。鳥は地上と天の間を往来するため、知らせを運び、道を導き、人間世界と神聖な世界をつなぐ存在とされます。`, visuals: `くちばし、翼、尾羽、飛翔姿勢を抽象化し、左右対称または連続配列で軽やかなリズムをつくります。弧線と尖った形で翼の張力を表し、青、白、黄、黒の対比が空と羽のイメージを強めます。`, meaning: `鳥紋は自由、敏捷さ、吉報、魂の上昇を象徴します。また遠くの親族への思い、安全な旅への願い、人と自然万物が互いに通じ合うという考えも表します。`, usage: `肩、胸背、頭飾り、肩掛け袋、子どもの衣服に適し、星紋、雲紋、草花紋と組み合わされることがあります。現代ではイラスト、ブランドパターン、文創アクセサリーに用いられ、軽やかさ、守護、旅への祝福を伝えます。` },
                fr: { name: `Motif d’oiseau`, aliases: `Motif d’oiseau en vol`, origin: `Le motif d’oiseau vient de l’observation Yi des oiseaux de forêt, des migrations saisonnières et des signes du ciel. L’oiseau passant entre terre et ciel, il reçoit des sens de messager, de guide et de lien entre monde humain et monde sacré.`, visuals: `Il stylise souvent bec, ailes, plumes de queue et posture de vol, en compositions symétriques ou répétées qui créent un rythme léger. Courbes et angles marquent la tension des ailes, tandis que les contrastes bleu, blanc, jaune et noir renforcent l’image du ciel et du plumage.`, meaning: `Il symbolise la liberté, l’agilité, les bonnes nouvelles et l’élévation de l’esprit. Il évoque aussi la pensée pour les proches lointains, le souhait d’un voyage sûr et l’idée d’une communication entre humains et nature.`, usage: `Il convient aux épaules, panneaux de poitrine et de dos, coiffes, sacs et vêtements d’enfants, souvent associé aux étoiles, nuages et fleurs. En design contemporain, il s’applique à l’illustration, aux motifs de marque et aux accessoires culturels portant légèreté, protection et bénédiction du voyage.` },
                de: { name: `Vogelmuster`, aliases: `Flugvogel-Motiv`, origin: `Das Vogelmuster entsteht aus der Beobachtung von Waldvögeln, jahreszeitlichen Wanderungen und Himmelszeichen durch die Yi. Da Vögel zwischen Erde und Himmel wechseln, gelten sie als Boten, Wegweiser und Verbindung zwischen menschlicher und heiliger Welt.`, visuals: `Es abstrahiert Schnabel, Flügel, Schwanzfedern und Flughaltungen, symmetrisch oder in Reihen angeordnet und mit leichtem Rhythmus. Kurven und Spitzen zeigen die Spannung der Flügel; Blau, Weiß, Gelb und Schwarz verstärken Himmel- und Federbilder.`, meaning: `Das Muster symbolisiert Freiheit, Beweglichkeit, gute Nachrichten und das Aufsteigen des Geistes. Es steht auch für Sehnsucht nach entfernten Angehörigen, sichere Wege und die Vorstellung einer Kommunikation zwischen Mensch und Natur.`, usage: `Es eignet sich für Schultern, Brust- und Rückenpartien, Kopfschmuck, Taschen und Kinderkleidung, oft zusammen mit Stern-, Wolken- und Blumenmotiven. Modern passt es zu Illustration, Markenmustern und Kulturschmuck, der Leichtigkeit, Schutz und Reisesegen vermittelt.` },
                es: { name: `Motivo de ave`, aliases: `Motivo de ave en vuelo`, origin: `El motivo de ave nace de la observación Yi de aves del bosque, migraciones estacionales y señales del cielo. Al moverse entre tierra y cielo, el ave adquiere sentidos de mensajera, guía y vínculo entre el mundo humano y el sagrado.`, visuals: `Suele abstraer pico, alas, plumas de cola y posturas de vuelo, en composiciones simétricas o repetidas que generan un ritmo ligero. Curvas y ángulos expresan la tensión de las alas, mientras los contrastes de azul, blanco, amarillo y negro refuerzan cielo y plumaje.`, meaning: `Simboliza libertad, agilidad, buenas noticias y elevación del espíritu. También expresa la añoranza por seres queridos lejanos, deseos de viaje seguro y la idea de comunicación entre las personas y la naturaleza.`, usage: `Funciona en hombros, paneles de pecho y espalda, tocados, bolsos y ropa infantil, a menudo combinado con estrellas, nubes y flores. En diseño contemporáneo sirve para ilustración, patrones de marca y accesorios culturales que transmiten ligereza, protección y bendición para el camino.` }
            },
            'rooster-comb': {
                zh: { name: `鸡冠纹`, aliases: `鸡冠花形纹`, origin: `鸡冠纹来自家禽鸡冠和鸡冠花形态的双重观察，既联系家庭养殖，也联系庭院花卉。雄鸡报晓在乡村生活中具有时间提示意义，因此鸡冠纹也带有唤醒晨光、开启新日的象征。`, visuals: `纹样常呈连续锯齿、波峰、扇形或花冠状结构，边缘起伏鲜明。红色和金黄色常被用来表现鸡冠的鲜亮与生命力，重复排列时具有强烈的节奏和装饰边饰效果。`, meaning: `鸡冠纹象征勤勉守时、清晨新生、家宅兴旺和喜庆热烈。它把家禽守护庭院的日常经验转化为吉祥寓意，表达对有序生活和红火日子的祝愿。`, usage: `鸡冠纹可用于衣袖、领口、裙边、围腰和头帕边缘，尤其适合作为节庆服饰的边饰。现代设计中可用于喜庆包装、儿童用品和乡土主题插画，强化活力和欢庆感。` },
                en: { name: `Rooster Comb Pattern`, aliases: `Cockscomb Motif`, origin: `The rooster-comb motif comes from observing both the comb of domestic chickens and the cockscomb flower, linking household husbandry with courtyard plants. The rooster’s crow marks time in village life, so the motif also suggests waking the morning light and beginning a new day.`, visuals: `It often appears as serrated sequences, wave peaks, fan shapes, or crest-like floral structures with pronounced edges. Red and gold express the comb’s brightness and vitality, and repeated arrangements create strong rhythm and border decoration.`, meaning: `The motif symbolizes diligence, punctuality, morning renewal, household prosperity, and festive warmth. It transforms the everyday image of poultry guarding the courtyard into an auspicious wish for ordered life and flourishing days.`, usage: `It can be used on sleeves, collars, hems, aprons, and headscarf edges, especially as a border for festive clothing. In modern design, it suits celebratory packaging, children’s products, and rural-themed illustration that emphasize vitality and joy.` },
                jp: { name: `鶏冠紋`, aliases: `鶏冠花紋`, origin: `鶏冠紋は、家禽の鶏冠と鶏冠花の形への観察から生まれ、家庭の飼育と庭の花の双方に結びついています。雄鶏の時を告げる声は村の暮らしで時間の目安となるため、朝の光を呼び、新しい一日を開く象徴でもあります。`, visuals: `連続する鋸歯、波峰、扇形、花冠状の構造として表され、起伏のある縁が特徴です。赤と金色は鶏冠の鮮やかさと生命力を表し、反復すると強いリズムと縁飾りの効果を生みます。`, meaning: `鶏冠紋は勤勉、時間を守ること、朝の再生、家の繁栄、祝いの熱気を象徴します。庭を守る家禽の日常的な姿を吉祥の意味に変え、整った暮らしと紅火な日々への願いを表します。`, usage: `袖、襟、裾、前掛け、頭巾の縁に用いられ、祭礼服の縁飾りに特に適しています。現代では祝いの包装、子ども用品、郷土テーマのイラストに応用され、活気と喜びを強めます。` },
                fr: { name: `Motif de crête de coq`, aliases: `Motif de crête et célosie`, origin: `Le motif de crête de coq vient de l’observation de la crête des volailles domestiques et de la fleur de célosie, reliant élevage familial et fleurs de cour. Le chant du coq marquant l’heure dans la vie rurale, le motif évoque aussi l’éveil de l’aube et le commencement d’un nouveau jour.`, visuals: `Il se présente en dents continues, crêtes ondulées, éventails ou formes florales à bords très marqués. Rouge et or expriment l’éclat et la vitalité de la crête, tandis que la répétition produit un rythme fort et un effet de bordure décorative.`, meaning: `Il symbolise l’ardeur au travail, la ponctualité, le renouveau du matin, la prospérité du foyer et la chaleur festive. Il transforme l’image quotidienne de la volaille gardant la cour en souhait favorable d’une vie ordonnée et florissante.`, usage: `Il convient aux manches, cols, ourlets, tabliers et bords de coiffes, surtout comme bordure des vêtements de fête. Dans la création contemporaine, il s’adapte aux emballages festifs, produits pour enfants et illustrations rurales qui soulignent vitalité et joie.` },
                de: { name: `Hahnenkammmuster`, aliases: `Hahnenkamm- und Cockscomb-Motiv`, origin: `Das Hahnenkammmuster geht auf die Beobachtung des Kamms von Haushühnern und der Hahnenkammblume zurück und verbindet Hofhaltung mit Gartenpflanzen. Da der Hahnenschrei im Dorfleben Zeit markiert, verweist das Motiv auch auf das Erwachen des Morgenlichts und den Beginn eines neuen Tages.`, visuals: `Es erscheint als gezackte Reihen, Wellenkämme, Fächer oder blütenkammartige Formen mit deutlichen Rändern. Rot und Gold zeigen Glanz und Lebenskraft; Wiederholungen erzeugen starken Rhythmus und dekorative Bordürenwirkung.`, meaning: `Das Motiv symbolisiert Fleiß, Pünktlichkeit, morgendliche Erneuerung, häuslichen Wohlstand und festliche Wärme. Es verwandelt das Alltagsbild des Hofgeflügels in einen Glückswunsch für geordnetes und blühendes Leben.`, usage: `Es eignet sich für Ärmel, Kragen, Säume, Schürzen und Kopftuchränder, besonders als Bordüre von Festkleidung. Modern passt es zu Festverpackungen, Kinderprodukten und ländlich geprägter Illustration, die Lebendigkeit und Freude betonen.` },
                es: { name: `Motivo de cresta de gallo`, aliases: `Motivo de cresta y celosía`, origin: `El motivo de cresta de gallo procede de observar tanto la cresta de las aves domésticas como la flor celosía, uniendo crianza familiar y flores de patio. El canto del gallo marca el tiempo en la vida rural, por lo que el motivo también sugiere despertar la luz de la mañana e iniciar un nuevo día.`, visuals: `Aparece como secuencias dentadas, crestas onduladas, abanicos o formas florales con bordes pronunciados. El rojo y el dorado expresan brillo y vitalidad, y la repetición crea un ritmo fuerte y efecto de cenefa decorativa.`, meaning: `Simboliza diligencia, puntualidad, renovación matinal, prosperidad del hogar y alegría festiva. Transforma la imagen cotidiana del ave que guarda el patio en un deseo auspicioso de vida ordenada y días florecientes.`, usage: `Puede usarse en mangas, cuellos, bajos, delantales y bordes de pañuelos, especialmente como cenefa en ropa festiva. En diseño actual encaja en empaques celebratorios, productos infantiles e ilustración rural que enfatiza vitalidad y alegría.` }
            },
            'horse-tooth': {
                zh: { name: `马牙纹`, aliases: `马齿纹`, origin: `马牙纹与彝族山地交通、驮运和马匹崇敬有关。马在迁徙、贸易和礼仪往来中承担重要作用，马齿的坚硬与整齐被转化为象征力量、行旅和秩序的几何纹样。`, visuals: `纹样常以连续三角、锯齿、短斜线或齿列结构呈现，排列紧密而方向明确。黑、白、棕、金等色彩强调牙齿的坚硬和马具的质感，也便于作为边饰连接其他图案。`, meaning: `马牙纹象征行路平安、体魄强健、速度与坚毅。齿列的重复寓意队伍整齐、步伐稳健，也寄托人们对远行顺利、贸易兴旺和家族联系不断的祝愿。`, usage: `马牙纹常用于衣襟、腰带、背包、马具装饰和服饰边线，是很适合做连续边饰的纹样。当代设计中可用于运动视觉、旅行主题、包装边框和图案系统，传达前进与守护。` },
                en: { name: `Horse Tooth Pattern`, aliases: `Horse-Tooth Motif`, origin: `The horse-tooth motif is connected with Yi mountain transport, pack animals, and respect for horses. Horses were important in migration, trade, and ritual exchange, and the hardness and order of teeth became a geometric symbol of strength, travel, and discipline.`, visuals: `It often appears as continuous triangles, serrations, short diagonal strokes, or tooth-row structures with compact rhythm and clear direction. Black, white, brown, and gold emphasize hardness and the texture of horse gear, while the form works naturally as a border linking other motifs.`, meaning: `The motif symbolizes safe travel, strong bodies, speed, and perseverance. Repeated teeth suggest orderly teams and steady steps, carrying wishes for smooth journeys, prosperous trade, and unbroken family connections.`, usage: `It is often used on front openings, belts, bags, horse gear, and garment borders, where it functions well as a continuous edge pattern. In contemporary design, it suits sports visuals, travel themes, packaging borders, and pattern systems that convey forward motion and protection.` },
                jp: { name: `馬歯紋`, aliases: `馬齒紋`, origin: `馬歯紋は、イ族の山地交通、荷駄、馬への敬意と関係しています。馬は移動、交易、儀礼的往来で重要な役割を担い、馬の歯の硬さと整然とした形が、力、旅、秩序を象徴する幾何文様となりました。`, visuals: `連続する三角形、鋸歯、短い斜線、歯列状の構造として表され、密なリズムと明確な方向性を持ちます。黒、白、褐色、金色は歯の硬さや馬具の質感を強調し、他の文様をつなぐ縁飾りとしても使いやすいです。`, meaning: `馬歯紋は旅の安全、強い体、速さ、粘り強さを象徴します。歯列の反復は隊列の整然さと安定した歩みを表し、遠行の順調、交易の繁栄、家族のつながりが絶えないことへの願いを込めます。`, usage: `衣襟、帯、袋、馬具装飾、衣服の縁線に用いられ、連続する縁文様に適しています。現代ではスポーツビジュアル、旅のテーマ、包装の枠、パターンシステムに応用でき、前進と守護を伝えます。` },
                fr: { name: `Motif de dent de cheval`, aliases: `Motif de dents de cheval`, origin: `Le motif de dent de cheval est lié au transport en montagne, aux animaux de bât et au respect des chevaux chez les Yi. Le cheval jouait un rôle essentiel dans les migrations, les échanges et les rites ; la dureté et l’ordre des dents sont devenus un symbole géométrique de force, de voyage et de discipline.`, visuals: `Il apparaît souvent comme une suite de triangles, de dents, de courtes diagonales ou de rangées serrées, avec un rythme compact et une direction claire. Noir, blanc, brun et or soulignent la dureté de la dent et la matière du harnachement, tout en permettant une fonction de bordure.`, meaning: `Il symbolise la sécurité du voyage, la vigueur du corps, la vitesse et la persévérance. La répétition des dents évoque une file ordonnée et des pas stables, portant des vœux de route sans encombre, de commerce prospère et de liens familiaux continus.`, usage: `On l’utilise sur les ouvertures de vêtements, ceintures, sacs, harnachements et bordures, où il fonctionne très bien comme motif continu. Dans le design contemporain, il convient aux univers sportifs, au voyage, aux cadres d’emballage et aux systèmes de motifs exprimant avancée et protection.` },
                de: { name: `Pferdezahnmuster`, aliases: `Pferdezahn-Motiv`, origin: `Das Pferdezahnmuster hängt mit Gebirgstransport, Lasttieren und der Wertschätzung von Pferden bei den Yi zusammen. Pferde waren für Wanderungen, Handel und rituelle Besuche wichtig; die Härte und Ordnung der Zähne wurde zu einem geometrischen Zeichen für Kraft, Reise und Disziplin.`, visuals: `Es erscheint als fortlaufende Dreiecke, Zacken, kurze Diagonalen oder Zahnreihen mit engem Rhythmus und klarer Richtung. Schwarz, Weiß, Braun und Gold betonen Härte und Pferdegeschirr, zugleich eignet sich die Form als Bordüre, die andere Motive verbindet.`, meaning: `Das Motiv symbolisiert sichere Wege, kräftigen Körper, Geschwindigkeit und Ausdauer. Die wiederholten Zähne verweisen auf geordnete Reihen und feste Schritte und tragen Wünsche nach gelingenden Reisen, blühendem Handel und ununterbrochenen Familienbindungen.`, usage: `Es wird an Gewandöffnungen, Gürteln, Taschen, Pferdegeschirr und Kleidungsrändern eingesetzt und eignet sich besonders als fortlaufende Bordüre. Modern passt es zu Sportvisuals, Reisethemen, Verpackungsrahmen und Mustersystemen, die Vorwärtsbewegung und Schutz vermitteln.` },
                es: { name: `Motivo de diente de caballo`, aliases: `Motivo de dientes de caballo`, origin: `El motivo de diente de caballo se relaciona con el transporte de montaña, los animales de carga y el respeto Yi por los caballos. El caballo fue importante en migraciones, comercio e intercambios rituales, y la dureza y orden de los dientes se convirtió en símbolo geométrico de fuerza, viaje y disciplina.`, visuals: `Aparece como triángulos continuos, dientes, líneas diagonales cortas o filas dentadas con ritmo compacto y dirección clara. Negro, blanco, marrón y dorado enfatizan la dureza y la textura del aparejo, y la forma funciona bien como borde que enlaza otros motivos.`, meaning: `Simboliza viaje seguro, cuerpo fuerte, velocidad y perseverancia. La repetición dental sugiere filas ordenadas y pasos firmes, llevando deseos de trayectos fluidos, comercio próspero y vínculos familiares continuos.`, usage: `Se usa en aberturas de prendas, cinturones, bolsas, adornos de caballo y bordes de ropa, donde funciona como patrón continuo. En diseño contemporáneo encaja en visuales deportivos, temas de viaje, marcos de empaque y sistemas de patrones que comunican avance y protección.` }
            },
            'grass-leaf': {
                zh: { name: `草叶纹`, aliases: `草木叶纹`, origin: `草叶纹来自彝区山坡、草地和农田边缘常见的草木形态。草叶虽细小，却在春夏迅速生长，护土养畜，体现了彝族对日常自然生命的细致感受。`, visuals: `纹样多以细长叶片、对生叶、弧线叶脉和连续草丛构成，线条舒展而富有方向感。绿色、青色和土褐色常被用于表现草木生长，也能与花纹、波浪纹形成柔和过渡。`, meaning: `草叶纹象征平凡生命的韧性、土地的滋养和岁时更新。它提醒人们珍视看似微小却支撑牧养与农事的自然力量，也寓意家园常青、生活绵长。`, usage: `草叶纹常用于日常服饰、围腰、袖口、裙摆和家居织品，适合作为底纹或边饰衬托主纹样。现代设计中可用于生态主题、纺织纹理和文创插画，表达清新、朴素与生长。` },
                en: { name: `Grass Leaf Pattern`, aliases: `Meadow Leaf Motif`, origin: `The grass-leaf motif comes from grasses found on Yi slopes, meadows, and field edges. Though small, grass grows quickly in spring and summer, protects soil, and feeds livestock, reflecting Yi sensitivity to ordinary forms of natural life.`, visuals: `It is composed of slender leaves, paired leaves, arched veins, and continuous tufts, with lines that stretch gently and directionally. Greens, cyans, and earthy browns express plant growth and also create soft transitions with flower or wave motifs.`, meaning: `The motif symbolizes the resilience of humble life, the nourishment of land, and seasonal renewal. It reminds people to value small natural forces that support herding and farming, and it suggests an evergreen homeland and enduring life.`, usage: `It is often used on daily garments, aprons, cuffs, hems, and household textiles, working well as a ground pattern or border supporting main motifs. In modern design, it suits ecological themes, textile textures, and cultural illustration expressing freshness, simplicity, and growth.` },
                jp: { name: `草葉紋`, aliases: `草木葉紋`, origin: `草葉紋は、イ族地域の斜面、草地、田畑の縁に見られる草木の姿に由来します。草葉は小さいながら春夏に素早く伸び、土を守り家畜を養うため、日常の自然生命への細やかな感受性を表しています。`, visuals: `細長い葉、対生する葉、弧を描く葉脈、連続する草むらで構成され、線は伸びやかで方向性があります。緑、青緑、土褐色は草木の成長を表し、花紋や波紋との柔らかなつながりもつくります。`, meaning: `草葉紋は平凡な生命の粘り強さ、土地の滋養、季節の更新を象徴します。牧畜や農事を支える小さな自然の力を大切にする心を示し、家郷が常に青く、暮らしが長く続くことを意味します。`, usage: `日常衣服、前掛け、袖口、裾、家庭用織物に用いられ、主文様を支える地紋や縁飾りに適しています。現代ではエコロジーのテーマ、織物テクスチャ、文創イラストに使われ、清新さ、素朴さ、成長を表します。` },
                fr: { name: `Motif de feuille d’herbe`, aliases: `Motif de feuilles de prairie`, origin: `Le motif de feuille d’herbe vient des herbes des pentes, prairies et bords de champs des régions Yi. Petites mais vigoureuses, elles poussent vite au printemps et en été, protègent le sol et nourrissent les troupeaux, révélant une attention aux formes ordinaires du vivant.`, visuals: `Il se compose de feuilles fines, de feuilles opposées, de nervures courbes et de touffes continues, avec des lignes souples et orientées. Les verts, bleus verts et bruns de terre expriment la croissance végétale et permettent des transitions douces avec fleurs ou vagues.`, meaning: `Il symbolise la résistance des vies modestes, la nourriture de la terre et le renouvellement des saisons. Il rappelle la valeur des petites forces naturelles qui soutiennent l’élevage et l’agriculture, et évoque un foyer toujours vert et une vie durable.`, usage: `On le trouve sur les vêtements quotidiens, tabliers, poignets, ourlets et textiles domestiques, comme fond ou bordure soutenant les motifs principaux. Dans le design actuel, il convient aux thèmes écologiques, textures textiles et illustrations culturelles exprimant fraîcheur, simplicité et croissance.` },
                de: { name: `Grasblattmuster`, aliases: `Wiesenblatt-Motiv`, origin: `Das Grasblattmuster stammt von Gräsern an Hängen, Wiesen und Feldrändern der Yi-Gebiete. Obwohl klein, wachsen Gräser im Frühling und Sommer schnell, schützen den Boden und nähren Vieh, wodurch die Aufmerksamkeit der Yi für alltägliches Naturleben sichtbar wird.`, visuals: `Es besteht aus schmalen Blättern, paarigen Blättern, gebogenen Blattadern und fortlaufenden Grasbüscheln, mit sanft gerichteten Linien. Grün, Blaugrün und Erdbraun zeigen Pflanzenwachstum und schaffen weiche Übergänge zu Blumen- oder Wellenmotiven.`, meaning: `Das Motiv symbolisiert die Widerstandskraft des kleinen Lebens, die nährende Erde und jahreszeitliche Erneuerung. Es erinnert daran, kleine Naturkräfte zu schätzen, die Hirten- und Ackerleben tragen, und steht für eine immergrüne Heimat und dauerhaftes Leben.`, usage: `Es erscheint auf Alltagskleidung, Schürzen, Ärmelabschlüssen, Säumen und Heimtextilien, gut als Grundmuster oder Bordüre für Hauptmotive. Modern eignet es sich für ökologische Themen, Textilstrukturen und kulturelle Illustration, die Frische, Schlichtheit und Wachstum vermitteln.` },
                es: { name: `Motivo de hoja de hierba`, aliases: `Motivo de hojas de pradera`, origin: `El motivo de hoja de hierba procede de las plantas comunes en laderas, praderas y bordes de campos Yi. Aunque pequeñas, crecen rápido en primavera y verano, protegen el suelo y alimentan al ganado, mostrando la sensibilidad Yi hacia la vida natural cotidiana.`, visuals: `Se compone de hojas alargadas, hojas opuestas, nervaduras curvas y matas continuas, con líneas suaves y direccionales. Verdes, azul verdoso y marrones terrosos expresan crecimiento vegetal y crean transiciones suaves con flores u olas.`, meaning: `Simboliza la resistencia de la vida humilde, la nutrición de la tierra y la renovación estacional. Recuerda valorar las pequeñas fuerzas naturales que sostienen pastoreo y agricultura, y sugiere un hogar siempre verde y una vida duradera.`, usage: `Se usa en ropa cotidiana, delantales, puños, bajos y textiles domésticos, como fondo o borde que acompaña motivos principales. En diseño moderno encaja en temas ecológicos, texturas textiles e ilustración cultural que comunica frescura, sencillez y crecimiento.` }
            },
            'octagonal-flower': {
                zh: { name: `八角花纹`, aliases: `八瓣花纹`, origin: `八角花纹来自彝绣中常见的几何花卉表达，也与八方、四时和空间秩序的观念相连。花被规整为八角结构，体现了彝族把自然花形转化为宇宙秩序图案的审美能力。`, visuals: `纹样通常以中心点或小圆为核心，向八个方向伸出花瓣、角形或菱形单元。对称结构稳定而庄重，红、黄、绿、紫等色彩交替使用，使花形兼具几何秩序和节庆华丽感。`, meaning: `八角花纹象征四方八面皆得吉祥、生命开敷和家庭兴旺。八向展开的结构寓意祝福向外扩散，也表达人与天地方位、岁时循环之间的协调。`, usage: `八角花纹常用于胸前、背部、围腰中心、帽饰和包袋等位置，可作为视觉核心纹样。现代设计中适合用于徽章、标识、纹样系统、首饰和装饰图案，具有强烈的对称美和识别度。` },
                en: { name: `Octagonal Flower Pattern`, aliases: `Eight-Petal Flower Motif`, origin: `The octagonal flower motif comes from geometric floral expression in Yi embroidery and is linked to ideas of the eight directions, seasonal cycles, and spatial order. A natural flower is regularized into an eight-sided structure, showing the Yi ability to transform nature into cosmological pattern.`, visuals: `It usually centers on a dot or small circle, extending petals, angles, or diamond units in eight directions. Its symmetry is stable and dignified, while alternating reds, yellows, greens, and purples give the flower both geometric order and festive richness.`, meaning: `The motif symbolizes blessings in all directions, blooming life, and family prosperity. Its eight-way expansion suggests good fortune spreading outward and harmony between people, directions, and the cycle of time.`, usage: `It is often placed on the chest, back, apron center, headdresses, and bags as a strong visual focus. In modern design, it suits badges, logos, pattern systems, jewelry, and decorative graphics with powerful symmetry and recognition.` },
                jp: { name: `八角花紋`, aliases: `八弁花紋`, origin: `八角花紋は、イ族刺繍に多い幾何学的な花の表現に由来し、八方、四季、空間秩序の観念とも結びついています。花を整った八角構造に変えることで、自然の花形を宇宙秩序の図案へ転化する美意識を示します。`, visuals: `中心点または小円を核に、八方向へ花弁、角形、菱形単位を伸ばして構成されます。対称構造は安定して荘重であり、赤、黄、緑、紫を交互に用いることで幾何学的秩序と祭礼的な華やかさを兼ね備えます。`, meaning: `八角花紋は四方八方の吉祥、生命の開花、家の繁栄を象徴します。八方向へ広がる形は祝福が外へ広がることを意味し、人と方位、季節循環の調和も表します。`, usage: `胸、背中、前掛けの中心、頭飾り、袋などに置かれ、視覚的な中心文様として用いられます。現代では徽章、ロゴ、パターンシステム、装身具、装飾図案に適し、強い対称美と識別性を持ちます。` },
                fr: { name: `Motif de fleur octogonale`, aliases: `Motif de fleur à huit pétales`, origin: `Le motif de fleur octogonale vient de l’expression florale géométrique de la broderie Yi et se rattache aux idées des huit directions, des saisons et de l’ordre spatial. La fleur naturelle y devient une structure à huit côtés, montrant la capacité Yi à transformer la nature en schéma cosmologique.`, visuals: `Il prend généralement un point ou un petit cercle central, d’où partent pétales, angles ou losanges vers huit directions. La symétrie est stable et solennelle, tandis que rouges, jaunes, verts et violets alternés donnent à la fleur ordre géométrique et richesse festive.`, meaning: `Il symbolise les bénédictions dans toutes les directions, l’épanouissement de la vie et la prospérité familiale. L’expansion en huit sens évoque la diffusion de la chance et l’harmonie entre humains, orientations et cycles du temps.`, usage: `On le place souvent sur la poitrine, le dos, le centre du tablier, les coiffes et les sacs comme motif focal. Dans le design contemporain, il convient aux insignes, logos, systèmes de motifs, bijoux et graphismes décoratifs à forte symétrie.` },
                de: { name: `Achteckiges Blumenmuster`, aliases: `Achtblättriges Blumenmotiv`, origin: `Das achteckige Blumenmuster stammt aus geometrischen Blumendarstellungen der Yi-Stickerei und steht mit den acht Richtungen, Jahreszeiten und räumlicher Ordnung in Verbindung. Die natürliche Blume wird in eine achteckige Struktur überführt und zeigt die Fähigkeit der Yi, Natur in kosmische Ordnung zu verwandeln.`, visuals: `Meist bildet ein Punkt oder kleiner Kreis das Zentrum, von dem Blütenblätter, Winkel oder Rauten in acht Richtungen ausgehen. Die Symmetrie wirkt stabil und würdevoll; wechselnde Rot-, Gelb-, Grün- und Violetttöne verbinden geometrische Ordnung mit festlicher Pracht.`, meaning: `Das Motiv symbolisiert Segen in alle Richtungen, sich entfaltendes Leben und familiären Wohlstand. Die Ausbreitung in acht Richtungen verweist auf nach außen strömendes Glück und Harmonie zwischen Menschen, Richtungen und Zeitkreisläufen.`, usage: `Es wird häufig auf Brust, Rücken, Schürzenmitte, Kopfschmuck und Taschen als zentrales Bild eingesetzt. Modern eignet es sich für Abzeichen, Logos, Mustersysteme, Schmuck und Dekorgrafiken mit starker Symmetrie und Wiedererkennbarkeit.` },
                es: { name: `Motivo de flor octogonal`, aliases: `Motivo de flor de ocho pétalos`, origin: `El motivo de flor octogonal procede de la expresión floral geométrica del bordado Yi y se relaciona con las ocho direcciones, las estaciones y el orden espacial. La flor natural se regulariza en una estructura de ocho lados, mostrando la capacidad Yi de convertir la naturaleza en patrón cosmológico.`, visuals: `Suele centrarse en un punto o pequeño círculo del que salen pétalos, ángulos o rombos hacia ocho direcciones. La simetría es estable y solemne, mientras rojos, amarillos, verdes y violetas alternados dan a la flor orden geométrico y riqueza festiva.`, meaning: `Simboliza bendiciones en todas las direcciones, vida floreciente y prosperidad familiar. Su expansión en ocho sentidos sugiere fortuna que se difunde hacia afuera y armonía entre personas, orientaciones y ciclos del tiempo.`, usage: `Se coloca a menudo en pecho, espalda, centro del delantal, tocados y bolsas como motivo focal. En diseño contemporáneo encaja en insignias, logotipos, sistemas de patrones, joyería y gráficos decorativos con fuerte simetría y reconocimiento.` }
            },
            'stone-steps': {
                zh: { name: `石阶纹`, aliases: `阶梯纹`, origin: `石阶纹源于彝族山地村寨、坡地道路和石砌建筑的生活环境。层层石阶连接家屋、田地、山林和祭祀空间，记录了人们在高低起伏地形中修路而居的智慧。`, visuals: `纹样常以连续阶梯、折线、方块递进或错落平台构成，具有明显的上升方向和层次感。灰、褐、黑、金等色彩表现石材质感，也使图案兼具建筑秩序和山地节奏。`, meaning: `石阶纹象征步步上升、根基稳固、道路通达和世代积累。它把艰辛攀登转化为积极寓意，表达对家族进步、学业事业顺遂和生活稳步向前的祝愿。`, usage: `石阶纹适合用作衣摆、腰带、包袋、家居织品和空间装饰的边框，也可与窗格纹、火塘纹组合表现家园意象。现代设计中可用于导视系统、建筑文创、包装边框和数字界面，传达秩序与进取。` },
                en: { name: `Stone Steps Pattern`, aliases: `Stepped Stone Motif`, origin: `The stone-steps motif comes from Yi mountain villages, sloping paths, and stone-built environments. Layered steps connect houses, fields, forests, and ritual spaces, recording the wisdom of building roads and homes in rugged terrain.`, visuals: `It is often composed of continuous steps, zigzags, progressive blocks, or staggered platforms, with a clear upward direction and layered structure. Gray, brown, black, and gold convey the texture of stone while giving the pattern both architectural order and mountain rhythm.`, meaning: `The motif symbolizes rising step by step, firm foundations, open pathways, and accumulated effort across generations. It turns difficult climbing into a positive sign, carrying wishes for family progress, success in study and work, and steady advancement in life.`, usage: `It works well as borders for hems, belts, bags, household textiles, and spatial decoration, and can be paired with window-lattice or hearth motifs to evoke the home. In modern design, it suits wayfinding systems, architectural cultural products, packaging frames, and digital interfaces expressing order and progress.` },
                jp: { name: `石段紋`, aliases: `階段紋`, origin: `石段紋は、イ族の山地村落、斜面の道、石造りの生活環境に由来します。重なる石段は家屋、畑、山林、祭祀空間を結び、起伏の大きい地形で道を築き暮らしてきた知恵を記録しています。`, visuals: `連続する階段、折れ線、進行する方形、ずれた平台で構成され、明確な上昇方向と層の構造を持ちます。灰色、褐色、黒、金色は石材の質感を表し、建築的秩序と山地のリズムを兼ね備えます。`, meaning: `石段紋は一歩ずつ上ること、堅い基盤、道の通達、世代を越えた蓄積を象徴します。困難な登りを前向きな意味に変え、家族の進歩、学業や仕事の順調、暮らしが着実に前へ進むことを願います。`, usage: `裾、帯、袋、家庭用織物、空間装飾の縁に適し、窓格子紋や火塘紋と組み合わせて家のイメージを表せます。現代では案内システム、建築文創、包装の枠、デジタル画面に用いられ、秩序と向上を伝えます。` },
                fr: { name: `Motif de marches de pierre`, aliases: `Motif d’escalier de pierre`, origin: `Le motif de marches de pierre vient des villages de montagne Yi, des chemins en pente et des constructions en pierre. Les marches relient maisons, champs, forêts et lieux rituels, gardant la mémoire de la sagesse nécessaire pour bâtir routes et foyers dans un relief accidenté.`, visuals: `Il se compose de marches continues, de lignes brisées, de blocs progressifs ou de plateformes décalées, avec une direction ascendante et une structure en couches. Gris, brun, noir et or suggèrent la matière de la pierre et donnent au motif ordre architectural et rythme montagnard.`, meaning: `Il symbolise l’élévation pas à pas, les bases solides, les chemins ouverts et l’accumulation des efforts entre générations. Il transforme l’ascension difficile en signe positif, portant des vœux de progrès familial, de réussite et d’avancée stable dans la vie.`, usage: `Il convient aux bordures d’ourlets, ceintures, sacs, textiles domestiques et décors d’espace, et peut s’associer au treillis de fenêtre ou au foyer pour évoquer la maison. Dans le design moderne, il s’adapte à la signalétique, aux produits culturels architecturaux, cadres d’emballage et interfaces numériques exprimant ordre et progression.` },
                de: { name: `Steinstufenmuster`, aliases: `Treppenstein-Motiv`, origin: `Das Steinstufenmuster stammt aus Yi-Bergdörfern, Hangwegen und steinernen Bauumgebungen. Gestufte Steine verbinden Häuser, Felder, Wälder und Ritualräume und bewahren die Weisheit, in unebenem Gelände Wege und Wohnorte zu schaffen.`, visuals: `Es besteht aus fortlaufenden Stufen, Zickzacklinien, ansteigenden Blöcken oder versetzten Plattformen mit klarer Aufwärtsrichtung und Schichtung. Grau, Braun, Schwarz und Gold vermitteln Steintextur und verbinden architektonische Ordnung mit Bergrhythmus.`, meaning: `Das Motiv symbolisiert Schritt-für-Schritt-Aufstieg, feste Grundlagen, offene Wege und generationenübergreifende Anstrengung. Es verwandelt mühsames Klettern in ein positives Zeichen und trägt Wünsche nach familiärem Fortschritt, Erfolg in Lernen und Arbeit sowie stetigem Vorankommen.`, usage: `Es eignet sich als Bordüre für Säume, Gürtel, Taschen, Heimtextilien und Raumdekoration und kann mit Fenstergitter- oder Herdmotiven Heimatbilder erzeugen. Modern passt es zu Leitsystemen, architektonischen Kulturprodukten, Verpackungsrahmen und digitalen Interfaces, die Ordnung und Fortschritt ausdrücken.` },
                es: { name: `Motivo de escalones de piedra`, aliases: `Motivo de escalinata de piedra`, origin: `El motivo de escalones de piedra procede de aldeas montañosas Yi, caminos en pendiente y construcciones de piedra. Los escalones conectan casas, campos, bosques y espacios rituales, registrando la sabiduría de abrir caminos y vivir en terrenos accidentados.`, visuals: `Se compone de escalones continuos, líneas quebradas, bloques progresivos o plataformas escalonadas, con dirección ascendente y capas claras. Grises, marrones, negros y dorados expresan la textura de la piedra y dan al motivo orden arquitectónico y ritmo de montaña.`, meaning: `Simboliza ascender paso a paso, bases firmes, caminos abiertos y esfuerzo acumulado entre generaciones. Convierte la subida difícil en signo positivo, con deseos de progreso familiar, éxito en estudios y trabajo, y avance estable en la vida.`, usage: `Funciona como borde en bajos, cinturones, bolsas, textiles domésticos y decoración espacial, y puede combinarse con celosías o fogones para evocar el hogar. En diseño contemporáneo se adapta a señalética, productos culturales arquitectónicos, marcos de empaque e interfaces digitales que expresan orden y progreso.` }
            }
        });

        // 当前状态
        let currentLang = 'zh';
        let currentCategory = 'all';
        let currentColor = '';
        let searchQuery = '';

        // 翻译函数
        function t(key) {
            return translations[currentLang][key] || key;
        }

        // 获取纹样名称
        function getPatternName(pattern) {
            return getPatternField(pattern, 'name');
        }

        function getPatternField(pattern, field) {
            return patternTranslations[pattern.id]?.[currentLang]?.[field] || pattern[field][currentLang] || pattern[field].zh;
        }

        // 获取分类名称
        function getCategoryName(category) {
            return translations[currentLang].categories[category] || category;
        }

        // 更新界面文本
        function updateUI() {
            document.getElementById('navTitle').textContent = translations[currentLang].nav.home;
            document.getElementById('heroTitle').textContent = translations[currentLang].home.title;
            document.getElementById('heroSubtitle').textContent = translations[currentLang].home.subtitle;
            document.getElementById('heroIntro').textContent = translations[currentLang].home.intro;
            document.getElementById('searchInput').placeholder = translations[currentLang].home.searchPlaceholder;
            document.getElementById('backBtn').textContent = translations[currentLang].nav.back;
            document.getElementById('footerText').textContent = 'Made with ❤️ for Yi Culture Heritage | ' + translations[currentLang].footer.copyright;

            // 更新语言按钮
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });

            renderPatterns();
        }

        // 过滤纹样
        function getFilteredPatterns() {
            return patternsData.filter(p => {
                // 分类过滤
                if (currentCategory !== 'all' && p.category !== currentCategory) return false;

                // 颜色过滤
                if (currentColor && !p.colors.includes(currentColor)) return false;

                // 搜索过滤
                if (searchQuery) {
                    const query = searchQuery.toLowerCase();
                    const name = getPatternName(p).toLowerCase();
                    const meaning = getPatternField(p, 'meaning').toLowerCase();
                    if (!name.includes(query) && !meaning.includes(query)) return false;
                }

                return true;
            });
        }

        // 渲染纹样卡片
        function renderPatterns() {
            const container = document.getElementById('patternContainer');
            const filtered = getFilteredPatterns();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <h3>${translations[currentLang].noResults}</h3>
                    </div>
                `;
                return;
            }

            // 按分类分组
            const categories = ['celestial', 'animal', 'plant', 'artifact'];
            let html = '';

            categories.forEach(cat => {
                const catPatterns = filtered.filter(p => p.category === cat);
                if (catPatterns.length === 0) return;

                html += `
                    <div class="category-section">
                        <h2 class="category-title">
                            <span>${getCategoryName(cat)}</span>
                            <div class="category-line"></div>
                        </h2>
                        <div class="pattern-grid">
                            ${catPatterns.map(p => `
                                <div class="pattern-card" onclick="openModal('${p.id}')">
                                    <div class="card-image">
                                        <img src="${p.image}" alt="${getPatternName(p)}" loading="lazy">
                                    </div>
                                    <div class="card-content">
                                        <div class="card-category">${getCategoryName(p.category)}</div>
                                        <h3 class="card-title">${getPatternName(p)}</h3>
                                        <p class="card-desc">${getPatternField(p, 'meaning')}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 打开详情弹窗
        function openModal(id) {
            const pattern = patternsData.find(p => p.id === id);
            if (!pattern) return;

            const modalBody = document.getElementById('modalBody');
            const d = translations[currentLang].detail;

            modalBody.innerHTML = `
                <div class="modal-image">
                    <img src="${pattern.image}" alt="${getPatternName(pattern)}">
                </div>
                <div class="modal-category">${getCategoryName(pattern.category)}</div>
                <h2 class="modal-title">${getPatternName(pattern)}</h2>
                <p class="modal-aliases">${d.aliases}: ${getPatternField(pattern, 'aliases')}</p>

                <div class="info-section">
                    <div class="info-title">${d.origin}</div>
                    <div class="info-text">${getPatternField(pattern, 'origin')}</div>
                </div>

                <div class="info-section">
                    <div class="info-title">${d.visuals}</div>
                    <div class="info-text">${getPatternField(pattern, 'visuals')}</div>
                </div>

                <div class="info-section">
                    <div class="info-title">${d.meaning}</div>
                    <div class="info-text">${getPatternField(pattern, 'meaning')}</div>
                </div>

                <div class="info-section">
                    <div class="info-title">${d.usage}</div>
                    <div class="info-text">${getPatternField(pattern, 'usage')}</div>
                </div>
            `;

            document.getElementById('modal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            document.body.style.overflow = '';
        }

        // 事件监听
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentLang = btn.dataset.lang;
                updateUI();
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderPatterns();
        });

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = btn.dataset.color;
                renderPatterns();
            });
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // 初始化
        updateUI();
    </script>
</body>
</html>
