                es: { name: `Motivo de azalea roja`, aliases: `Motivo de azalea`, origin: `La azalea roja, o mayinghua, crece en las altas montañas de las regiones Yi y florece a comienzos de primavera con un rojo intenso. Ocupa un lugar importante en la memoria de la Fiesta de las Antorchas, la vida de montaña y la estética popular, expresando primavera, fuego y renovación vital.`, visuals: `El motivo suele abstraer racimos de azaleas rojas, con corolas llenas acompañadas de ramas y hojas. El rojo actúa como color principal y contrasta con negro, amarillo o verde para crear una intensidad visual semejante a la llama.`, meaning: `La azalea roja simboliza vitalidad tenaz, pasión y el espíritu comunitario que nunca se interrumpe. Al florecer tras el frío de comienzos de primavera, también sugiere esperanza, belleza juvenil y renovación de la vida.`, usage: `El motivo de azalea roja se usa a menudo en trajes de la Fiesta de las Antorchas, ropa de boda y atuendos festivos femeninos, siendo uno de los motivos vegetales más celebratorios. En el diseño moderno, resulta adecuado para expresar calidez, bendición e imágenes florales de la cultura montañesa Yi.` }
            },
            azalea: {
                zh: { origin: `索玛花是彝族对高山杜鹃类花卉的亲切称呼，广泛生长于彝区山坡和高地。每逢花开，山野成片明亮，因此它成为彝族山地生活、春日记忆和民族情感的重要植物意象。`, visuals: `索玛花纹常表现成团簇盛开的花朵，花瓣舒展，层次明快。色彩可有粉红、紫红、玫红等变化，并常配以绿色枝叶，形成柔和而富有节奏的装饰效果。`, meaning: `索玛花象征不畏艰难、向阳而生的生命力量，也寄托对美好季节和幸福生活的向往。它从贫瘠山地中绽放，因而常被理解为坚韧、纯净和希望的象征。`, usage: `索玛花纹常用于节庆服饰、围腰、披肩和年轻女性装束，营造明丽、亲切的山花气息。如今也常被用于地方文化视觉、旅游文创和民族刺绣作品中，代表彝族山地花季的浪漫记忆。` },
                en: { origin: `Soma flower is the Yi name for high-mountain rhododendrons, which grow widely on slopes and uplands in Yi regions. When they bloom, whole hillsides become bright with color, making the flower an important image of mountain life, spring memory, and ethnic emotion.`, visuals: `The Soma flower motif is often shown as clusters of blooming flowers with open petals and clear layers. Its colors may range from pink to violet-red and rose, usually accompanied by green leaves to create a soft, rhythmic decorative effect.`, meaning: `The Soma flower symbolizes the life force that faces hardship and grows toward the sun, as well as the longing for a beautiful season and a happy life. Blooming from rugged mountain land, it is also understood as a sign of resilience, purity, and hope.`, usage: `Soma flower patterns are often used on festival garments, aprons, shawls, and young women’s attire, bringing a bright and familiar mountain-flower feeling. Today they also appear in local visual identity, tourism products, and ethnic embroidery as romantic symbols of the Yi mountain blooming season.` },
                jp: { origin: `ソマ花は高山のツツジ類に対するイ族の親しみある呼び名で、イ族地域の山腹や高地に広く生育します。花の季節には山野一面が明るく染まり、山地の暮らし、春の記憶、民族感情を象徴する重要な植物イメージとなっています。`, visuals: `ソマ花文様は、花が群れ咲く姿を表すことが多く、開いた花弁と明快な層が特徴です。色は桃色、紫紅、ローズ色などに変化し、緑の枝葉と組み合わせて柔らかくリズミカルな装飾効果を生みます。`, meaning: `ソマ花は困難を恐れず太陽へ向かって伸びる生命力を象徴し、美しい季節と幸福な暮らしへの願いも託されています。厳しい山地に咲く花であるため、粘り強さ、清らかさ、希望のしるしとも理解されます。`, usage: `ソマ花文様は祭礼衣装、前掛け、肩掛け、若い女性の装いによく使われ、明るく親しみやすい山花の雰囲気を添えます。現在では地域文化のビジュアル、観光文創、民族刺繍にも用いられ、イ族山地の花季を表すロマンチックな象徴となっています。` },
                fr: { name: `Motif de fleur Soma`, aliases: `Motif de rhododendron`, origin: `La fleur Soma est le nom affectueux donné par les Yi aux rhododendrons de haute montagne, largement présents sur les pentes et les hauts plateaux des régions Yi. Lorsque ces fleurs s’épanouissent, les montagnes s’illuminent de couleur, faisant d’elles une image majeure de la vie montagnarde, du souvenir du printemps et de l’émotion ethnique.`, visuals: `Le motif représente souvent des fleurs groupées en pleine floraison, aux pétales ouverts et aux couches bien lisibles. Les couleurs varient du rose au pourpre et au rouge rosé, généralement accompagnées de feuilles vertes pour créer un effet décoratif doux et rythmé.`, meaning: `La fleur Soma symbolise la force vitale qui ne craint pas les difficultés et pousse vers le soleil, ainsi que l’aspiration à une belle saison et à une vie heureuse. Fleurissant sur des terres de montagne rudes, elle évoque aussi la résistance, la pureté et l’espoir.`, usage: `Le motif Soma est fréquent sur les vêtements de fête, les tabliers, les châles et les tenues de jeunes femmes, auxquels il apporte l’éclat familier des fleurs de montagne. Aujourd’hui, il apparaît aussi dans l’identité visuelle locale, les créations touristiques et la broderie ethnique comme symbole romantique de la saison fleurie des montagnes Yi.` },
                de: { name: `Soma-Blütenmuster`, aliases: `Rhododendronmuster`, origin: `Soma-Blüte ist die liebevolle Yi-Bezeichnung für Hochgebirgs-Rhododendren, die in den Yi-Gebieten an Hängen und auf Hochlagen weit verbreitet sind. Wenn sie blühen, leuchten ganze Berglandschaften, weshalb sie zu einem wichtigen Bild für Bergleben, Frühlingserinnerung und ethnische Gefühle geworden sind.`, visuals: `Das Motiv zeigt oft in Gruppen blühende Blumen mit geöffneten Blütenblättern und klaren Schichten. Die Farben reichen von Rosa über Purpurrot bis Rosenrot und werden meist mit grünen Blättern kombiniert, um eine weiche, rhythmische Dekoration zu bilden.`, meaning: `Die Soma-Blüte symbolisiert Lebenskraft, die Schwierigkeiten nicht fürchtet und der Sonne entgegenwächst, sowie die Sehnsucht nach schöner Jahreszeit und glücklichem Leben. Da sie auf kargem Bergland blüht, steht sie auch für Widerstandsfähigkeit, Reinheit und Hoffnung.`, usage: `Soma-Blütenmuster werden häufig auf Festkleidung, Schürzen, Schultertüchern und Kleidung junger Frauen verwendet und bringen die helle Vertrautheit von Bergblumen ein. Heute erscheinen sie auch in regionalem visuellen Design, touristischen Kulturprodukten und ethnischer Stickerei als romantisches Symbol der Blütezeit in den Yi-Bergen.` },
                es: { name: `Motivo de flor Soma`, aliases: `Motivo de rododendro`, origin: `La flor Soma es el nombre afectuoso que los Yi dan a los rododendros de alta montaña, muy extendidos en laderas y tierras altas de las regiones Yi. Cuando florecen, las montañas se iluminan de color, por lo que la flor se convierte en una imagen importante de la vida montañesa, la memoria primaveral y la emoción étnica.`, visuals: `El motivo suele representar flores agrupadas en plena floración, con pétalos abiertos y capas claras. Sus colores van del rosa al rojo violáceo y al rojo rosado, generalmente acompañados de hojas verdes para crear un efecto decorativo suave y rítmico.`, meaning: `La flor Soma simboliza la fuerza vital que no teme las dificultades y crece hacia el sol, además del deseo de una estación hermosa y una vida feliz. Al florecer en tierras montañosas duras, también se entiende como signo de resistencia, pureza y esperanza.`, usage: `El motivo de flor Soma se usa con frecuencia en trajes festivos, delantales, chales y atuendos de mujeres jóvenes, aportando una sensación luminosa y cercana de flores de montaña. Hoy aparece también en identidad visual local, productos culturales turísticos y bordados étnicos como símbolo romántico de la temporada floral en las montañas Yi.` }
            }
        });

        Object.assign(patternTranslations, {
            'fruit-tree': {
                zh: { origin: `果树纹源于彝族依山而居、采集林果和经营山地资源的生活经验。果树在传统观念中既代表自然馈赠，也代表经过劳作获得的收成，因此成为丰足生活的重要象征。`, visuals: `纹样常表现树干、枝叶和累累果实，构图可呈中心树形或左右对称展开。圆点、椭圆和小花形常用来表现果实，繁密的枝叶营造出丰收、繁茂和向上生长的视觉感受。`, meaning: `果树纹象征粮仓充盈、子孙兴旺和生活富足，也表达对山林资源和土地恩赐的感念。树根扎地、枝叶向上、果实满枝的结构，寓意家庭根基稳固、未来持续生长。`, usage: `果树纹常用于儿童服饰、围腰、家用织物、包袋和节庆装饰，传递长辈对丰衣足食的祝愿。现代文创中，它适合应用于家居、包装、插画和亲子类产品，表现丰收与成长主题。` },
                en: { origin: `The fruit-tree motif comes from Yi experiences of living by the mountains, gathering forest fruits, and managing upland resources. In traditional thought, fruit trees represent both nature’s gifts and the harvest gained through labor, becoming an important symbol of abundance.`, visuals: `It often shows a trunk, branches, leaves, and plentiful fruit, arranged either as a central tree or in symmetrical expansion. Dots, ovals, and small floral forms are used for fruit, while dense foliage creates a sense of harvest, prosperity, and upward growth.`, meaning: `The motif symbolizes full granaries, flourishing descendants, and material abundance, as well as gratitude for mountain resources and the gifts of the land. Roots in the earth, branches reaching upward, and fruit-filled boughs suggest a stable family foundation and continuous growth.`, usage: `It is often used on children’s clothing, aprons, household textiles, bags, and festive decorations to convey elders’ wishes for plentiful food and clothing. In contemporary cultural products, it suits homeware, packaging, illustration, and parent-child themes centered on harvest and growth.` },
                jp: { origin: `果樹紋は、山に依拠して暮らし、林の果実を採集し、山地資源を営んできたイ族の生活経験に由来します。伝統的な観念では、果樹は自然の恵みであると同時に労働によって得られる収穫を表し、豊かな暮らしの重要な象徴となりました。`, visuals: `文様は幹、枝葉、たわわに実る果実を表し、中心に一本の木を置く構図や左右対称に広がる構図があります。点、楕円、小花形で果実を表し、密な枝葉によって収穫、繁茂、上へ伸びる力を感じさせます。`, meaning: `果樹紋は穀倉の充実、子孫繁栄、生活の豊かさを象徴し、山林資源と土地の恵みへの感謝も表します。大地に根を張り、枝葉が上へ伸び、果実が満ちる姿は、家の基盤の安定と未来の継続的な成長を意味します。`, usage: `子どもの衣服、前掛け、家庭用織物、袋、祭礼装飾によく用いられ、衣食に恵まれるようにという年長者の願いを伝えます。現代の文創では、家居用品、包装、イラスト、親子向け商品に適し、収穫と成長のテーマを表します。` },
                fr: { name: `Motif d’arbre fruitier`, aliases: `Symbole d’arbre fruitier`, origin: `Le motif d’arbre fruitier vient de l’expérience Yi d’une vie adossée aux montagnes, de la cueillette des fruits forestiers et de l’usage des ressources d’altitude. Dans la pensée traditionnelle, l’arbre fruitier représente à la fois le don de la nature et la récolte obtenue par le travail, devenant un symbole d’abondance.`, visuals: `Il montre souvent un tronc, des branches, des feuilles et de nombreux fruits, selon une composition centrée ou symétrique. Les points, ovales et petites formes florales figurent les fruits, tandis que la densité des feuilles crée une impression de récolte, de prospérité et de croissance ascendante.`, meaning: `Il symbolise des greniers pleins, une descendance florissante et une vie matérielle abondante, tout en exprimant la gratitude envers les ressources de la montagne et les dons de la terre. Les racines dans le sol, les branches dressées et les fruits nombreux évoquent la stabilité du foyer et la croissance continue de l’avenir.`, usage: `On le trouve sur les vêtements d’enfants, les tabliers, les textiles domestiques, les sacs et les décorations de fête, porteur de vœux d’abondance alimentaire et vestimentaire. Dans la création contemporaine, il convient aux objets de maison, emballages, illustrations et produits familiaux autour des thèmes de récolte et de croissance.` },
                de: { name: `Obstbaummuster`, aliases: `Obstbaum-Symbol`, origin: `Das Obstbaummuster entspringt den Erfahrungen der Yi, in den Bergen zu leben, Waldfrüchte zu sammeln und Hochlandressourcen zu nutzen. In traditionellen Vorstellungen steht der Obstbaum zugleich für Naturgaben und durch Arbeit gewonnene Ernte und wurde so zu einem wichtigen Zeichen des Überflusses.`, visuals: `Das Motiv zeigt häufig Stamm, Äste, Blätter und reichlich Früchte, entweder als zentraler Baum oder in symmetrischer Ausbreitung. Punkte, Ovale und kleine Blütenformen stellen Früchte dar, dichtes Laub vermittelt Ernte, Wohlstand und aufwärts gerichtetes Wachstum.`, meaning: `Es symbolisiert volle Speicher, zahlreiche Nachkommen und materiellen Wohlstand sowie Dankbarkeit für Bergressourcen und die Gaben des Bodens. Wurzeln in der Erde, aufstrebende Äste und fruchtbeladene Zweige verweisen auf ein stabiles Familienfundament und stetiges Wachstum in die Zukunft.`, usage: `Das Muster erscheint auf Kinderkleidung, Schürzen, Heimtextilien, Taschen und Festdekorationen, um Wünsche nach genügend Nahrung und Kleidung zu übermitteln. In zeitgenössischen Kulturprodukten eignet es sich für Wohnobjekte, Verpackungen, Illustrationen und Familienprodukte zu den Themen Ernte und Wachstum.` },
                es: { name: `Motivo de árbol frutal`, aliases: `Símbolo de árbol frutal`, origin: `El motivo de árbol frutal procede de la experiencia Yi de vivir junto a las montañas, recolectar frutos del bosque y gestionar recursos de altura. En la tradición, el árbol frutal representa tanto los dones de la naturaleza como la cosecha obtenida mediante el trabajo, convirtiéndose en símbolo de abundancia.`, visuals: `Suele mostrar tronco, ramas, hojas y numerosos frutos, ya sea como árbol central o en expansión simétrica. Puntos, óvalos y pequeñas formas florales representan los frutos, mientras el follaje denso crea una sensación de cosecha, prosperidad y crecimiento ascendente.`, meaning: `Simboliza graneros llenos, descendencia floreciente y abundancia material, además de gratitud por los recursos de la montaña y los dones de la tierra. Las raíces firmes, las ramas que suben y los frutos abundantes sugieren una base familiar estable y crecimiento continuo hacia el futuro.`, usage: `Aparece en ropa infantil, delantales, textiles domésticos, bolsas y decoraciones festivas, transmitiendo deseos de comida y vestido abundantes. En productos culturales contemporáneos se adapta a objetos del hogar, empaques, ilustraciones y productos familiares centrados en la cosecha y el crecimiento.` }
            },
            fern: {
                zh: { origin: `蕨草纹来自彝区山林中常见的蕨类植物，也与早期生活中采食蕨根、度过饥荒的记忆相关。蕨草能在湿润山地迅速萌发，成为彝族观察自然复苏和顽强生长的重要植物意象。`, visuals: `纹样常提取蕨芽卷曲舒展的形态，呈螺旋、弯钩或连续卷草状。细长叶片和回旋线条使图案既有柔韧感，也有向外伸展、从内生发的生命节奏。`, meaning: `蕨草纹象征逆境中的生存智慧、坚韧和复苏能力。它提醒人们记住艰难岁月中的山林馈赠，也表达从困境中重新生长、不断延续的精神。`, usage: `蕨草纹多用于日常衣物、袖口、衣襟边饰和家用织品，适合表现朴素而坚韧的生活美感。现代设计中，它可用于自然主题图案、环保文创和纺织纹理，传达山地生态与生命更新。` },
                en: { origin: `The fern motif comes from ferns commonly found in Yi mountain forests and is also linked to memories of gathering fern roots as food during difficult times. Ferns sprout quickly in moist uplands, making them an important plant image of natural renewal and resilient growth.`, visuals: `The motif often extracts the curled and unfolding form of young fern shoots, appearing as spirals, hooks, or continuous scrolling leaves. Slender leaflets and turning lines give the pattern both flexibility and an outward-growing rhythm from within.`, meaning: `It symbolizes survival wisdom, resilience, and the ability to recover in adversity. The motif reminds people of the mountain forest’s gifts during hard years and expresses the spirit of growing again from difficulty.`, usage: `Fern patterns are often used on everyday clothing, cuffs, garment edges, and household textiles, conveying a plain yet resilient beauty. In modern design, they suit nature-themed patterns, eco-cultural products, and textile textures that speak of mountain ecology and renewal.` },
                jp: { origin: `蕨草紋はイ族地域の山林に多く見られるシダ植物に由来し、かつて蕨根を食べて飢饉をしのいだ記憶とも関係しています。湿った山地で素早く芽吹くシダは、自然の回復とたくましい成長を示す重要な植物イメージとなりました。`, visuals: `若いシダの芽が巻きながら開く姿を取り入れ、渦巻き、鉤形、連続する唐草状の形で表されます。細長い葉と回転する線は、しなやかさと、内側から外へ伸びる生命のリズムを生み出します。`, meaning: `蕨草紋は逆境の中で生きる知恵、粘り強さ、再生する力を象徴します。困難な時代に山林が与えた恵みを忘れないよう促し、苦境から再び伸びていく精神を表します。`, usage: `日常衣服、袖口、衣服の縁飾り、家庭用織物によく用いられ、素朴でたくましい生活美を伝えます。現代では自然テーマの図案、環境系文創、テキスタイルの質感表現に適し、山地生態と生命の更新を伝えます。` },
                fr: { name: `Motif de fougère`, aliases: `Motif de feuille de fougère`, origin: `Le motif de fougère vient des plantes courantes dans les forêts de montagne Yi et se rattache aussi au souvenir de la consommation de racines de fougère durant les périodes difficiles. La fougère pousse rapidement dans les hauteurs humides, devenant une image de renouveau naturel et de croissance résistante.`, visuals: `Il reprend souvent la forme enroulée puis déployée des jeunes pousses, sous forme de spirales, de crochets ou de feuilles déroulées en continu. Les folioles fines et les lignes tournantes donnent au motif souplesse et rythme de croissance partant de l’intérieur vers l’extérieur.`, meaning: `Il symbolise la sagesse de survie, la résistance et la capacité de se relever dans l’adversité. Le motif rappelle les dons de la forêt de montagne dans les années difficiles et exprime l’esprit de renaître après l’épreuve.`, usage: `On l’emploie souvent sur les vêtements quotidiens, les poignets, les bordures de vêtements et les textiles domestiques, pour une beauté simple mais tenace. Dans le design moderne, il convient aux motifs naturels, aux produits culturels écologiques et aux textures textiles évoquant l’écologie de montagne et le renouveau.` },
                de: { name: `Farnmuster`, aliases: `Farnblattmuster`, origin: `Das Farnmuster stammt von den in den Yi-Bergwäldern verbreiteten Farnen und ist auch mit Erinnerungen an das Sammeln von Farnwurzeln in Notzeiten verbunden. Farne treiben in feuchten Höhenlagen schnell aus und wurden dadurch zu einem wichtigen Bild für natürliche Erneuerung und widerstandsfähiges Wachstum.`, visuals: `Das Motiv greift die eingerollte und sich entfaltende Form junger Farntriebe auf, als Spiralen, Haken oder fortlaufende Ranken. Schlanke Blättchen und kreisende Linien verleihen dem Muster Elastizität und einen Rhythmus des Wachstums von innen nach außen.`, meaning: `Es symbolisiert Überlebensklugheit, Widerstandskraft und die Fähigkeit, sich in schwierigen Zeiten zu erholen. Das Motiv erinnert an die Gaben des Bergwaldes in harten Jahren und drückt den Geist aus, aus der Not neu zu wachsen.`, usage: `Farnmuster werden häufig auf Alltagskleidung, Ärmelabschlüssen, Kleiderrändern und Heimtextilien eingesetzt und vermitteln eine schlichte, doch zähe Schönheit. Im modernen Design eignen sie sich für Naturmotive, ökologische Kulturprodukte und Textilstrukturen, die Bergökologie und Erneuerung ausdrücken.` },
                es: { name: `Motivo de helecho`, aliases: `Motivo de hoja de helecho`, origin: `El motivo de helecho proviene de las plantas comunes en los bosques montañosos Yi y se vincula también con la memoria de recolectar raíces de helecho como alimento en tiempos difíciles. El helecho brota rápidamente en zonas húmedas de altura, convirtiéndose en una imagen de renovación natural y crecimiento resistente.`, visuals: `El motivo toma la forma enrollada y desplegada de los brotes jóvenes, como espirales, ganchos o hojas continuas. Los foliolos delgados y las líneas giratorias dan al diseño flexibilidad y un ritmo de crecimiento desde el interior hacia afuera.`, meaning: `Simboliza sabiduría de supervivencia, resistencia y capacidad de recuperarse en la adversidad. Recuerda los dones del bosque de montaña durante los años difíciles y expresa el espíritu de volver a crecer después de la prueba.`, usage: `Se usa a menudo en ropa cotidiana, puños, bordes de prendas y textiles domésticos, transmitiendo una belleza sencilla pero resistente. En el diseño moderno se adapta a patrones naturales, productos culturales ecológicos y texturas textiles que comunican ecología de montaña y renovación vital.` }
            }
        });

        Object.assign(patternTranslations, {
            'fire-steel': {
                zh: { origin: `火镰是彝族传统生活中保存和取得火种的重要器具，常与火塘、火把和祭火礼俗相连。它不仅是实用工具，也象征人们从自然中获得光明、温暖与文明秩序的开端。`, visuals: `火镰纹多提取火镰弯曲、钩状或半环形的器物轮廓，线条硬朗而富有张力。纹样常配合火焰、火星或几何边饰，使静态工具呈现出击石取火时的动感。`, meaning: `火镰纹寓意火种不灭、家族兴旺，体现彝族对火神庇佑和生命延续的敬畏。它也象征勤劳、智慧与开创精神，提醒人们珍惜祖先传下的生存技艺。`, usage: `这一纹样常见于火把节服饰、祭祀用品和与火文化相关的装饰中，用来强化节庆的神圣气氛。现代设计中也可用于文创饰品、织物边纹和公共文化展示，传达彝族火文化的核心意象。` },
                en: { origin: `The fire steel was an important tool in traditional Yi life for preserving and kindling fire, closely connected with the hearth, torches, and fire-related rituals. Beyond its practical function, it marks the moment when people drew light, warmth, and social order from nature.`, visuals: `The motif usually extracts the curved, hooked, or semicircular outline of the fire steel, with firm and tense lines. It is often paired with flames, sparks, or geometric borders so that a static tool seems to carry the motion of striking fire from stone.`, meaning: `It signifies an undying flame, family prosperity, and Yi reverence for the fire deity’s protection and the continuation of life. It also symbolizes diligence, wisdom, and initiative, reminding people to value survival skills handed down by ancestors.`, usage: `This motif appears on Torch Festival clothing, ritual objects, and decorations related to fire culture, strengthening a sacred festive atmosphere. In modern design, it suits cultural accessories, textile borders, and public heritage displays that communicate the core image of Yi fire culture.` },
                jp: { origin: `火打ち金はイ族の伝統生活において火種を保ち、火を得るための重要な道具であり、火塘、松明、火に関する祭礼と深く結びついています。実用的な道具であるだけでなく、人々が自然から光、温かさ、文明の秩序を得た始まりを象徴します。`, visuals: `火打ち金文様は、曲がった形、鉤状、半円形の器物輪郭を取り入れ、硬く張りのある線で表されます。火炎、火花、幾何学的な縁文様と組み合わせることで、静かな道具に石を打って火を起こす動きを与えます。`, meaning: `火打ち金文様は火種が絶えないこと、家の繁栄、火神の加護と生命の継続への畏敬を意味します。また勤勉、知恵、開拓精神を象徴し、祖先から伝わる生存技術を大切にすることを思い起こさせます。`, usage: `火把節の衣装、祭祀用品、火文化に関わる装飾に用いられ、祭りの神聖な雰囲気を強めます。現代では文創アクセサリー、織物の縁飾り、公共文化展示に応用でき、イ族火文化の核心的イメージを伝えます。` },
                fr: { name: `Motif de briquet à silex`, aliases: `Motif d’allumage du feu`, origin: `Le briquet à silex était un outil important de la vie traditionnelle Yi pour conserver et obtenir le feu, étroitement lié au foyer, aux torches et aux rites du feu. Au-delà de son usage pratique, il marque le moment où les humains ont tiré de la nature lumière, chaleur et ordre civilisé.`, visuals: `Le motif reprend généralement la silhouette courbe, en crochet ou en demi-anneau du briquet, avec des lignes fermes et tendues. Il s’accompagne souvent de flammes, d’étincelles ou de bordures géométriques, donnant à l’outil immobile le mouvement de l’allumage par percussion.`, meaning: `Il signifie la flamme qui ne s’éteint pas, la prospérité familiale et le respect des Yi pour la protection du dieu du feu et la continuité de la vie. Il symbolise aussi le travail, la sagesse et l’esprit d’initiative, rappelant l’importance des techniques de survie transmises par les ancêtres.`, usage: `Ce motif apparaît sur les vêtements de la Fête des Torches, les objets rituels et les décorations liées à la culture du feu, renforçant l’atmosphère sacrée de la fête. Dans le design moderne, il convient aux accessoires culturels, bordures textiles et expositions patrimoniales publiques qui transmettent l’image centrale du feu chez les Yi.` },
                de: { name: `Feuerstahlmuster`, aliases: `Feuerschläger-Muster`, origin: `Der Feuerstahl war im traditionellen Leben der Yi ein wichtiges Werkzeug, um Feuer zu bewahren und zu entfachen, eng verbunden mit Herd, Fackeln und Feuerritualen. Über seine praktische Funktion hinaus bezeichnet er den Beginn, in dem Menschen Licht, Wärme und gesellschaftliche Ordnung aus der Natur gewannen.`, visuals: `Das Motiv greift meist den gebogenen, haken- oder halbkreisförmigen Umriss des Feuerstahls auf, mit festen und spannungsvollen Linien. Oft wird es mit Flammen, Funken oder geometrischen Bordüren kombiniert, sodass das ruhende Werkzeug die Bewegung des Feuerschlagens erhält.`, meaning: `Es steht für eine nie erlöschende Flamme, familiären Wohlstand und die Ehrfurcht der Yi vor dem Schutz des Feuergottes und der Fortdauer des Lebens. Zugleich symbolisiert es Fleiß, Weisheit und Pioniergeist und erinnert an die von den Vorfahren überlieferten Überlebenstechniken.`, usage: `Das Muster erscheint auf Kleidung zum Fackelfest, Ritualgegenständen und Dekorationen der Feuerkultur und verstärkt die sakrale Feststimmung. Im modernen Design eignet es sich für Kulturschmuck, Textilbordüren und öffentliche Kulturerbe-Präsentationen, die das Kernbild der Yi-Feuerkultur vermitteln.` },
                es: { name: `Motivo de eslabón de fuego`, aliases: `Motivo para encender fuego`, origin: `El eslabón de fuego fue una herramienta importante en la vida tradicional Yi para conservar y obtener fuego, estrechamente relacionada con el fogón, las antorchas y los rituales del fuego. Más allá de su función práctica, señala el momento en que las personas obtuvieron de la naturaleza luz, calor y orden civilizado.`, visuals: `El motivo suele extraer el contorno curvo, en gancho o semicircular del eslabón, con líneas firmes y tensas. A menudo se acompaña de llamas, chispas o bordes geométricos, de modo que una herramienta estática adquiere el movimiento de hacer fuego golpeando la piedra.`, meaning: `Significa una llama que no se apaga, prosperidad familiar y reverencia Yi por la protección del dios del fuego y la continuidad de la vida. También simboliza diligencia, sabiduría e iniciativa, recordando el valor de las técnicas de supervivencia transmitidas por los antepasados.`, usage: `Aparece en prendas de la Fiesta de las Antorchas, objetos rituales y decoraciones relacionadas con la cultura del fuego, reforzando la atmósfera sagrada de la celebración. En el diseño moderno se adapta a accesorios culturales, bordes textiles y muestras públicas de patrimonio que comunican la imagen central del fuego en la cultura Yi.` }
            },
            hearth: {
                zh: { origin: `火塘是彝族家庭生活和精神空间的中心，承担取暖、烹食、会客、祭祖和讲述家族记忆的功能。火塘纹源于传统三石火塘或家屋中心火位，浓缩了家、火与祖先之间的深层联系。`, visuals: `纹样常以三角石、圆环、放射线或围合结构表现火塘空间，中心可加入火苗、圆点或几何符号。整体构图强调向心性和稳定感，像家人围火而坐，也像火光向四周扩散。`, meaning: `火塘纹象征家庭团圆、温暖、祖先庇护和生命延续。火塘不只是生活设施，也是伦理秩序与家族记忆的核心，寓意家门兴旺、亲情凝聚和世代相传。`, usage: `火塘纹适用于围腰、披肩、家用织物、祭祀布饰和重要礼仪服饰，常作为具有中心意义的装饰。现代应用中，它可用于室内装饰、公共文化空间、品牌图形和社区视觉，表达归属与团聚。` },
                en: { origin: `The hearth is the center of Yi family life and spiritual space, used for warmth, cooking, receiving guests, ancestor rites, and telling family memories. The hearth motif comes from the traditional three-stone hearth or the fire place at the center of the house, condensing links among home, fire, and ancestry.`, visuals: `It often uses triangular stones, rings, radiating lines, or enclosed structures to represent the hearth space, sometimes adding flames, dots, or geometric symbols at the center. The composition stresses centripetal stability, like family members sitting around fire and firelight spreading outward.`, meaning: `The motif symbolizes family reunion, warmth, ancestral protection, and the continuation of life. The hearth is not only a household facility but also a center of ethical order and family memory, suggesting prosperity, affection, and intergenerational inheritance.`, usage: `It suits aprons, shawls, household textiles, ritual cloths, and important ceremonial garments, often serving as a central decorative symbol. In modern use, it can inform interior decoration, public cultural spaces, brand graphics, and community visuals that express belonging and reunion.` },
                jp: { origin: `火塘はイ族の家庭生活と精神空間の中心であり、暖を取ること、調理、客人を迎えること、祖先祭祀、家族の記憶を語る場として機能します。火塘文様は伝統的な三石火塘や家屋の中心の火の場所に由来し、家、火、祖先の深い結びつきを凝縮しています。`, visuals: `三角形の石、円環、放射線、囲い込む構造によって火塘空間を表し、中央に火苗、点、幾何記号を加えることもあります。構図は中心へ集まる安定感を重視し、家族が火を囲んで座る姿や、火の光が四方へ広がる様子を思わせます。`, meaning: `火塘文様は家族の団欒、温かさ、祖先の守護、生命の継続を象徴します。火塘は単なる生活設備ではなく、倫理秩序と家族記憶の中心であり、家の繁栄、親情の結束、世代を越えた継承を意味します。`, usage: `前掛け、肩掛け、家庭用織物、祭祀用布、重要な礼装に適し、中心的な意味を持つ装飾として用いられます。現代では室内装飾、公共文化空間、ブランド図形、コミュニティビジュアルに応用され、帰属と団欒を表現します。` },
                fr: { name: `Motif du foyer`, aliases: `Motif du foyer à feu`, origin: `Le foyer est le centre de la vie familiale et de l’espace spirituel Yi, servant à se chauffer, cuisiner, recevoir, honorer les ancêtres et transmettre les souvenirs familiaux. Le motif du foyer vient du foyer traditionnel à trois pierres ou de la place du feu au centre de la maison, concentrant les liens profonds entre maison, feu et ancêtres.`, visuals: `Il utilise souvent des pierres triangulaires, des anneaux, des lignes rayonnantes ou des structures fermées pour représenter l’espace du foyer, avec parfois une flamme, des points ou des signes géométriques au centre. La composition insiste sur la stabilité centripète, comme une famille assise autour du feu et une lumière qui se diffuse.`, meaning: `Il symbolise la réunion familiale, la chaleur, la protection ancestrale et la continuité de la vie. Le foyer n’est pas seulement un équipement domestique, mais le centre de l’ordre moral et de la mémoire familiale, évoquant prospérité, affection et transmission entre générations.`, usage: `Il convient aux tabliers, châles, textiles domestiques, étoffes rituelles et vêtements cérémoniels importants, souvent comme symbole décoratif central. Aujourd’hui, il peut inspirer la décoration intérieure, les espaces culturels publics, les graphismes de marque et les visuels communautaires exprimant appartenance et réunion.` },
                de: { name: `Herdmuster`, aliases: `Feuerstellenmuster`, origin: `Der Herd ist das Zentrum des familiären Lebens und des spirituellen Raums der Yi: Er dient zum Wärmen, Kochen, Empfangen von Gästen, Ahnenritualen und Erzählen von Familienerinnerungen. Das Herdmuster geht auf den traditionellen Dreisteinherd oder die Feuerstelle in der Hausmitte zurück und verdichtet die Verbindung von Haus, Feuer und Ahnen.`, visuals: `Es verwendet häufig dreieckige Steine, Ringe, Strahlenlinien oder geschlossene Formen, um den Herdraum darzustellen, manchmal mit Flammen, Punkten oder geometrischen Zeichen im Zentrum. Die Komposition betont zentrierende Stabilität, wie eine Familie um das Feuer und Licht, das nach außen strahlt.`, meaning: `Das Muster symbolisiert Familienzusammenkunft, Wärme, Ahnenschutz und die Fortdauer des Lebens. Der Herd ist nicht nur eine häusliche Einrichtung, sondern auch Mittelpunkt moralischer Ordnung und familiärer Erinnerung und steht für Wohlstand, Zusammenhalt und Weitergabe über Generationen.`, usage: `Es eignet sich für Schürzen, Schultertücher, Heimtextilien, Ritualtücher und wichtige Zeremonialkleidung und fungiert oft als zentrales Dekorzeichen. In der Gegenwart kann es Innenräume, öffentliche Kulturräume, Markenzeichnungen und Gemeinschaftsvisuals prägen, die Zugehörigkeit und Zusammenkunft ausdrücken.` },
                es: { name: `Motivo del hogar`, aliases: `Motivo del fogón`, origin: `El fogón es el centro de la vida familiar y del espacio espiritual Yi, usado para calentarse, cocinar, recibir visitas, honrar a los antepasados y narrar memorias familiares. El motivo del fogón procede del hogar tradicional de tres piedras o del lugar del fuego en el centro de la casa, condensando los vínculos entre hogar, fuego y ancestros.`, visuals: `Suele emplear piedras triangulares, anillos, líneas radiantes o estructuras cerradas para representar el espacio del fogón, a veces con llamas, puntos o signos geométricos en el centro. La composición enfatiza estabilidad centrípeta, como la familia sentada alrededor del fuego y la luz expandiéndose hacia afuera.`, meaning: `Simboliza reunión familiar, calor, protección ancestral y continuidad de la vida. El fogón no es solo una instalación doméstica, sino también centro del orden ético y la memoria familiar, evocando prosperidad, afecto y transmisión entre generaciones.`, usage: `Funciona en delantales, chales, textiles domésticos, telas rituales y prendas ceremoniales importantes, a menudo como símbolo decorativo central. En usos modernos puede inspirar decoración interior, espacios culturales públicos, gráficos de marca y visuales comunitarios que expresan pertenencia y reunión.` }
            },
            window: {
                zh: { origin: `窗格纹来自彝族传统民居中的木窗、栏格和建筑装饰，反映了人们对居住空间秩序与安全感的追求。窗既连接室内外，也让光线和空气进入家中，因此逐渐成为家宅安定与生活明朗的象征。`, visuals: `纹样以直线、横竖交错、菱形、方格和对称网格为主，结构规整清晰。与自然纹样相比，它更强调建筑感、秩序感和边框装饰性，常用于形成稳定的视觉分隔。`, meaning: `窗格纹象征家宅稳固、生活有序、内外沟通和光明进入。它表达对平安居所、亲族团结和日常安宁的愿望，也体现彝族将建筑经验转化为服饰装饰的智慧。`, usage: `窗格纹常作为衣襟、袖口、裙边、包袋和家用织物的边饰或分隔纹。现代设计中，它适合用于版式网格、空间导视、室内软装和图案系统，表现传统建筑的秩序美。` },
                en: { origin: `The window-lattice motif comes from wooden windows, railings, and architectural decoration in traditional Yi dwellings, reflecting a pursuit of order and safety in living space. A window connects inside and outside while bringing light and air into the home, so it became a symbol of household stability and clarity of life.`, visuals: `The motif is built from straight lines, crossing bars, diamonds, squares, and symmetrical grids. Compared with natural motifs, it emphasizes architectural structure, order, and border decoration, often creating stable visual divisions.`, meaning: `It symbolizes a secure home, ordered life, communication between inside and outside, and the entrance of light. It expresses wishes for a peaceful dwelling, family unity, and everyday calm, while showing how Yi people transformed architectural experience into textile ornament.`, usage: `Window-lattice motifs are often used as borders or separators on front panels, cuffs, skirt edges, bags, and household textiles. In contemporary design, they suit layout grids, spatial wayfinding, interior textiles, and pattern systems that highlight the ordered beauty of traditional architecture.` },
                jp: { origin: `窓格子文様は、イ族の伝統民居に見られる木窓、欄干、建築装飾に由来し、住空間の秩序と安心感への願いを反映しています。窓は内と外をつなぎ、光と空気を家に取り入れるため、家宅の安定と明るい暮らしの象徴となりました。`, visuals: `直線、縦横の交差、菱形、方格、対称的な格子を中心に構成され、整った明快な構造を持ちます。自然文様に比べて建築性、秩序感、縁飾りとしての機能を強調し、安定した視覚的区切りをつくります。`, meaning: `窓格子文様は家の安定、整った生活、内外の交流、光が入ることを象徴します。平安な住まい、親族の結束、日常の安らぎへの願いを表すとともに、建築経験を服飾装飾へ転化するイ族の知恵を示しています。`, usage: `衣襟、袖口、スカートの縁、袋、家庭用織物の縁飾りや区切り文様として用いられます。現代ではレイアウトグリッド、空間案内、室内ファブリック、パターンシステムに適し、伝統建築の秩序ある美を表します。` },
                fr: { name: `Motif de treillis de fenêtre`, aliases: `Motif de treillis en bois`, origin: `Le motif de treillis de fenêtre vient des fenêtres en bois, garde-corps et ornements architecturaux des habitations traditionnelles Yi, reflétant la recherche d’ordre et de sécurité dans l’espace domestique. La fenêtre relie l’intérieur et l’extérieur tout en faisant entrer lumière et air, devenant un symbole de stabilité du foyer et de clarté de la vie.`, visuals: `Il se construit avec des lignes droites, des croisements horizontaux et verticaux, des losanges, des carrés et des grilles symétriques. Par rapport aux motifs naturels, il insiste davantage sur la structure architecturale, l’ordre et la fonction de bordure, créant des divisions visuelles stables.`, meaning: `Il symbolise une maison sûre, une vie ordonnée, la communication entre dedans et dehors et l’entrée de la lumière. Il exprime le souhait d’un foyer paisible, d’une parenté unie et d’un quotidien serein, tout en montrant comment les Yi transforment l’expérience architecturale en ornement textile.`, usage: `On l’utilise souvent comme bordure ou motif de séparation sur les devants, poignets, bas de jupe, sacs et textiles domestiques. Dans le design contemporain, il convient aux grilles de mise en page, à la signalétique spatiale, aux textiles d’intérieur et aux systèmes de motifs qui soulignent la beauté ordonnée de l’architecture traditionnelle.` },
                de: { name: `Fenstergittermuster`, aliases: `Holzgittermuster`, origin: `Das Fenstergittermuster stammt von Holzfenstern, Geländern und architektonischen Verzierungen traditioneller Yi-Wohnhäuser und zeigt das Streben nach Ordnung und Sicherheit im Wohnraum. Das Fenster verbindet Innen und Außen und lässt Licht und Luft ins Haus, wodurch es zum Symbol für häusliche Stabilität und klare Lebensführung wurde.`, visuals: `Das Muster besteht aus geraden Linien, horizontalen und vertikalen Kreuzungen, Rauten, Quadraten und symmetrischen Gittern. Im Vergleich zu Naturmotiven betont es stärker architektonische Struktur, Ordnung und Randdekoration und schafft stabile visuelle Gliederungen.`, meaning: `Es symbolisiert ein sicheres Haus, geordnetes Leben, Verbindung zwischen Innen und Außen sowie das Eintreten von Licht. Es drückt Wünsche nach friedlichem Wohnen, familiärem Zusammenhalt und alltäglicher Ruhe aus und zeigt, wie die Yi architektonische Erfahrung in textile Ornamentik übertragen.`, usage: `Es wird häufig als Bordüre oder Trennmotiv an Vorderteilen, Ärmelabschlüssen, Rocksäumen, Taschen und Heimtextilien eingesetzt. In zeitgenössischem Design eignet es sich für Layout-Raster, räumliche Leitsysteme, Wohntextilien und Mustersysteme, die die geordnete Schönheit traditioneller Architektur hervorheben.` },
                es: { name: `Motivo de celosía de ventana`, aliases: `Motivo de celosía de madera`, origin: `El motivo de celosía de ventana procede de ventanas de madera, barandillas y decoraciones arquitectónicas de las viviendas tradicionales Yi, reflejando la búsqueda de orden y seguridad en el espacio doméstico. La ventana conecta interior y exterior y deja entrar luz y aire, por lo que se convirtió en símbolo de estabilidad del hogar y claridad de la vida.`, visuals: `Se construye con líneas rectas, cruces horizontales y verticales, rombos, cuadrados y rejillas simétricas. Frente a los motivos naturales, enfatiza más la estructura arquitectónica, el orden y la función de borde, creando divisiones visuales estables.`, meaning: `Simboliza un hogar seguro, una vida ordenada, comunicación entre dentro y fuera y la entrada de la luz. Expresa deseos de una vivienda tranquila, unión familiar y calma cotidiana, mostrando también cómo el pueblo Yi transforma la experiencia arquitectónica en ornamento textil.`, usage: `Se usa con frecuencia como borde o motivo separador en delanteros, puños, bajos de falda, bolsas y textiles domésticos. En el diseño contemporáneo encaja en retículas de composición, señalética espacial, textiles de interior y sistemas de patrones que destacan la belleza ordenada de la arquitectura tradicional.` }
            }
        });
