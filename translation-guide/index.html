<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译手册 | 彝族纹样</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --yi-red: #B51111;
            --yi-yellow: #F5D547;
            --yi-black: #121212;
            --yi-gold: #D4AF37;
        }

        body {
            font-family: 'Noto Sans TC', 'Microsoft YaHei', sans-serif;
            background-color: var(--yi-black);
            color: white;
            min-height: 100vh;
        }

        .translation-bg {
            background-image:
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(181, 17, 17, 0.05) 10px, rgba(181, 17, 17, 0.05) 20px),
                repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(245, 213, 71, 0.03) 10px, rgba(245, 213, 71, 0.03) 20px);
            min-height: 100vh;
            padding-bottom: 4rem;
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: linear-gradient(to bottom, rgba(18, 18, 18, 0.95), transparent);
            backdrop-filter: blur(10px);
        }

        .nav-content {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--yi-yellow), var(--yi-red), var(--yi-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .lang-switch {
            display: flex;
            gap: 0.4rem;
            padding: 0.25rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 24px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.65);
            padding: 0.4rem 0.8rem;
            border-radius: 18px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .lang-btn.active,
        .lang-btn:hover {
            background: var(--yi-yellow);
            color: var(--yi-black);
        }

        .back-btn {
            background: rgba(181, 17, 17, 0.3);
            border: 1px solid var(--yi-yellow);
            color: var(--yi-yellow);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: var(--yi-yellow);
            color: var(--yi-black);
        }

        /* Hero */
        .hero {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8rem 2rem 3rem;
            text-align: center;
        }

        .hero-title {
            font-family: 'Noto Serif TC', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--yi-yellow) 0%, var(--yi-red) 50%, var(--yi-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
            max-width: 600px;
        }

        /* 图片展示 - 全屏有缝隙 */
        .gallery-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .translation-image {
            width: 100%;
            display: block;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .translation-image:last-child {
            margin-bottom: 0;
        }

        /* 页脚 */
        .footer {
            padding: 3rem 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            margin-top: 4rem;
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
            }

            .hero {
                padding: 6rem 1rem 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="translation-bg">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="nav-content">
                <a href="../index.html" class="logo">彝族文化数字体验中心</a>
                <div class="nav-right">
                    <div class="lang-switch" id="langSwitch">
                        <button class="lang-btn active" data-lang="zh">中文</button>
                        <button class="lang-btn" data-lang="de">DE</button>
                        <button class="lang-btn" data-lang="fr">FR</button>
                        <button class="lang-btn" data-lang="ja">日本語</button>
                    </div>
                    <a href="../index.html" class="back-btn">← 返回首页</a>
                </div>
            </div>
        </nav>

        <!-- Hero -->
        <section class="hero">
            <h1 class="hero-title">翻译手册</h1>
            <p class="hero-subtitle">彝族纹样术语中英日对照</p>
        </section>

        <!-- 图片展示 -->
        <div class="gallery-container" id="galleryContainer"></div>

        <!-- 页脚 -->
        <footer class="footer">
            <p class="footer-text">Made with ❤️ for Yi Culture Heritage | 传承彝族文化</p>
        </footer>
    </div>

    <script>
        const guidePages = {
            zh: ['01.png', '02.png', '03.png', '04.png', '05.png', '06.png', '07.png', '08.png', '09.png', '11.png', '12.png', '13.png', '14.png', '15.png', '16.png', '17.png', '18.png', '19.png', '20.png', '21.png', '22.png', '23.png', '24.png'],
            de: ['de/01.png', 'de/02.png', 'de/03.png', 'de/04.png', 'de/05.png', 'de/06.png', 'de/07.png', 'de/08.png', 'de/09.png', 'de/10.png', 'de/11.png', 'de/12.png', 'de/13.png', 'de/14.png', 'de/15.png', 'de/16.png', 'de/17.png', 'de/18.png', 'de/19.png', 'de/20.png', 'de/21.png', 'de/22.png', 'de/23.png', 'de/24.png'],
            fr: ['fr/01.png', 'fr/02.png', 'fr/03.png', 'fr/04.png', 'fr/05.png', 'fr/06.png', 'fr/07.png', 'fr/08.png', 'fr/09.png', 'fr/10.png', 'fr/11.png', 'fr/12.png', 'fr/13.png', 'fr/14.png', 'fr/15.png', 'fr/16.png', 'fr/17.png', 'fr/18.png', 'fr/19.png', 'fr/20.png', 'fr/21.png', 'fr/22.png', 'fr/23.png', 'fr/24.png'],
            ja: ['ja/01.png', 'ja/02.png', 'ja/03.png', 'ja/04.png', 'ja/05.png', 'ja/06.png', 'ja/07.png', 'ja/08.png', 'ja/09.png', 'ja/10.png', 'ja/11.png', 'ja/12.png', 'ja/13.png', 'ja/14.png', 'ja/15.png', 'ja/16.png', 'ja/17.png', 'ja/18.png', 'ja/19.png', 'ja/20.png', 'ja/21.png', 'ja/22.png', 'ja/23.png', 'ja/24.png']
        };

        let currentLang = 'zh';

        function renderGuide(lang) {
            currentLang = guidePages[lang] ? lang : 'zh';
            const galleryContainer = document.getElementById('galleryContainer');
            galleryContainer.innerHTML = guidePages[currentLang].map((src, index) => `
                <img src="${src}" alt="翻译手册 第${index + 1}页" class="translation-image">
            `).join('');

            document.querySelectorAll('.lang-btn').forEach((button) => {
                button.classList.toggle('active', button.dataset.lang === currentLang);
            });
        }

        document.querySelectorAll('.lang-btn').forEach((button) => {
            button.addEventListener('click', () => renderGuide(button.dataset.lang));
        });

        renderGuide(currentLang);
    </script>
</body>
</html>
